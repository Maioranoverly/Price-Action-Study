1],"Dia de tendência começa na primeira hora ou perto; decidir várias vezes ao dia se o dia é de tendência e então operar só a."],[37,"c",[1,4],"Scalps contra um impulso costumam ter equação fraca; em tendência a chance passa de 50% para cerca de 60% ao entrar a favor."],[43,"s",[6],"Iniciantes veem o mercado esticado, não entram a favor da tendência e entram contra; a tela cria a ilusão de que não há espaço."],[39,"s",[4],"Aumentar stop e reduzir posição em dias de volatilidade muito alta de baixa; tendências caem além dos fundamentos e topos 'obrigado, meu Deus'."],[1,"s",[],"Tendência, swing, correção e perna; impulso e canal, ciclo de maturação da tendência, always in."],[4,"s",[],"Todos os movimentos fortes têm ao menos duas pernas; tendências se compõem de swings com 1 a 4 correções."]],"secs":[["Definição de tendência, swing, correção e perna",[]],["Impulso, canal e maturação da tendência",[14]],["Operar a favor: 80% das reversões falham; entrar no impulso",[11,18]],["Correções no impulso: H1, limit versus stop, fechamento no fim do dia",[7,8]],["Nova máxima: compras, realização ou vendas; projeção de cunha",[27,21]],["Tendência envelhece: bilateral e clímax final",[29,28]],["Reversão para baixa e queda abaixo de mínima de swing",[28]],["Mercado de baixa de 2008 e operar sem fundamentos",[]]],"tr":["Quem entra em impulso forte deve assumir stop abaixo do início ou ponto médio do impulso e reduzir a posição proporcionalmente, entrando a mercado ou em correção de um ou dois ticks.","Compradores colocam limit na mínima ou abaixo da barra anterior; a primeira correção cai poucos ticks. Quem usa stop acima da barra paga em probabilidade o que perde em preço."],"q":"ok","parts":[]},{"id":"l1c363","k":"livro","bk":1,"cap":363,"part":true,"t":"Parte IV: introdução (padrões comuns de tendências)","pg":363,"o":11.5,"why":"","res":"Introduz a classificação dos dias de tendência em tipos recorrentes: ajuda a se concentrar em operar a favor da tendência e em fazer swing. Entradas contra a tendência devem ser poucas e só scalps.","L":[[17,"s",[1],"Amplitude de abertura grande sugere impulso e canal; média sugere lateralidades em tendência; pequena sugere rompimento."],[14,"s",[1],"Abertura ampla costuma gerar impulso e depois dia de impulso e canal; vale reconhecer nos primeiros 30 a 60 minutos."],[7,"s",[3],"Os setups são os mesmos da lateralidade, mas pegue toda entrada a favor da tendência, por mais fraca que pareça."],[1,"s",[],"Se nenhum padrão de tendência aparece, presuma lateralidade e opere os dois lados; o dia pode mudar a qualquer momento."],[6,"s",[],"A amplitude da abertura e os primeiros 30-60 minutos indicam o tipo de dia."]],"secs":[],"tr":["Em tendência muito forte, todas as operações devem ser swings a favor, saindo parcialmente em scalps; contra a tendência só com reversão forte e rompimento de linha de tendência."],"q":"ok","parts":[]},{"id":"l2c1","k":"livro","bk":2,"cap":1,"part":false,"t":"Exemplos de Como Operar um Rompimento","pg":61,"o":109,"why":"","res":"Mostra, passo a passo, como entrar num rompimento forte em espiga (fechamento da barra, stop na base da espiga, posição pequena, alvo como movimento projetado) e como comprar correções e testes do ponto de rompimento.","L":[[18,"c",[1,2,3,4,5,6],"Entrar no fechamento da barra forte da espiga, risco abaixo da mínima mais baixa da espiga, posição reduzida, apertar o stop; entrar na correção é melhor que no rompimento do topo."],[21,"c",[5],"Com um spike de altura X, há chance de 60% a 80% de o preço ir ao menos X além dele; o alvo cresce conforme o spike cresce."],[10,"c",[2,3,4],"Entre a favor além de H1/L1, H2/L2 ou barra interna após o rompimento; deixe sempre um stop de entrada além do extremo do spike para não ficar fora. O teste desce na lacuna de rompimento."],[7,"e",[3],"Vários H1/H2 (L1/L2), ii e barras externas usados como entradas de correção, com sinal melhor quando o corpo aponta a favor da entrada."],[23,"s",[3,6],"Vender no fechamento de barra de baixa grande em tendência de alta não paga; comprar o fechamento dela, com alvo na máxima da barra e depois movimento projetado."],[14,"s",[1,2],"A fase de spike termina na primeira barra interna contra a tendência; depois vêm as correções da fase de canal."],[29,"s",[6],"Terceiro climax de compra seguido sem correção, e com pouco tempo, não justifica venda; touros realizam lucro. Três climax de venda levam realização de lucros pelos ursos."],[16,"e",[6],"A segunda entrada de gap da média e a entrada de 20 gap bars falham em dia de rompimento contra elas."],[39,"c",[4],"Stop inicial além da base do spike; mova para além da barra forte ou da micro lacuna; a premissa se perde se uma barra fecha além da barra forte, contra a operação."],[41,"c",[3,4,5],"Entrar pequeno se o risco é 3x o normal; reforçar na espiga e em correções sem passar do risco normal; realizar parcial."],[38,"s",[3],"Compra a mercado, em recuo de um ou dois ticks, limit na mínima ou stop acima de H1; stop de última chance acima da espiga."],[37,"c",[1,3],"Chance de 60% de ganhar o equivalente ao risco torna a equação favorável apesar de stop largo; em lateralidade apertada operar pouco."],[40,"s",[5],"Não saia com scalp pequeno; mantenha para a projeção e adicione na correção; realize parcial no alvo."],[0,"s",[],"Barras de espiga sem sombras, pouca sobreposição e micro lacuna entre barras são sinal de rompimento forte."],[5,"s",[],"Lacuna de rompimento e micro lacuna de mensuração como posição de stop e sinal de força."],[1,"s",[],"Sempre posicionado a favor depois do spike; a correção até a lacuna é teste; quando o mercado fica de dois lados, prefira as correções."],[4,"s",[],"H1, H2, ii e H2/L2 de correção depois de rompimento."]],"secs":[],"tr":["Quando a espiga é forte, comprar o fechamento da barra de entrada com stop abaixo da barra mais baixa da espiga e posição pequena é o método descrito.","O alvo mínimo é a altura da espiga, igual ao risco inicial, com chance de ao menos 60%.","Quem já apertou o stop com a espiga em crescimento reduz o risco efetivo; a posição inicial deve ser reduzida para manter o risco normal."],"q":"ok","parts":[]},{"id":"l2c2","k":"livro","bk":2,"cap":2,"part":false,"t":"Sinais de Força em um Rompimento","pg":71,"o":106,"why":"","res":"Reúne as listas de características que distinguem rompimentos fortes dos fracos e explica por que o mercado busca incerteza depois do rompimento, o papel do volume, e aplica isso em figuras de diário e 5 minutos.","L":[[18,"c",[1,2,3,4,6],"Quanto mais sinais (corpo grande, pouco recuo na formação, micro lacunas, vários níveis rompidos), maior a chance; ao menos um scalp deve ser possível a partir do extremo anterior."],[23,"c",[2,3,6],"Rompimento fraco: sombra grande, barra seguinte de reversão, recuo além do ponto de rompimento, recuo que atinge o stop de breakeven e sensação de confusão."],[10,"s",[2,3],"Falha que não reverte vira correção; quanto mais forte a espiga menos o recuo chega ao ponto de rompimento."],[14,"s",[1,2],"Rompimento bem-sucedido é spike seguido de canal que costuma ser devolvido até o início e formar duplo extremo."],[21,"s",[5],"Espiga de quatro barras fortes projeta movimento da abertura da primeira ao fechamento da última; a lacuna do teste marca o ponto médio."],[29,"s",[6],"O segundo e o terceiro clímax em curto prazo tendem a gerar correção de duas pernas; barra grande com sombra pequena pode exigir correção."],[30,"s",[2,6],"Bandeira horizontal depois de longa tendência vira bandeira final; rompimento fraco da bandeira falha e inverte."],[27,"e",[2,6],"Cunha que falha leva a movimento projetado no sentido oposto; a terceira puxada do canal costuma levar a tentativa de reversão."],[7,"e",[6],"L1 e L2 em canal de alta contra a tendência falham; entrar comprado no limit nas mínimas dessas barras."],[17,"s",[1],"Tendência desde a abertura geralmente é rompimento de padrão de ontem; pode virar tendência com espiga ou lateralidade apertada depois."],[37,"c",[1,3],"Entrada no fechamento de espiga com risco igual ao alvo é lógica se a probabilidade é 60% ou mais; instituições não tomariam a conta de outro modo."],[39,"s",[4,6],"Recuo que alcança o stop de breakeven é sinal de rompimento fraco."],[42,"w",[6],"Scalp contra a tendência forte e depois perder a reversão para a direção original é erro comum; se não consegue inverter rápido, não faça."],[0,"s",[],"Barras de rompimento: tamanho do corpo, sombras, fechamento além de muitos extremos e fechamentos, aberturas fora do fechamento anterior."],[5,"s",[],"Micro lacuna entre a barra anterior e a posterior à barra de tendência é sinal de força; lacuna de abertura de barra."],[1,"s",[],"Lateralidade vira rompimento falho com frequência; olhar o gráfico inteiro, não só a perna atual; lado esquerdo da tela."],[3,"s",[],"Vácuo e ímã no meio da lateralidade; extremos da lateralidade são zonas de realização de lucro."]],"secs":[],"tr":["Em rompimento forte, a mercado ou em um recuo de um ou dois ticks é entrada razoável porque o recuo não vem; o stop vai até a base da espiga.","Exemplo numérico: espiga de 4 pontos, stop de 4 pontos, alvo equivalente, chance de pelo menos 60%.","Quem perde a primeira entrada pode usar scalp curto com alvo próximo de dois pontos e stop de dois, ajustados ao dia."],"q":"ok","parts":[]},{"id":"l2c3","k":"livro","bk":2,"cap":3,"part":false,"t":"Rompimento Inicial","pg":93,"o":107,"why":"","res":"Trata do primeiro rompimento: entradas no fechamento e em recuos mínimos com urgência, falhas de rompimento, armadilhas de padrões de candles em tendência de baixa, barbwire e o uso de movimentos projetados a partir da espiga.","L":[[18,"c",[1,2,3,4],"Quando limit no fechamento não enche, entrar a mercado ou em recuo de 1 a 4 ticks com stop padrão; se a barra seguinte for fraca, o rompimento pode falhar."],[21,"c",[5],"Alvos de movimento projetado a partir da abertura/mínima da espiga ao fechamento/máxima, projetado a partir do fechamento; começar pelo alvo mais próximo."],[23,"c",[2,3,6],"Cunha ou barbwire com rompimento falho; comprar rompimento falho de novas mínimas depois de quebra de linha de tendência; mover a ordem acima da barra anterior."],[24,"w",[1,6],"Barbwire: não comprar na máxima nem vender na mínima; fadear extremos pequenos ou esperar rompimento falho, pois a lateralidade é ímã e vira bandeira final."],[29,"s",[2,6],"Terceiro climax de venda consecutivo leva a correção de dez barras e duas pernas; barra de reversão que fecha acima do ponto médio basta."],[10,"s",[3],"As barras 9 e 10 foram correções de novos extremos; H2/L2 de duas pernas em tendência forte é boa entrada a favor; cautela na terceira puxada."],[27,"e",[2,3,6],"Cunha que falha leva a movimento projetado; a terceira puxada do canal exige cautela, e sinais a favor viram armadilha para quem opera contra."],[14,"s",[1,2],"O spike é seguido de canal no mesmo sentido, tipicamente com três puxadas, incluindo o extremo do spike."],[17,"s",[1,2],"Dia de tendência desde a abertura: H1/L1 na primeira pausa é entrada confiável, mas com urgência é possível entrar a mercado; chance acima de 70% de movimento projetado."],[32,"s",[1,3],"Movimento de duas pernas lateral quebra linha de tendência; depois o rompimento falho para novas mínimas é a configuração perfeita de compra."],[26,"e",[6],"O rompimento de ombro-cabeça-ombro pode falhar porque a maioria dos extremos são bandeiras a favor da tendência; espere uma barra a favor antes de entrar."],[34,"s",[1,5],"O range de abertura leva a rompimento e projeção medida; movimentos fortes na abertura podem reverter rapidamente."],[43,"c",[3,4],"Barra de alta presa os primeiros compradores; colocar stop de venda um tick abaixo da mínima da barra onde os stops deles estão e usar o combustível."],[38,"c",[3],"Ordens limit no fechamento da barra falham em rompimentos fortes; use mercado, recuo pequeno ou migrar para 1 ou 2 minutos."],[37,"s",[1,3],"Rompimentos têm matemática excelente mas emoção difícil; reduza o tamanho; operar contra um sinal fraco é aposta lógica de 6 ticks por 8."],[39,"s",[4],"Stop de rompimento é tipicamente largo; risco de dois pontos no Emini em recuos de entrada; breakeven após cinco ticks de lucro, cautela em cunha."],[0,"s",[],"Armadilhas de candles com sombra longa e corpo pequeno em tendência; barras que não oferecem recuo para ordem limite."],[1,"s",[],"Notícia é irrelevante: o gráfico mostra a atitude institucional; tendência forte constrói urgência."],[3,"s",[],"Os extremos de barras de sinal anteriores servem de alvos; lateralidades horizontais são ímãs."]],"secs":[],"tr":["Num rompimento, esperar um recuo longo costuma deixar o trader de fora, então entradas a mercado ou em recuo de poucos ticks seguem a urgência, com stop padrão.","Barras de sinal fracas em tendência fortes exigem entrar acima da barra que mostra força; entrar acima de uma barra de alta aumenta a probabilidade.","Não existe diretriz sobre duração curta além de o stop do Emini ser cerca de dois pontos e metas de dois a seis."],"q":"ok","parts":[]},{"id":"l2c4","k":"livro","bk":2,"cap":4,"part":false,"t":"Entradas de Rompimentos em Tendências Fortes Vigentes","pg":103,"o":111,"why":"","res":"Mostra como entrar com a tendência forte já em curso: H1 e limit abaixo da barra anterior, stop de última chance acima da espiga, rompimentos de extremo como teste de força e a regra de realizar a maior parte em entradas stop de novo extremo.","L":[[7,"c",[2,3],"Em tendência forte, primeiras correções são H1; entrar acima da barra anterior ou do H1; não esperar H2 profundo; stop inicial abaixo da mínima de swing menor."],[8,"s",[3],"Traders agressivos colocam limit de compra abaixo da mínima da barra anterior esperando que o recuo dure uma barra."],[11,"c",[1,3,4,6],"Nunca fique de fora de uma tendência forte; entre a mercado ou com stop além do spike; entrar nos rompimentos é pior risco/retorno que entrar nas correções."],[18,"c",[2,3,5,6],"O rompimento do extremo do dia mostra força se andar o suficiente para um scalp; com o stop no novo extremo, faça scalp da maior parte, salvo tendência excepcional."],[10,"s",[3],"Entradas de correção em bandeiras a favor (H1, H2, cunha que falha, teste da média) são mais cedo em relação ao rompimento."],[23,"s",[1,3,6],"Ursos vendem o rompimento de topo e adicionam acima, saindo no teste do ponto de rompimento; fadear rompimento que parece fraco."],[17,"s",[1,3],"Após dia de tendência desde a abertura, há grande chance de continuidade no dia seguinte e de fechar além da abertura, no mesmo sentido."],[30,"s",[2],"Reversão de bandeira final pode vir de um extremo de swing mais conservador ou de um novo extremo."],[16,"e",[3],"Primeiro gap da média móvel de compra mais fundo duplo com a barra 12."],[27,"e",[6],"Terceira puxada após barra de reset forte: não entre no rompimento; cautela com a tendência de três puxadas."],[38,"c",[3],"Compra a mercado, a limit abaixo de barra, na mínima, acima de correção, no fechamento ou stop acima do último topo de swing."],[42,"c",[5],"Entrada stop em novo extremo: scalpar quase tudo, swing só em tendência muito forte; ursos vendem limit no topo antigo."],[39,"s",[4],"Stop inicial abaixo do último swing menor (sinal H1 anterior); ao entrar na correção o risco é menor que no rompimento."],[43,"s",[3],"Colocar um stop de entrada além do spike evita ficar preso fora da tendência."],[44,"w",[6],"Scalp contra a tendência só se conseguir inverter depois; se não consegue processar duas mudanças de direção, mantenha a posição."],[1,"s",[],"Tendência forte: sempre posicionado, vários dias de tendência, do mesmo lado da média por 20 barras; todo movimento é entrada a favor."],[4,"s",[],"H1, H2, H4 e reinício da contagem por barra de rompimento muito forte; terceira puxada."],[0,"s",[],"Barra de rompimento grande sem sombras mostra que participantes grandes entraram nela."]],"secs":[],"tr":["Em perna forte, limit abaixo da mínima da barra anterior esperando H1 é mencionado como entrada agressiva a favor da tendência.","Perda do H1 e H2 leva a stop de compra acima do topo da espiga para não ficar de fora.","Contra H1/H2 em movimento forte: o texto não recomenda fadear, só scalpar contra a tendência se for possível inverter rápido.","Entradas por stop em novo extremo devem ser tratadas como scalp, o que sugere duração curta de trade."],"q":"ok","parts":[]},{"id":"l2c5","k":"livro","bk":2,"cap":5,"part":false,"t":"Falhas de Rompimento, Rompimentos-e-Correções e Testes de Rompimento","pg":111,"o":114,"why":"Mostra o que acontece quando o rompimento falha e quando só corrige. Testa qualquer entrada em rompimento.","res":"Explica a sequência rompimento, falha, reversão ou correção e retomada; lista áreas que a correção testa, como lidar com stops de breakeven e bandeiras finais, com muitos exemplos em ações e no Emini.","L":[[10,"c",[1,2,3,4,5,6],"A correção do rompimento é teste; entre 1 tick além da barra de teste; pode ser quase-rompimento, ficar do lado certo do ponto de rompimento ou passar do extremo antigo."],[23,"c",[1,2,3,6],"Rompimento fraco com barra de reversão forte vira falha e leva a pelo menos mais uma perna; se a barra seguinte vai no sentido do rompimento, vira sinal de correção."],[30,"c",[2,3,6],"Bandeira com rompimento que falha é bandeira final; reverte após um extremo além do anterior ou aquém dele; a inclinação da bandeira projeta a da nova tendência."],[29,"s",[6],"Clímax consecutivos levam a correção de dez barras e duas pernas; barra grande pode ser o fim do movimento."],[21,"s",[5],"Lacuna de rompimento vira de mensuração; barra de rompimento que reverte vira exaustão."],[27,"s",[2,6],"Após a terceira puxada, teste do segundo extremo e depois da base da cunha; rompimento do extremo de uma cunha pode voltar a um extremo além do anterior."],[26,"e",[2,6],"Topo duplo marca pelo menos duas pernas para baixo; fundo duplo e topos em cunha como exemplos de correção."],[28,"s",[1,2],"Grandes reversões de tendência são rompimentos de linha de tendência seguidos de teste do extremo, que pode passar o extremo antigo."],[32,"s",[2],"Quebra da linha de tendência e depois um extremo de swing mais alto ou mais baixo como teste de rompimento."],[15,"e",[2,3],"Topo duplo de bandeira de baixa com barra 9 e 12; duplo não precisa ser exato."],[7,"e",[3],"H1 depois de rompimento da máxima de ontem; H2 depois; L1 e L2 em tendência de baixa; H2 pode ser mais alto que o H1."],[8,"s",[3],"Comprar abaixo da barra de sinal para evitar stop de breakeven; reentrar um tick além da barra de teste."],[16,"e",[3],"L2 na média móvel em tendência de baixa é correção confiável; primeiro gap da média de compra."],[13,"s",[2,5],"Em escadas de alta cada novo topo tem correção profunda que fica acima do fundo anterior."],[14,"s",[2],"A correção de spike e canal costuma testar o extremo do spike e depois a base do canal."],[34,"s",[6],"Rompimentos fortes na abertura que duram poucas barras frequentemente falham e levam a dia de tendência no sentido contrário."],[39,"c",[4,6],"Stop de breakeven pode ter tolerância (centavos conforme o papel); testes de ação podem varrer o stop; reentrar um tick além do teste ou arriscar poucos centavos."],[38,"s",[3],"Comprar um tick acima da barra de teste ou ordem de stop; ordens limit abaixo em tendências fortes."],[40,"s",[5],"Realizar parcial após corrida inicial e proteger o resto com stop de breakeven; segurar se o canal final tem a mesma inclinação."],[3,"s",[],"Lista de áreas testadas pela correção: ponto de rompimento, topo da espiga, topo de barra de sinal, mínima da barra de entrada, média, linhas."],[1,"s",[],"Dia de tendência anterior aumenta chance de correção; dia sem tendência aumenta a chance de falha reverter."],[4,"s",[],"Segunda entrada e falhas consecutivas; contagem em correções H1, H2, L1, L2."],[2,"s",[],"Linha de tendência rompida e depois testada; canal final com a mesma inclinação."]],"secs":[],"tr":["Com momentum forte, comprar H1 de correção é descrito como boa operação; às vezes o H2 vem acima do H1.","Stop de breakeven com tolerância de alguns centavos, ou re-entrada um tick além da barra de teste, protege contra varrer o stop no teste do rompimento.","Em ações que respeitam o breakeven, o teste termina perto do preço de entrada; em outras, é preciso arriscar um pouco mais, o que altera o risco efetivo."],"q":"ok","parts":[]},{"id":"l2c6","k":"livro","bk":2,"cap":6,"part":false,"t":"Gaps","pg":133,"o":16,"why":"","res":"Define gaps tradicionais e intradiários, trata barras de tendência como gaps, mensuração pelo meio da lacuna, gaps de média móvel e exaustão, e termina com a Parte II sobre ímãs: suporte e resistência como alvos e pontos de reversão.","L":[[21,"c",[1,2,5],"Medir do início da perna ao meio da lacuna e projetar igual; usar correção mínimo como teste; ignorar projeção se a lacuna surge cedo em tendência forte."],[20,"c",[1,2,6],"Gaps de rompimento, mensuração e exaustão; gap fechado vira exaustão e pode virar ilha; gaps de abertura que revertem são exaustão."],[16,"c",[2,3,5,6],"Primeira barra com mínima acima da média após tendência de baixa: ordem de venda um tick abaixo da mínima; segunda entrada se parar; fade de gap da média em lateralidade."],[18,"s",[2,5],"A lacuna de rompimento inicial é sinal de força, não alvo; não realize cedo; um teste que não passa do ponto de rompimento confirma."],[10,"s",[2,3],"Teste dentro da lacuna é breakout test; a lacuna é negativa quando o teste passa do ponto de rompimento."],[29,"s",[2,6],"Barra enorme após tendência longa é exaustão e leva a correção de cerca de 10 barras; gap de exaustão com ilha no extremo."],[23,"s",[3,6],"Gap que fecha rapidamente vira falha de rompimento; barra de reversão fraca após uma barra forte no sentido oposto."],[30,"s",[2,6],"Bandeira que rompe e logo mostra barra de reversão forte vira possível bandeira final e testa a base da bandeira."],[7,"s",[3,6],"Após exaustão, H1 fraco tende a falhar; ursos vendem acima do H1 e do H2 e abaixo do H2 onde estão os stops dos compradores."],[35,"s",[1,2],"Gap de abertura que reverte é exaustão; range de abertura de meio dia médio sugere dobrar a faixa."],[34,"s",[2,5],"Range de abertura e rompimento além dele como lacuna de mensuração e projeção."],[22,"s",[3],"Em lateralidade, gaps da média geram scalps; compras perto do fundo e vendas perto do topo de canal ou lateralidade."],[32,"s",[1,2],"Reversões acontecem em suporte e resistência como linhas de tendência e de canal; reversão forte nesses níveis atrai entrada contrária."],[12,"s",[1],"Hoje a maioria dos dias tem dúzias de micro canais de programas; muitos traders realizam lucro em níveis calculados."],[13,"s",[1],"Canal inclinado para cima deve ser tratado como bandeira de baixa porque a linha acabará rompida; canal para baixo é bandeira de alta."],[40,"s",[5],"Magnetos são pontos de realização; ser mais rápido para realizar que para reverter; precisa setup mais forte para reverter."],[37,"s",[1,3],"Reversão em suporte tem tipicamente 40% de chance mas reward muito maior que o risco; recompensa deve ao menos igualar o risco."],[5,"c",[],"Gap tradicional e variantes: gap de abertura de barra, micro gap, lacuna entre barra e média móvel, trend bar como gap, negativo e ilha."],[3,"s",[],"Parte II: suporte e resistência como ímãs, vácuo, memória, suporte vira resistência, testes de quatro ou cinco vezes enfraquecem o nível, projeções medidas."],[2,"s",[],"Linhas de tendência e de canal funcionam como suporte ou resistência; testes repetidos sem reação fazem o nível ceder."],[1,"s",[],"Tendência forte ultrapassa a maioria dos magnetos; sempre há reversões em nível; notícia segue o preço."],[0,"s",[],"Abertura além do fechamento anterior, em duas ou mais barras de tendência consecutivas, é sinal sutil de força no sentido da tendência."]],"secs":[["Gaps tradicionais: rompimento, mensuração, exaustão",[20,29]],["Barras de tendência como gaps e meio da lacuna",[21,18,10]],["Gap da média móvel",[16,22]],["Figuras 6.1 a 6.5: gaps no diário e no 5 minutos",[21,35,29]],["Parte II: magnetos, suporte e resistência",[32,21]]],"tr":["Micro lacuna em rompimento: comprar com limit um tick acima da máxima da barra anterior, arriscando uns três ticks; chance perto de 40%, mas recompensa várias vezes o risco.","Lucros devem ser realizados quando o ganho alcança o tamanho do risco, nível mínimo para a estratégia ser positiva; magnetos medidos são alvos naturais.","Gap de rompimento no início de tendência não deve virar alvo, pois realizar cedo corta a perna; o autor trata a lacuna só como sinal de força."],"q":"ok","parts":[]},{"id":"l2c7","k":"livro","bk":2,"cap":7,"part":false,"t":"Movimentos Projetados Baseados no Tamanho da Primeira Perna (o Impulso)","pg":173,"o":113,"why":"Define o alvo do rompimento pelo tamanho do impulso, que é o que mantém o trade curto.","res":"Explica o movimento projetado (segunda perna igual à primeira, ou altura do impulso) como alvo, por que funciona (risco igual a recompensa com cerca de 60% de chance) e como medir impulsos, lateralidades e correções de duas pernas.","L":[[21,"c",[1,2,4,5],"Define o movimento projetado pela primeira perna ou impulso; usa-o como alvo para realizar lucro e depois procurar nova correção ou reversão forte."],[14,"s",[2,5],"Altura do canal costuma igualar a do impulso; alvo mede da abertura da 1a barra ao fechamento da última barra do impulso; depois o canal retorna ao início."],[9,"s",[1,5],"Correção de duas pernas em bandeira: subtrair a altura da 1a perna do extremo da correção estima onde a 2a perna termina e a tendência retoma."],[18,"s",[3,4],"Comprar o impulso a mercado ou em correções de 1 a 4 ticks, com stop abaixo da base do impulso e posição reduzida (cerca de um quarto)."],[22,"w",[1,6],"No meio de lateralidade a probabilidade de movimento equidistante é 50%; no fundo favorece alta e no topo favorece queda; 80% das tentativas de rompimento falham."],[37,"s",[1,4,5],"Com ~60% de chance, a estratégia só funciona se o alvo for pelo menos igual ao risco; é a explicação plausível de por que projeções funcionam."],[40,"s",[5],"Realizar lucro na área do movimento projetado e só considerar countertrend se houver sinal forte de reversão ali."],[3,"s",[],"Projeções de movimento e meio de lateralidade funcionam como ímãs de preço e alvos de realização."],[4,"s",[],"Rotular perna 1, correção e perna 2 em vez de A, B, C evita a confusão de nomenclatura."]],"secs":[],"tr":["Num impulso forte, o texto aceita comprar a mercado ou em recuos de poucos ticks com stop abaixo do início do impulso, com posição pequena, pois o risco é grande.","Projetar movimento medido exige alvo no mínimo igual ao risco; com 60% de chance, relação 1:1 já tem expectativa positiva."],"q":"ok","parts":[]},{"id":"l2c8","k":"livro","bk":2,"cap":8,"part":false,"t":"Movimentos Projetados Baseados em Gaps e Lateralidades","pg":187,"o":101,"why":"Mostra onde um movimento medido da lateralidade deve parar.","res":"Mostra como o meio de um gap de medição (inclusive intradiário, entre o ponto de rompimento e a primeira correção) ou de uma lateralidade projeta o movimento, e quando considerar operações contra a tendência na área do alvo.","L":[[21,"c",[1,2,5],"Meio do gap ou da lateralidade projeta o mesmo número de pontos adiante; usar primeiro o alvo mais próximo e só depois os mais distantes."],[10,"s",[2,5],"O gap se forma entre o rompimento e a correção do rompimento; correção além do ponto de rompimento gera gap negativo e projeção menos confiável."],[18,"s",[2,5],"Barra de rompimento grande com a barra seguinte além do ponto de rompimento forma o gap de medição; se não, usa-se o meio da barra."],[20,"s",[2,5],"Em gráficos diários o gap é literal e seu meio marca o meio da tendência; parte da posição com a tendência deve ser mantida até o alvo."],[15,"e",[2,5],"Rompimento de fundo duplo em bandeira de alta projeta alvo pela altura da formação."],[32,"w",[1,6],"Estar na área do alvo não basta para contratendência; exige antes uma quebra de linha de tendência ou força contrária; senão só scalp."],[40,"s",[5],"Realizar parte ou todo o lucro perto do alvo medido e manter parte da posição com a tendência até lá."],[5,"s",[],"Gaps de medição, gaps de rompimento e gap negativo servem de régua para alvos."],[3,"s",[],"Meio de gap e de lateralidade como ímãs; alvo só precisa chegar a 1 tick para ser considerado testado."]],"secs":[],"tr":["Recomenda manter parte da posição a favor da tendência após o rompimento de bandeira até o movimento projetado ser atingido."],"q":"ok","parts":[]},{"id":"l2c9","k":"livro","bk":2,"cap":9,"part":false,"t":"Reversões Geralmente Terminam em Barras de Sinal de Falhas de Reversões Anteriores","pg":197,"o":97,"why":"","res":"Preços de entrada e máximas/mínimas de barras de sinal de reversões anteriores que falharam viram ímãs e alvos para a reversão que finalmente funciona, e a probabilidade direcional ajuda a explicar topos e fundos de lateralidade.","L":[[28,"s",[1,5],"Depois que uma reversão de fundo finalmente funciona, o mercado costuma subir até a máxima da barra de sinal mais alta das tentativas falhas antes."],[22,"s",[1,5],"Reversão forma o início de lateralidade; o extremo provável são os preços das entradas antigas, onde costuma surgir um duplo extremo."],[26,"e",[5],"O movimento frequentemente forma duplo extremo com uma das barras de sinal antigas e vira no sentido oposto."],[40,"s",[5],"Os extremos das barras de sinal anteriores são alvos naturais para realizar lucros em reversões."],[3,"s",[],"Barras de sinal e preços de entrada de tentativas anteriores funcionam como ímãs e resistências/suportes."],[1,"s",[],"Tendências, canais e lateralidades alternam enquanto a probabilidade direcional ultrapassa a neutralidade."]],"secs":[],"tr":[],"q":"ok","parts":[]},{"id":"l2c10","k":"livro","bk":2,"cap":10,"part":false,"t":"Outros Magnetos","pg":201,"o":102,"why":"","res":"Lista ampla de ímãs de preço (linhas, projeções, máximas e mínimas do dia anterior, pontos de rompimento, flags finais, stops de barras grandes, alvos comuns de scalp e swing, números redondos) e quando não operar contra eles.","L":[[21,"s",[5],"Qualquer projeção, inclusive perna 1 = perna 2, é um ímã; tendência em direção ao ímã deve ser operada a favor até ele ser testado."],[14,"s",[5],"O início do canal costuma ser testado mais cedo ou mais tarde."],[30,"s",[5],"Depois do rompimento da bandeira final, o mercado volta à bandeira e geralmente rompe do outro lado."],[24,"s",[1,5],"Extremos e o meio de lateralidades estreitas e barbwire anteriores são frequentemente testados."],[10,"s",[3,5],"O preço de entrada de um rompimento é ímã do teste de rompimento."],[32,"w",[6],"Não fazer contratendência no ímã sem prévia quebra de linha de tendência ou sem que seja correção de tendência maior."],[39,"s",[4],"Stops além de barra enorme e stops de barra de sinal e entrada são ímãs; o mercado costuma caçá-los e voltar na direção da barra."],[40,"c",[5],"Alvos comuns: 5-6 ticks para scalp de 4, 3-4 e 10 pontos para swing no 5 min do Emini; movimento igual ao stop necessário."],[3,"c",[],"Catálogo de suportes, resistências e ímãs: dia anterior, swings, rompimentos, gaps, números redondos, médias e linhas."],[5,"s",[],"Gaps de qualquer tipo, inclusive de média móvel, são ímãs."]],"secs":[],"tr":["Afirma que um movimento igual ao stop de proteção necessário costuma ser alcançado: stop de 12 ticks no Emini sugere alvo de ao menos 12 ticks.","Alvos de scalp típicos de 5-6 ticks para entrada de 4 ticks de risco no 5 minutos."],"q":"ok","parts":[]},{"id":"l2c11","k":"livro","bk":2,"cap":11,"part":false,"t":"Primeira Sequência de Correção","pg":231,"o":50,"why":"","res":"A introdução da Parte III explica por que correções ocorrem, como termina uma correção, quando esperar ou entrar a mercado, e o capítulo 11 lista a sequência de primeiras correções (barra, linha menor, média móvel, gap de média, linha maior) com testes do extremo.","L":[[7,"c",[1,2,3,4,6],"H1/L1 curto depois de impulso forte e H2/L2 quando a correção seguinte tem duas pernas; entrada a stop além da barra de sinal."],[8,"c",[1,3],"Compra a limit abaixo da barra anterior em impulso forte, ou na média móvel: preço com desconto; se não sobe após 10-20 barras, precisa de desconto maior."],[16,"c",[1,2,3,5],"Primeira barra de gap da média após tendência longa costuma ser seguida de teste do extremo; depois vêm quebra de linha maior e correção de duas pernas."],[15,"s",[2],"Correções costumam terminar em fundo duplo ou novo fundo ascendente, com compradores defendendo o último fundo."],[27,"s",[2],"Correção de três pernas (cunha ou triângulo) de 5 a 15 barras é um dos estágios da sequência de enfraquecimento."],[32,"s",[1,2],"A sequência termina com quebra de linha de tendência maior; antes dela cada correção é entrada a favor da tendência; depois, esperar reversão."],[29,"w",[1,6],"Se a tendência terminou em clímax ou reversão clara, não entre nas correções da tendência antiga; procure setups no sentido novo por pelo menos cerca de 10 barras."],[37,"s",[4,5],"Correção de tendência assume ~60% de chance; com stop de 50 centavos e alvo de 2 dólares, relação de 4:1 favorece muito."],[38,"s",[3],"Stop acima da máxima da barra de correção; limit abaixo da mínima anterior para agressivos; combinar limit e stop de segurança."],[1,"s",[],"Sequência de enfraquecimento da tendência até lateralidade e depois reversão; correção fraca após clímax ou rompimento forte contrário."],[4,"s",[],"Correções em uma, duas ou três pernas e H1/H2 (L1/L2); infira as pernas se não estiverem visíveis."],[2,"s",[],"Quebra de linha menor e depois linha maior marca estágios da correção."],[3,"s",[],"Correções terminam em aglomerados de suporte; efeito vácuo antes de grandes barras de sinal."],[45,"c",[2,3,4],"Ordem classificada de primeiras correções (barra, linha menor, média, gap de média, linha maior), cada um seguido de teste do extremo."]],"secs":[["Sequência de sinais de fraqueza em tendência de alta e de baixa",[7,16,27,32]],["Primeira correção: barra, linha menor, média móvel, gap de média, linha maior",[7,8,16]],["Figs 11.1 e 11.2: correções subsequentes ficam maiores; correções na média",[16,8,32]]],"tr":["Em impulso forte, traders agressivos compram a limit abaixo da mínima da barra anterior esperando correção curta e pegar preço melhor que quem espera a stop acima da correção.","Depois de série de ganhos com H1 e H2, desconfiar de nova força sem correção maior, pois pode ser armadilha de bandeira final.","Quando a tendência é forte e a correção não aparece, entrar a mercado ou em recuos mínimos costuma render mais que esperar."],"q":"ok","parts":[]},{"id":"l2c12","k":"livro","bk":2,"cap":12,"part":false,"t":"Bandeiras de Baixa em forma de Topo Duplo e Bandeiras de Alta em forma de Fundo Duplo","pg":241,"o":51,"why":"","res":"O fundo duplo em bandeira de alta (e o topo duplo em bandeira de baixa) é um H2 confiável em tendência, causado por defesa dos stops de trailing; mostra como operar, medir alvos, e quando a falha vira cunha ou alvo medido contrário.","L":[[15,"c",[1,2,3,4,5,6],"Correção em duas pernas que termina em fundo duplo; compra a stop um tick acima da barra de sinal com stop abaixo; momentum prévio favorece rompimento a favor."],[9,"s",[2],"Todo fundo duplo é uma correção de duas pernas (H2); também é um L2 que falhou."],[27,"s",[2,3,6],"Duplo extremo que rompe por 1-2 barras e volta vira cunha de três puxadas; entre na reversão; lateralidade aumenta o risco."],[23,"s",[6],"Rompimento de poucos ticks do duplo extremo prende os participantes do lado do rompimento; falha em 1-2 barras gera reversão; sombra de um tick vira cunha no extremo."],[14,"s",[1,5],"No impulso-canal, o teste da borda do canal forma duplo extremo; o preço volta ao menos cerca de 25% do intervalo, depois o padrão acabou."],[26,"s",[2,5],"Ombro-cabeça-ombro pode ser continuação; ombro direito vendido antes da linha do pescoço é cobrado se rompe acima; alvo de movimento medido."],[21,"s",[5],"Após rompimento, o alvo mínimo é a altura da pequena lateralidade; em dias fortes, projete o duplo extremo, a altura do impulso duplicada e o gap de medição."],[22,"s",[1,3],"Em tendência de alta, comprar perto do fundo de qualquer lateralidade é sensato, pois a maioria das reversões falha e continuações têm êxito."],[7,"s",[3,4],"Entrada a stop um tick acima da máxima do sinal, stop inicial um tick abaixo da mínima do sinal; mover o stop só após barra de tendência."],[24,"w",[6],"Barbwire abaixo da média: L2 que falha e duplo topo exigem cuidado; primeiro rompimento por barra de tendência costuma falhar; H2 em tendência de baixa não funciona."],[39,"s",[4],"Testes de rompimento rodam stops de breakeven; em dia de tendência forte, usar stop mais largo na parte de swing."],[1,"s",[],"Em tendência, reversões falham e continuações têm êxito; momentum antes da lateralidade indica direção do rompimento."],[4,"s",[],"Duas tentativas falhando no mesmo preço sugerem movimento oposto; três puxadas não precisam de formato perfeito."]],"secs":[["Teoria: defesa de stops de trailing, dupla pernas e duplo fundo como H2",[15,9]],["Falha do duplo topo/fundo e cunha de três puxadas",[27,23]],["Figs 12.1-12.4: bandeiras de alta, duplo fundo e H&S em diário",[15,26,14]],["Fig 12.5: duplo fundo falho e rompimento de lateralidade",[23,27]],["Fig 12.6: dia de tendência forte, alvos medidos e stops",[15,21,39]],["Fig 12.7: falha de duplo fundo como variante de cunha; barbwire",[27,24]]],"tr":["Recomenda continuar comprando perto do fundo de lateralidade em tendência de alta, pois reversões em tendência falham e continuação tem êxito.","Entrada a stop um tick acima do sinal com stop abaixo da barra de sinal; mover stop apenas após barra de tendência a favor."],"q":"ok","parts":[]},{"id":"l2c13","k":"livro","bk":2,"cap":13,"part":false,"t":"Vinte Barras de Gap","pg":263,"o":55,"why":"","res":"Quando o preço fica 20 barras ou mais sem tocar a média móvel, a tendência é forte mas esticada; o primeiro toque na média é scalp de alta probabilidade para testar o extremo, preferencialmente com entrada por price action, exceto depois de clímax.","L":[[16,"c",[1,2,3,5,6],"Após 20 barras sem toque na média, opere contra os toques na média; entrada além do extremo da 1a barra de gap; segunda entrada se falhar; terceira não vale."],[8,"s",[3],"Alguns entram a limit e a mercado na média, mas é melhor esperar reversão a favor da tendência e entrar a stop; limites dois ou três ticks antes."],[9,"s",[3],"A segunda entrada a favor após correção à média foi a mais agressiva na Fig 13.1; a barra 8 testou a média em duas pernas sem tocá-la."],[29,"w",[1,6],"Se houve clímax parabólico antes das 20 barras, o toque na média pode não gerar teste do extremo; entrar na correção de uma perna é arriscado."],[27,"e",[2],"Cunha de baixa em fundo antes das 20 barras e topo duplo em bandeira de baixa aparecem como exemplos."],[24,"w",[6],"Se a tendência virou lateralidade de 20-30 barras, a primeira barra de gap deixa de ser setup confiável."],[17,"e",[1],"Gap de abertura com barra de baixa pode virar tendência desde a abertura; modo rompimento após topo e fundo e abertura estreita."],[41,"s",[5],"Por ser entrada a favor da tendência, manter parte da posição como swing pois o mercado pode ir muito além."],[1,"s",[],"Tendência forte ainda pode ser esticada; a média móvel é ímã e a ausência de toque mede a força."],[5,"s",[],"Barra inteiramente do outro lado da média é gap de média; fundamento do setup."]],"secs":[],"tr":["Alguns operadores colocam ordens limitadas ao redor da média móvel depois de 20 barras de gap; o autor prefere esperar reversão e entrar a stop, pois a correção pode ir bem além."],"q":"ok","parts":[]},{"id":"l2c14","k":"livro","bk":2,"cap":14,"part":false,"t":"Primeiras Barras de Gap em Relação à Média Móvel","pg":269,"o":56,"why":"","res":"A primeira barra de gap da média móvel em tendência forte costuma ser seguida de teste do extremo; segunda barra de gap é segunda tentativa de preencher o gap; em mercado lateral serve só para scalp até a média.","L":[[16,"c",[1,2,3,5,6],"Primeira barra de gap em tendência forte dá swing e teste do extremo; segunda tentativa é excelente; em lateral é scalp até a média se houver espaço."],[9,"s",[3],"A segunda barra de gap além do extremo da anterior é segunda tentativa; a primeira pode ser simples barra a favor."],[7,"s",[3,4],"Compra um tick acima da máxima da barra anterior quando a máxima está abaixo da média em tendência de alta."],[22,"s",[1,5],"Em mercado sem tendência, desvaneça barra acima ou abaixo da média apenas como scalp até a média, se houver espaço."],[27,"e",[2],"As figuras mostram expanding triangle e cunha que falha com alvo medido no sentido oposto à cunha."],[5,"s",[],"Gap é qualquer espaço entre dois pontos, incluindo entre barra e média; gaps tendem a ser preenchidos em tendência ou lateralidade."],[1,"s",[],"Primeira barra de gap precisa de tendência forte para swing; sem tendência é só scalp."]],"secs":[],"tr":[],"q":"ok","parts":[]},{"id":"l2c15","k":"livro","bk":2,"cap":15,"part":false,"t":"Horários de Inflexão Importantes do Dia Para Configurações de Rompimentos e Reversões","pg":275,"o":17,"why":"","res":"Aponta horários (relatórios perto de 7:00 e 7:30 PST, 11:00-11:30 PST) em que o mercado costuma romper ou reverter, com armadilhas tardias e stop runs que prendem traders e depois seguem a tendência do dia.","L":[[23,"c",[1,2,3,6],"Rompimento oposto tardio, perto de 11:30 PST, prende traders; segundo sinal costuma render ao menos scalp quando há presos dentro e fora."],[16,"s",[3],"Fades de gap da média após dois ou mais testes; primeira barra de gap tardia falha e oferece boa entrada de continuação."],[17,"s",[1,3],"Em dia de tendência desde a abertura, a primeira correção de uma barra às 7:00 é setup de compra; reversão que funciona vira spike de baixa."],[34,"s",[1],"Stop run tardio costuma gerar trade oposto na primeira hora do dia seguinte, após novo extremo e quebra de linha."],[10,"e",[2,3],"Em canal íngreme, espere a quebra e a correção do rompimento; o fechamento de uma barra externa confirma a força do lado vencedor."],[22,"e",[1,6],"Em dia lateral, sondagem do extremo oposto às 11:30 reverte; dias de lateralidade fecham no meio."],[6,"c",[],"Horários de relatório e 11:30 PST como pontos de inflexão; contar também sessão tardia e continuação até o fechamento."],[1,"s",[],"Dias de tendência têm contratendência de pânico tardia; dias de lateralidade têm rompimento oposto falho."]],"secs":[],"tr":[],"q":"ok","parts":[]},{"id":"l2c16","k":"livro","bk":2,"cap":16,"part":false,"t":"Contando as Pernas em Tendências e Lateralidades","pg":283,"o":52,"why":"","res":"Todo movimento e correção tende a ter duas pernas e cada perna tenta subdividir em duas; descreve a psicologia da primeira perna e do teste do extremo, e mostra exemplos de duas pernas, topo duplo em bandeira, cunha de topo e teste de rompimento.","L":[[9,"c",[1,2,6],"Contar duas pernas em correção; se as pernas estão num canal apertado ou parecem poucas barras, podem ser subdivisões da primeira perna."],[15,"e",[2,3,5],"Topo duplo em bandeira de baixa com L2 na média; alvo de cerca de duas vezes a altura da lateralidade; média respeitada em ações."],[27,"e",[2,5],"Cunha de topo seguida de correção de duas pernas lateral e duplo fundo; pernas podem ser só uma em tempo gráfico maior."],[14,"s",[1],"Impulso e canal formam dois movimentos de momentum diferente, por isso é movimento de duas pernas."],[21,"s",[5],"Teste de rompimento quase exato leva a movimento projetado de igual tamanho à primeira perna."],[10,"s",[3,4],"O teste do início do movimento tirou os stops de breakeven por um tick, seguido de movimento a favor."],[4,"c",[],"Contagem de pernas: toda perna tenta subdividir em duas e movimentos em geral têm duas tentativas."],[1,"s",[],"Primeira perna forte após reversão leva compradores e vendedores a esperar teste do extremo."]],"secs":[],"tr":[],"q":"ok","parts":[]},{"id":"l2c17","k":"livro","bk":2,"cap":17,"part":false,"t":"Contagem de Barras: Padrões de High (H) e Low (L) 1, 2, 3, e 4 e Correções ABC","pg":289,"o":49,"why":"Capítulo mais denso do livro 2. Ao ler, separe o que vale em tendência forte do que vale na lateralidade.","res":"Ensina a contar barras de correção (H1-H4, L1-L4), distingue H2 em tendência (continuação) de H2 em lateralidade, define filtros para H1/L1 (spike sem clímax), explica falhas, evolução para cunha/H3-H4, e comenta muitos exemplos.","L":[[7,"c",[1,2,3,4,5,6],"H1/L1 só em spike de tendência forte; H1/L1 em lateralidade ou após clímax falha; entrada a stop 1 tick além da barra de sinal; stop pequeno e scalp de 5 ticks."],[9,"c",[1,2,3,4,6],"H2 em tendência (na média) é um dos setups mais confiáveis; compradores e vendedores desistem na segunda queda; falha costuma virar H3 ou H4."],[27,"c",[2,3,6],"H3/L3 funcionam como cunha; operar como cunha se o momentum depois da falha do H2/L2 não muda; se há grande barra de rompimento, esperar H4/L4."],[8,"s",[3],"Em tendência muito forte, comprar a limit abaixo da mínima da barra anterior esperando L1/L2 falharem; vender a limit acima do H1 sem tendência."],[22,"s",[1,3,6],"Em lateralidade, H2 acima da média e perto do topo é fade a limit; H2 abaixo da média perto do fundo é compra; L2 perto do fundo é compra a limit."],[24,"w",[1,6],"Não contar barras em lateralidade estreita ou sobreposta com dojis; ali setups perdem a vantagem e instituições operam o oposto."],[29,"w",[1,6],"Não entre em H1/L1 a favor após clímax ou barra de tendência grande esgotada; a correção costuma ter 10 barras e duas pernas."],[15,"s",[2,3],"Duplo fundo é H2; topo duplo é L2; após H2 falho a venda acima do sinal gera topo duplo em reversão."],[10,"s",[2,3],"Canal forte contra a correção: espere o rompimento do canal e depois a correção (segunda entrada) em vez de entrar em H3/H4 (L3/L4); L4/H4 em canal estreito."],[14,"s",[1,2],"Spike e canal é movimento de duas pernas; no L2/H2 inferido da primeira perna do spike; teste do início do canal é ímã."],[21,"s",[5],"Falha de L4 ou cunha gera gap de medição e movimento projetado pela altura do padrão; H3 depois de L4 falho."],[23,"s",[2,3],"A falha de L2/L4 (ou H2/H4) prende participantes; entre onde os presos saem; L4/H4 com sinal pequeno: stop de 2-3 ticks além da barra de sinal."],[16,"s",[1,3],"L2 abaixo da média prende compradores prematuros; H2 na média em tendência de alta é setup forte; primeiro toque da média."],[12,"s",[1,2],"H1/L1 mais confiáveis em quebra falsa de micro linha de tendência na fase de spike; canal de baixa de quatro barras sem retorno forte exige esperar."],[32,"w",[1,6],"Contagem exige quebra prévia de linha de tendência mesmo menor; H4 sem força prévia não vale; L2 em tendência de alta é armadilha."],[11,"s",[1,3],"Em tendência forte, deixar ordem a stop abaixo da mínima anterior ou acima da máxima do swing para não ficar de fora."],[17,"e",[1,3],"Dia de tendência desde a abertura com grande gap: correções e H2/L2 do segundo candle do dia como setup a favor."],[39,"s",[4],"Barra de sinal pequena no H4/L4 exige stop financeiro de cerca de dois pontos (até 8 ticks no Emini) e não o stop de price action."],[37,"s",[4,5],"Contra tendência forte, comprar H1 tem ~40%; vender acima da máxima com stop de 2 pontos e alvo de 5 ticks tem ~60%."],[44,"s",[6],"Não operar toda contagem; quando uma entrada precisa de mais estudo para se convencer, não é sinal claro; esperar segundo sinal."],[4,"c",[],"Contagem de H1-H4 e L1-L4, correções ABC de duas pernas, mercados fractais e variantes quando a correção não segue a contagem."],[1,"s",[],"O mesmo setup de contagem tem vantagem em tendência e perde em lateralidade; H1/L1 só em tendência forte, não na borda da lateralidade."],[0,"s",[],"Barras de sinal com doji ou grandes demais, corpo contrário à entrada, sobreposição; barra externa; ii/ioi como sinais."],[2,"s",[],"Quebra de linha de tendência prévia dá força ao sinal; linha de canal falha em cunha."]],"secs":[["Definição de contagem: H1, H2, ABC, fractal e movimentos de duas pernas",[7,9]],["H2 em tendência (continuação) vs H2 em lateralidade (fade a limit no topo)",[9,22,8]],["Perfis de risco/retorno de H1, H3 e H4; falha de L4; não operar contra a tendência",[7,27,9]],["Não contar em lateralidade estreita; evitar sobreoperar",[24]],["Variantes de duas pernas e correções que evoluem (H1 para H2, H3, H4); canal forte",[9,27,10]],["Reversões a partir de H2/L2 e H3 como cunha; terminologia; falha de H4 com sinal pequeno",[15,27,39]],["H1/L1: filtro de spike, sem clímax, armadilha no topo da lateralidade, fade a limit",[7,8,22,29]],["H1/L1 contra a correção e micro linha de tendência; higher high e lower low",[12,10]],["Falha de H2/L2: quando virar H3 ou esperar H4 conforme momentum; reiniciar contagem",[9,27,21]],["Por que H2 e L2 são confiáveis; três puxadas como L2; reverter ao sair de scalps contra a tendência",[9,27]],["Fig 17.1: contar correções; barras 10 e 11 sem setup; H1 em spike forte",[7,9,29]],["Fig 17.2: H1 e L1 em lateralidade (ruins) vs tendência clara (bons)",[7,22]],["Fig 17.3: dia difícil de contar; H3 como cunha; L2 sem quebra de linha não vale",[27,9,24]],["Fig 17.4: SDS e Emini; sinal fraco; H4 sem força prévia",[9,32,44]],["Figs 17.5-17.6: L2 falho vira L4; falha de L4 e gap de medição",[23,21,39]],["Fig 17.7: L2 em tendência de alta não é venda",[8,11,32]],["Fig 17.8: L2 falho, distância da média e lateralidade apertada",[16,24]],["Fig 17.9: L2 falho evolui para L3 ou L4; H2 falho leva a H3 e teste do início do canal",[27,14,10]],["Figs 17.10-17.11: variantes de H2, restart da contagem e dias de gap",[9,27,23]],["Fig 17.12: variantes de L2 em tendência de baixa e armadilha tardia",[9,16,24]],["Fig 17.13: spike e canal como correção de duas pernas",[14,27]]],"tr":["Em tendência muito forte, pode-se comprar a limit abaixo da mínima da barra anterior, esperando que L1 ou L2 falhem; em geral é mais seguro comprar a stop acima da máxima.","H1 só vale no spike de tendência forte e sem clímax; no topo da lateralidade, vender a limit na máxima do sinal H1 com stop de 6 ticks é probabilidade de ~60%.","Se o spike for forte e a série de barras de alta não retornar, o mercado está sempre comprado; pode-se comprar o fechamento da barra com stop abaixo do spike, posição pequena.","Com sinal pequeno em H4/L4, o stop deve ser de 2-3 ticks além, no máximo ~8 ticks no Emini, e a trade deve respeitar a relação de risco e a probabilidade de ~60% para scalps de 5 ticks."],"q":"ok","parts":[]},{"id":"l2c18","k":"livro","bk":2,"cap":18,"part":false,"t":"Cunha e Outras Correções de Três Puxadas","pg":337,"o":76,"why":"","res":"Ensina que correções com três puxadas (cunha, triângulo, impulso e canal, formatos irregulares) são correções a favor da tendência e podem ser operadas já no primeiro sinal; a cunha de reversão contra a tendência exige segunda entrada.","L":[[27,"c",[1,2,3,6],"Cunha correção tem pelo menos 5 pernas, dura cerca de 10-20 barras, entra no primeiro sinal; cunha de reversão pede 20+ barras, canal claro e segunda entrada."],[7,"s",[3],"Cunha em tendência é correção: entrar a stop no primeiro sinal; H3/L3 funcionam como cunha; não esperar sinal perfeito pois é a favor da tendência."],[14,"s",[2],"Impulso e canal costuma ser um tipo comum de cunha correção; canal de impulso termina frequentemente em três puxadas e alvo mínimo é o início do canal."],[9,"s",[2,6],"Três pernas muitas vezes são duas pernas, a segunda com duas pernas menores; se a contagem confunde, olhar a tendência e não usar a contagem como desculpa para não operar."],[10,"s",[3],"Em cunha de reversão forte, esperar o rompimento e vender a correção (maior máxima ou menor máxima); rompimento fraco tende a falhar e vira compra."],[23,"w",[6],"Cunha que não gera sinal confiável vira lateralidade apertada, e o rompimento no sentido oposto indica falha da cunha, com projeção de movimento medido."],[21,"s",[5],"Após impulso (gap) e cunha, alvo aproximado é a altura do impulso; também perna 1 = perna 2; alvo mínimo do impulso e canal é o início do canal."],[25,"s",[1],"Triângulo é forma de três puxadas; horizontal é triângulo, inclinado é cunha; triângulo expandido aparece na Fig 18.1."],[15,"e",[2],"Topos duplos de bandeira de baixa aparecem junto às cunhas nas Figs 18.4, 18.6 e 18.7."],[29,"e",[1],"Clímax de venda seguido de impulso de alta; o mercado fica de lado e, se os vendedores vencem, quem comprou sai e acelera a queda."],[16,"e",[2],"Primeira barra de gap da média móvel encerra rali de três puxadas em tendência de baixa."],[17,"e",[1],"Gap de abertura funciona como primeira perna e a lateralidade até a barra 3 é a correção de uma retomada de tendência."],[4,"s",[],"Contagem de puxadas: correções acabam com duas pernas e a terceira perna prende os que apostam em nova tendência."],[2,"s",[],"Linha de tendência e de canal convergentes formam a cunha; ajuste aproximado basta, extremos ou corpos."],[1,"s",[],"Uma cunha inclinada em um sentido funciona como bandeira no sentido oposto, mesmo sem tendência prévia."]],"secs":[],"tr":[],"q":"ok","parts":[]},{"id":"l2c19","k":"livro","bk":2,"cap":19,"part":false,"t":"Linhas Duelando: Correção em forma de Cunha até a Linha de Tendência","pg":351,"o":90,"why":"","res":"Mostra que toda correção termina em algum suporte ou resistência de prazo maior; quando uma linha de canal curta cruza uma linha de tendência maior, forma-se linhas duelando e uma entrada confiável a favor da tendência maior.","L":[[32,"c",[1,2,3,6],"Correção chegando à linha de tendência e à linha de canal ao mesmo tempo; o sinal é a barra que fura a linha e reverte; movimento íngreme pede esperar a segunda entrada."],[27,"s",[1,2],"Forma mais confiável de linhas duelando é correção em canal com formato de cunha ou três puxadas terminando exatamente na linha."],[7,"s",[3],"Compra a stop um tick acima da máxima do segundo sinal (barra 7 de Fig 19.1) depois da queda íngreme até o suporte."],[15,"e",[2],"Topo duplo de bandeira de baixa antes do movimento até o suporte; também fundo duplo quando suporte é horizontal."],[10,"e",[3],"Após o rompimento do canal íngreme e o teste da média, o extremo de swing seguinte é segunda entrada de scalp."],[23,"e",[2],"Primeira barra do dia de baixa gera falha de rompimento de máxima de topo; combinada com triângulo expandido."],[14,"e",[1],"O movimento da abertura é impulso, e o movimento entre as barras 4 e 6 é o canal que termina na linha dupla."],[2,"s",[],"Desenhar linha de tendência e de canal usando todos os pontos de oscilação, inclusive de tendência anterior; observar reação após furar."],[3,"s",[],"Média móvel, topo/fundo anterior ou movimento medido são pontos onde mãos fortes encerram a correção."]],"secs":[],"tr":[],"q":"ok","parts":[]},{"id":"l2c20","k":"livro","bk":2,"cap":20,"part":false,"t":"Padrões de \"Reversão\": Topos e Fundos Duplos, e Topos e Fundos em forma de Ombro-Cabeça-Ombro","pg":357,"o":78,"why":"","res":"Argumenta que topos/fundos duplos e ombro-cabeça-ombro são na maioria padrões de continuação (bandeiras, triângulos, cunhas) que raramente revertem; deve-se buscar entrada a favor da tendência em vez de reversão.","L":[[26,"c",[1,2,3,6],"Topo duplo e OCO em tendência de alta são bandeiras de alta; quebra da linha do pescoço costuma falhar e vira compra; só em baixa ele é entrada de venda."],[15,"s",[2],"Topo duplo grande em lateralidade de 12 anos: a entrada padrão abaixo do fundo do vale raramente funciona; vender correção ou segunda máxima é melhor."],[27,"s",[2],"OCO tem três puxadas (após ombro esquerdo, cabeça e ombro direito), formando cunha; o ombro direito é a correção do rompimento."],[25,"s",[2],"OCO horizontal em tendência vira triângulo; OCO no extremo, em tendência, é triângulo ou cunha."],[22,"s",[1,6],"Topos em lateralidade grande atraem vendedores, mas rompimento do fundo falha; traders esperam lateralidade, não reversão."],[23,"s",[6],"Barras fortes de baixa rompendo a linha do pescoço atraem vendedores fracos; compradores fortes entram e transformam em bandeira de alta."],[10,"e",[2],"O ombro direito é a correção do rompimento do canal até a cabeça, com teste do extremo depois."],[16,"e",[2],"A cabeça terminou na primeira barra de gap da média, esperando teste do extremo."],[1,"s",[],"Esperar evidência adicional: seguir a tendência, pois reversões contra ela perdem na maioria."],[3,"s",[],"Pescoço e fundo anterior são suportes que atraem compradores e realização de lucro."]],"secs":[],"tr":[],"q":"ok","parts":[]},{"id":"l2c21","k":"livro","bk":2,"cap":21,"part":false,"t":"Exemplo de Como Operar uma Lateralidade","pg":409,"o":93,"why":"Exemplo completo de lateralidade, do contexto à saída.","res":"Aplica a doutrina de lateralidades num único dia de QQQ: sinais de dia lateral, lista de setups a stop para iniciantes e a limite para experientes, e análise barra a barra de scalps nos extremos.","L":[[22,"c",[1,2,3,5,6],"Máxima: comprar high 2 no fundo, vender low 2 no topo, scalp com alvo mínimo igual ao risco, nunca stops no meio do range."],[7,"s",[3],"High 2 perto do fundo e low 2 perto do topo, muitas vezes segunda tentativa como fundo ou topo duplo."],[8,"s",[3,6],"Ordens limite abaixo da barra de sinal fraca de L1/L2 no fundo e acima de H1/H2 no topo; só para experientes."],[27,"e",[2,3],"Cunha de alta (bandeira) perto do fundo comprada, barras 10, 12 e 16 três puxadas de queda; também descida em triângulo."],[23,"e",[3],"Comprar acima de barra de reversão após quebra de mínima no fundo; vender após quebra de máxima no topo."],[10,"e",[3],"Comprar correção do rompimento após alta perto do fundo; ordens a limite na mínima da barra anterior preenchidas na barra 18."],[15,"e",[2],"Fundo duplo de bandeira de alta em barra 16 e 26; topo duplo de bandeira de baixa em barra 24."],[25,"e",[2],"Triângulos entre as barras 10 e 16; o dia inteiro como triângulo grande com três puxadas."],[14,"e",[1],"Impulso (duas barras) e canal em cunha até barra 7 é primeira perna da lateralidade; mercado fica 10-20 barras sem tendência."],[24,"s",[1,6],"Lateralidade apertada das barras 10-16 funciona como ímã que impede rompimentos de irem longe."],[34,"s",[1],"Primeira barra doji e quatro ou cinco reversões na primeira hora aumentam a chance de dia lateral; a barra 2 como reversão de abertura pode marcar o extremo do dia."],[29,"s",[3],"Comprar no fechamento ou abaixo da mínima de grande barra de baixa perto do fundo como possível clímax de venda; vender em clímax de compra."],[38,"s",[3],"Iniciantes usam stops a favor; ordens limite exigem experiência e escalar contra o movimento é arriscado."],[37,"s",[1,5],"Iniciantes só devem fazer a lateralidade se probabilidade ao menos 60% e alvo de 2 pontos com stop de 2."],[41,"s",[3,4],"Comprar menor com plano de escalar uma segunda vez ~10 centavos abaixo, com stop total abaixo da barra 2."],[40,"s",[5],"Alvo no topo do range para compras e no fundo para vendas; não reverter, usar ordens de alvo e depois buscar o oposto."],[39,"s",[4],"Stop sob a barra de entrada ou sob a barra de sinal; ou stop em dinheiro igual à altura média das barras do dia."],[1,"s",[],"Reconhecer dia lateral por doji inicial, reversões frequentes e barras que falham em fechar além da média."],[3,"s",[],"Média móvel e extremos do range são alvos e pontos de reversão."],[4,"s",[],"H2/L2 e pernas de queda contadas pelo número de puxadas."]],"secs":[["Regras gerais: compre baixo, venda alto, scalp, alvo mínimo igual ao risco, esperar 5-10 barras",[22,37,40]],["Lista de setups a stop para iniciantes (H2/L2, cunha, falha de rompimento, correção do rompimento)",[22,7,27,23,10]],["Setups com limite e a mercado para experientes (spikes, clímax, H1/H2 e L1/L2 fracos)",[22,8,38,29]],["Fig 21.1: scalps de fade; operador veterano com 15 scalps de um ponto; iniciantes só se alvo de 2 pontos",[22,37,40]],["Como concluir que é dia de lateralidade (primeira barra doji, 4-5 reversões na primeira hora)",[22,34]],["Impulso e canal como primeira perna da lateralidade; entradas e stops no bar 2 e 4",[14,8,39]],["Barras 6-8: surto até a média e rejeição; vácuo e venda na média",[22,23]],["Barras 9-12: armadilha de alta, terceiro puxada de baixa e H2 no fundo (cunha, triângulo)",[27,25,7,15]],["Barras 13-18: correção do rompimento e lateralidade apertada como ímã",[10,24]],["Barras 20-24: máxima do dia, topo duplo de bandeira de baixa e H2 falho",[15,22]],["Barras 25-32: fundo duplo no fundo da lateralidade, H1 fraco no topo e dia como triângulo",[15,25,22]]],"tr":["Comprar a limite abaixo de barras no fundo do range, incluindo cunha de alta e fundo duplo, é descrito como técnica de um veterano que faz cerca de 15 scalps de um ponto.","Manter alvo ao menos igual ao risco para não exigir 70% de acerto; iniciantes só devem operar se espera probabilidade de 60% e alvo de 2 pontos.","Vender a limite ou a mercado na barra de impulso de alta perto do topo e comprar no fundo exige stop mais largo; o texto marca isso como difícil."],"q":"ok","parts":[]},{"id":"l2c22","k":"livro","bk":2,"cap":22,"part":false,"t":"Lateralidades Estreitas","pg":421,"o":11,"why":"Lateralidade estreita é o contexto em que a maioria dos padrões deixa de valer. Entra aqui para definir o que significa não operar.","res":"Ensina a reconhecer lateralidade estreita e barbwire e a evitá-las: a maioria das entradas a stop perde, probabilidade de rompimento é só 51-55%; só aguardar rompimento falho ou correção.","L":[[24,"c",[1,2,3,4,5,6],"Evitar operar; esperar rompimento, ver se falha e entrar na falha ou na correção; barbwire junto à média rompe para longe dela; sair em breakeven se já posicionado."],[23,"s",[3,6],"No barbwire, vender 1 tick abaixo da barra de rompimento de alta que fecha; se falhar, reverter para compra um tick acima."],[10,"s",[3],"Após rompimento de lateralidade apertada, esperar fechamento da barra de correção e entrar a stop um tick além dela."],[30,"s",[2,6],"Lateralidade apertada após 20+ barras de tendência é bandeira final; rompimento retorna ao range e frequentemente gera correção de duas pernas."],[12,"s",[2,3],"Canal estreito é lateralidade apertada inclinada; em micro canal de baixa o rompimento falho não é compra, vender a correção."],[7,"s",[3],"No fim de correção à média em tendência forte, entre em H2/L2 mesmo no barbwire se a barra de sinal for a favor e sem sombras."],[25,"e",[2],"Lateralidade apertada evolui para triângulo com dois rompimentos falhos e posterior movimento; triângulo expandido no barbwire também."],[22,"s",[3],"Experientes compram abaixo da mínima anterior perto do fundo e vendem acima da máxima perto do topo, tedioso e só com barras do tamanho médio do dia."],[29,"e",[1],"Três clímax seguidos levam a correção de 10 ou mais barras com duas pernas; barbwire no extremo vira bandeira final."],[21,"e",[5],"Movimento medido de spike e de gap medidor projeta suporte onde o barbwire se forma."],[16,"e",[2],"A primeira barra de gap da média na Fig 22.3 veio após clímax e falha de rompimento."],[17,"s",[1,5],"Tendência forte, depois lateralidade apertada de horas, depois rompimento gera segunda perna do mesmo tamanho."],[44,"c",[6],"Não operar lateralidade apertada, não dobrar posição após perdas; esperar bons swings, até o dia seguinte se preciso."],[37,"s",[1,4],"Em lateralidade apertada a probabilidade equidistante é ~50% e o alvo de 2-3x o risco quase impossível; estratégia de stop perde com o tempo."],[38,"s",[3,6],"Entradas e saídas a stop perdem; só traders muito consistentes usam limite, os demais devem esperar."],[39,"s",[4],"Stop muito largo para esperar rompimento é pouco sólido matematicamente; melhor sair e esperar lateralidade maior."],[1,"s",[],"Lateralidade apertada indica perda de direção; probabilidade do rompimento 51-55% mesmo após tendência forte."],[0,"s",[],"Barbwire: três barras sobrepostas, doji, sombras; segunda barra com mais de metade dentro das vizinhas."],[3,"s",[],"Média móvel vizinha define o lado do rompimento."]],"secs":[["Definição de lateralidade apertada e ordem de grandeza (3 pontos no Emini)",[24]],["Mecânica: ambos lados acumulam posição; exaustão leva ao rompimento; programas de HFT",[24]],["Não entrar no rompimento; esperar continuidade, correção ou falha; vácuo micro",[24,23,10]],["Matemática: stop contra e probabilidade 51-55%; 'lateralidade apertada vence tudo'",[24,37]],["Dia de retomada de tendência: forte tendência, lateralidade longa, rompimento com mesmo tamanho",[17,24]],["O que fazer se já está posicionado: sair no breakeven; martingale e armadilhas de iniciante",[44,24]],["Barbwire: definição, média móvel e direção do rompimento",[24,30]],["Regra cardinal do barbwire: nunca entrar no rompimento; fade e entrada reversa",[24,23]],["H2 no fim de correção à média dentro de barbwire; micro canais",[7,12]],["Figs 22.1-22.3: lateralidade apertada, ambas as pernas e evolução para lateralidade maior",[24,25,10]],["Figs 22.4-22.5: stops em barbwire custam; dez perdedores seguidos e martingale",[24,44]],["Figs 22.6-22.12: inclinada, ioi, falha de rompimento, bandeira, reversão e low 2",[24,30,29]]],"tr":["O capítulo não incentiva scalps de duração curta em lateralidade apertada: com um ponto de alvo e dois de risco perde-se; esperar por rompimento falho antes de entrar a favor."],"q":"ok","parts":[]},{"id":"l2c23","k":"livro","bk":2,"cap":23,"part":false,"t":"Triângulos","pg":457,"o":87,"why":"","res":"Define triângulos (mínimo três puxadas), tipos ascendente, descendente, simétrico e expandido, e diz que são lateralidades com viés fraco de continuação: esperar o rompimento, operar extremos ou correção do rompimento, com alvo igual à altura.","L":[[25,"c",[1,2,3,5,6],"Triângulo é pausa na tendência; espere o rompimento, avalie a força e entre na correção do rompimento; os extremos podem ser contra-operados se estiverem esticados; o alvo é a altura do padrão."],[27,"s",[2],"três puxadas inclinados: cunha em tendência apertada funciona como canal; não reverter só por haver três pernas, esperar rompimento."],[19,"s",[3,6],"Rompimento de triângulo: se forte, entrada no fechamento ou na correção; se fraco, espere a falha; rompimento sem força em cunha é sinal de força do lado oposto."],[21,"s",[5],"Rompimento tende a medir aproximadamente a altura do triângulo; além disso é tendência."],[30,"s",[2,6],"Triângulos frequentemente são bandeira final; rompimento falho volta ao range e pode virar correção de duas pernas ou reversão."],[23,"s",[6],"Triângulo E rompeu para cima, falhou, depois para baixo e falhou novamente."],[22,"s",[3],"Triângulo alto o bastante pode ser tratado como lateralidade: comprar embaixo, vender em cima, testes de linhas."],[4,"s",[],"Contar três puxadas; mais de cinco puxadas vira lateralidade; ii e oo são pequenos triângulos."],[2,"s",[],"Triângulo é canal entre duas linhas; ascendente tem linha de tendência embaixo, descendente em cima."]],"secs":[],"tr":[],"q":"ok","parts":[]},{"id":"l2c24","k":"livro","bk":2,"cap":24,"part":false,"t":"Operando Scalps, Swings, Trading e Investimentos","pg":465,"o":37,"why":"Define o tipo de trade: scalp, swing ou investimento, e o que muda no alvo.","res":"Distingue investidor, trader, scalper e swing trader intradiário e mostra por que scalp com alvo menor que o risco exige taxa de acerto irreal; recomenda alvo de pelo menos 2 pontos com stop de 2 no Emini 5 min e realizar parcial antes de segurar o resto.","L":[[42,"c",[1,5],"Define scalp, swing e day trade; scalp exige acerto altíssimo, swing aceita 40-50% com alvo de duas vezes o risco; maioria dos traders mistura os dois."],[37,"s",[1,4],"Quem toma o outro lado de um scalp é swing trader; stop de 2 pontos pede alvo de ao menos 2 pontos para o equilíbrio fazer sentido."],[40,"c",[5],"Realizar 25 a 75 por cento entre 1 e 2 vezes o risco inicial, mover stop para perto do zero a zero e escalonar o resto; alvo tocado e não executado indica fraqueza."],[39,"s",[4],"Stop de 2 pontos é o mais confiável no Emini 5 min; mover da barra de sinal para a barra de entrada e depois para o zero a zero após 5 ticks."],[41,"s",[3,5],"Swing traders adicionam em correções contra e usam stop mental onde a premissa morre; scalpers adicionam onde outros são parados."],[7,"e",[3,5],"Exemplo Fig 24.2: compra de H2 na média móvel em swing com parciais em 2 a 4 pontos; vendas em reversão de duas barras com alvo no meio da faixa."],[22,"e",[3,5],"Em dia lateral, swing traders compram fundo de dupla com risco ~2 e alvo ~5 pontos, mesmo com 40-50% de chance."],[44,"s",[6],"Converter trade perdedor em investimento é erro clássico; cherry-picking de scalps de 1 ponto não compensa; iniciante tende a superestimar 60%."],[1,"s",[],"Scalp só quando não há always-in claro ou o trade é contra a tendência; recuo de 3-4 ticks após sinal sugere lateralidade."]],"secs":[["Investidor, trader, scalper e swing: definições",[42]],["Matemática dos dois lados: quem toma o outro lado do scalp",[37,42]],["Emini 5 min: stop de 2, alvo mínimo de 2, scalp de 1 ponto não funciona; OCO",[39,40,37]],["Scalp x swing em tendência; adicionar nos stops dos scalpers",[42,41]],["Dificuldade do swing e por que beginners esperam demais",[42,43]],["Gerenciar swing: parciais em 2 a 4 pontos, alvo tocado sem fill",[40,39]],["Ações: swing em ações, alvos e personalidade das ações",[42,40]],["Figuras 24.1 e 24.2: swing após correção, swings para cima e para baixo",[7,22]]],"tr":["Alvo de 1x o risco exige probabilidade de ao menos 60%; com stop de 2 pontos o alvo mínimo recomendado é 2 pontos, e alvos menores que o risco levam à ruína.","Sugere ordem OCO de stop de 2 pontos e alvo de 2 a 4 pontos para evitar sair no zero a zero no primeiro recuo.","Scalp costuma durar de 1 a 15 minutos, enquanto swing intradiário segura de 15 minutos até o dia todo."],"q":"ok","parts":[]},{"id":"l2c25","k":"livro","bk":2,"cap":25,"part":false,"t":"Matemática do Operacional: Devo Realizar essa Operação?","pg":485,"o":36,"why":"Capítulo longo. Vale ler primeiro as seções sobre probabilidade, risco e recompensa.","res":"Núcleo da equação do trader: probabilidade x recompensa contra probabilidade x risco, com tabelas de probabilidades típicas por setup, a ideia de probabilidade direcional de um movimento equidistante e como risco, alvo e chance mudam a cada tick.","L":[[37,"c",[1,4,5],"Opere só se prob x alvo supera prob x risco; na dúvida use 50%, com setup bom 60%, e exija alvo de 2x risco com 40-50%."],[40,"c",[5],"Alvo mínimo igual ao risco com 60%; mudar para alvo menor que o planejado torna a equação negativa; alvo do movimento projetado é o mínimo institucional."],[39,"c",[4],"O risco vem da barra de sinal mais 1 tick; em spike o stop teórico fica além do spike, exigindo posição menor; saia se a equação ficar negativa."],[38,"c",[3],"Limit e mercado exigem experiência, mas muitos setups com limit têm 60%; stop em spike forte tem probabilidade direcional de 60%+ de movimento igual ao spike."],[42,"c",[1,5],"Scalper precisa de 60-70% com alvo ~ risco e perde tendências fracas; swing aceita 40% com ganho de 2x ou mais; um pontos de scalp precisa 80%."],[41,"s",[3,5],"Escalar e stops largos podem elevar uma chance de 60% para 80%, trocando acerto por risco maior."],[43,"s",[6],"Instituições não caçam stops; stop só é atingido se há instituição disposta a negociar ali."],[44,"s",[6],"Iniciantes enganam a si mesmos: alvo grande no cálculo e saída pequena na prática; dependência de apenas uma variável."],[21,"c",[5],"Spike que cresce aumenta o alvo; movimento projetado é o mínimo para equação positiva institucional e muitos alvos funcionam exatos."],[7,"s",[3,5],"Compra de H2 na média móvel com 70% de chance; L2 na média em tendência de baixa; H1 em spike forte tem 60%+."],[8,"s",[3],"Compra em limit abaixo da barra anterior em bandeira quieta na média móvel e vender L1 enfraquecido, com cerca de 60% e alvo ~2x risco."],[22,"c",[1,3,5],"Compra no fundo e venda no topo de lateralidade tem 60%+; na borda, a probabilidade sobe a 60-70% e volta a 50% no meio."],[23,"s",[1,2,6],"A maioria das tentativas de rompimento de lateralidade falha: regra 60-40 a favor da falha."],[24,"w",[6],"Em lateralidade muito estreita, a chance de acerto por instantes não compensa os custos; um rompimento com lucro de várias vezes o risco pode render cerca de 50% de acerto."],[14,"s",[1,5],"Após o spike a probabilidade direcional erode no canal até 50%, e no topo do canal favorece correção ao fundo do canal."],[18,"c",[3,4,5],"Em breakout forte com always-in claro a chance de movimento equidistante é 60%+; entrar cedo mesmo com risco maior e posição reduzida."],[27,"s",[3,5],"Cunha de alta em correção e cunha de baixa em rally têm 60%+; cunha de fundo em Fig 25.3 pode render swing mesmo com baixa probabilidade."],[10,"s",[3],"Compra de rompimento-e-correção em tendência e compra abaixo de barra de alta que rompe bandeira têm 60%+ de chance."],[29,"s",[3],"Comprar clímax de venda no fim de barra grande e vender clímax de compra tem 40-60% de chance, pedindo alvo >= risco."],[32,"s",[3],"Após forte rompimento da linha de tendência, testar o extremo e comprar higher low ou lower low tem 60%."],[1,"s",[],"Espectro unilateral x bilateral explica correções por realização de lucro e vazios; 40-60% em 90% do tempo."],[3,"s",[],"Magnetos como alvo do movimento projetado e topo da faixa onde a probabilidade favorece a queda."],[0,"s",[],"Barra de sinal fraca vs forte e fechamento do spike determinam se é setup de 60% ou 40%."]],"secs":[["Edge, trader institucional e probabilidade x recompensa x risco",[37]],["Lista de setups por probabilidade: 70, 60, 50, 40 por cento",[7,27,10,22,8,32,29,21]],["Como a equação do trader é usada: risco, tamanho, 50/60/40 por cento",[37,39]],["Instituições do outro lado; swing x scalp e por que o scalper perde tendências",[42,37]],["Espectro unilateral-bilateral, correções por realização e vácuo de venda",[1,8]],["Baixa probabilidade e cherry-picking; alta probabilidade e scalp",[37,42]],["Entrar cedo x tarde; 90 por cento no alvo quase tocado",[37,40]],["Exemplos de contas: 2 pontos, 4 pontos, 10 trades, comissões",[37,40]],["Scalp de 1 ponto com stop de 2 e mudança de probabilidade a cada tick",[37,42,39]],["Quando a equação é ruim, faça o oposto com limit; autoengano",[8,44,38]],["Operações simultâneas dos dois lados; distribuições enganam",[37]],["Swing com stop de 2 e alvo de 4; sinal fraco serve para sair",[42,40]],["Alvo = risco com AAPL: breakout, lateralidade, fade a 3 dólares",[21,18,22,23]],["Probabilidade direcional de movimento equidistante",[37,22]],["Lateralidade: extremos, meio e faixa estreita (breakout)",[22,24,23]],["Spike forte: entrar cedo e operar menor; faixa 40-60 por cento",[18,14,38]],["Probabilidade no canal e na lateralidade; por que o movimento projetado funciona",[14,21,22]],["Fig 25.1: alvo cresce com o spike",[21,18]],["Fig 25.2: momentos breves de maior probabilidade; compra de limit 4 pontos abaixo",[22,21,8,24]],["Fig 25.3: scalpers perdem tendências com setups de baixa probabilidade",[27,42,7]]],"tr":["Compra em limit abaixo de L1/L2 fraco ou da barra anterior em tendência de alta ou fundo de lateralidade tem cerca de 60%; vender H1/H2 fraco no topo da lateralidade também.","Compra de limit no fundo da faixa após várias tentativas repetidas de baixa, com risco igual ao alvo (por exemplo 4 pontos), tinha 60-70% de chance de teste do rompimento.","Em spike forte (3 barras), entrar no fechamento ou a mercado com stop teórico abaixo do spike tem 60% de movimento equidistante; reduzir tamanho para manter risco igual.","Alvo mínimo de 1x o risco com 60%; alvo menor leva a prejuízo, e com 50% é preciso 2x o risco.","Risco efetivo muda a cada tick: ao subir stop para o fundo da barra atual o risco cai, mas não entre a mercado só por isso.","Vários trades curtos e com alvo realizado em 6 a 10 ticks no Emini são scalps; ninguém vive de 1 ponto com stop de 2."],"q":"ok","parts":[]},{"id":"l2c26","k":"livro","bk":2,"cap":26,"part":false,"t":"É Necessário Ter Duas Razões para Entrar numa Operação","pg":537,"o":40,"why":"","res":"Regra de exigir duas razões independentes para entrar (barra de sinal, correção na média, teste de suporte, falha de algo etc.); só uma razão basta em tendência forte, segunda entrada ou reversão após overshoot; exemplos mostram armadilhas contra tendência.","L":[[43,"c",[1,2],"Duas razões são condição para entrar; uma basta em correção de tendência forte, segunda entrada ou fade de overshoot com boa barra de reversão."],[44,"c",[6],"Regras simples permitem agir sem hesitação; operar setups de baixa probabilidade apaga mais que todos os ganhos."],[9,"s",[2,3],"A segunda entrada já traz a segunda razão; H2 em fundo duplo e L2 em topo duplo são setups."],[7,"s",[1,2,3],"Correções à média, primeiro toque em 20 barras e correção de H1/L1 em spike forte entram com uma razão só quando a tendência é forte."],[27,"s",[2],"H3 como bandeira cunha de alta e L3 como cunha de baixa; H4/L4 em tendência; cunha íngreme exige esperar L alto."],[25,"e",[2,3],"Triângulo expandido com quatro pernas na Fig 26.2: comprar após novo extremo abaixo da barra 3, entrada acima de higher low de duas barras."],[24,"w",[6],"Em lateralidade apertada de barras sobrepostas, não entre até rompimento por barra grande falhar ou barra pequena no extremo."],[32,"s",[1,2],"Reversão após rompimento de linha de tendência e overshoot de canal; teste do extremo esperado depois do primeiro rompimento forte."],[23,"s",[2,3],"Falha de qualquer coisa conta como razão: rompimento de máxima/mínima, overshoot de linha de canal, alvo de 5 a 9 ticks não alcançado."],[12,"w",[6],"Em canal estreito aguarde segundo sinal; comprar ou vender a contra tendência em canal íngreme costuma falhar."],[38,"s",[3],"Limit na média móvel em ações em tendência forte; entrar a stop abaixo da barra que testa a média; compra escalonada em novas mínimas."],[41,"e",[3,5],"Compra de meia posição em limit na mínima anterior e outra 2 pontos abaixo; sair tudo no preço da primeira entrada."],[1,"s",[],"Never trade countertrend em tendência íngreme sem quebra da linha de tendência com momentum."],[4,"s",[],"Contagem H2/L2/H4 vale em tendência ou borda de lateralidade, não como reversão de tendência de baixa íngreme."]],"secs":[],"tr":["Compra de limit a cada nova mínima em tendência forte de baixa só para experientes: meia posição na mínima anterior, outra 2 pontos abaixo, alvo de 1 ponto; sair ao voltar ao primeiro preço.","Toque na média móvel em tendência forte pode ser entrado a limit; na barra de 1 minuto, a entrada tem stop menor mas pouca vantagem."],"q":"ok","parts":[]},{"id":"l2c27","k":"livro","bk":2,"cap":27,"part":false,"t":"Entrando com Ordens Stop","pg":549,"o":65,"why":"","res":"Entrar a stop é a entrada mais confiável e a única que iniciantes devem usar até serem lucrativos, pois o mercado já se move a favor; stop inicial um tick além da barra de sinal e, se a barra de entrada for forte, apertar.","L":[[38,"c",[3],"Entrar a stop leva a posição junto ao momentum de pelo menos mini tendência; é a abordagem mais confiável para quem ainda não é lucrativo."],[39,"s",[4],"Stop um tick além da barra de sinal; apertar para além da barra de entrada se tiver corpo forte, caso contrário manter até mercado andar."],[40,"e",[5],"Entrada 1 tick além da barra e alvo de 4 ticks exigem um movimento de 6 ticks além da barra de sinal, pois a ordem limite só preenche no tick seguinte."],[0,"s",[],"Define barra de sinal e barra de entrada."]],"secs":[],"tr":["Para realizar 4 ticks após entrada a stop um tick acima da barra de sinal, o mercado precisa andar cerca de 6 ticks além dela; 10 ticks para 8 ticks de lucro.","Stop apertado para um tick além da barra de entrada só se ela fechar com corpo forte; senão, stop na barra de sinal."],"q":"ok","parts":[]},{"id":"l2c28","k":"livro","bk":2,"cap":28,"part":false,"t":"Entrando com Ordens Limitadas","pg":551,"o":66,"wh
