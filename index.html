,[3],""]]},{"id":"a35","k":"aula","n":35,"t":"Scaling in","tp":"Escalonamento de entrada","parts":["A","B"],"s":5,"o":115,"why":"","L":[[41,"c",[5],""]]},{"id":"a37","k":"aula","n":37,"t":"How to Trade","tp":"Como operar","parts":["A","B"],"s":3,"o":118,"why":"","L":[[44,"s",[3],""]]},{"id":"a49","k":"aula","n":49,"t":"Swing Trading Examples","tp":"Exemplos de swing trade","parts":["A","B","C","D"],"s":5,"o":119,"why":"","L":[[42,"s",[5],""],[40,"s",[5],""]]},{"id":"l1c0","k":"livro","bk":1,"cap":0,"part":false,"t":"Introdução (sinais de força, contagem de barras H1/H2/L1/L2)","pg":1,"o":24,"why":"Apresenta o vocabulário que todo o resto usa, incluindo a contagem de barras.","res":"Apresenta a filosofia do método: ler barra a barra um único gráfico, seguir o dinheiro institucional, aceitar probabilidades de 50-60 por cento e exigir risco/retorno adequado. Traz as listas de características de tendências fortes, rompimentos fortes e reversões fortes, e a contagem H1-H4/L1-L4 e ABC.","L":[[18,"c",[2,3,4],"Lista longa do que torna um rompimento forte: barra grande sem sombras, continuidade, micro gaps, primeira correção só após 3+ barras e sem tocar o."],[12,"s",[1,2],"Tendência forte tem pouca sobreposição, correções pequenas e laterais, sem clímax grandes e com urgência; correções fracas de sinal são normais."],[7,"c",[2,3,4],"Entrada a favor com ordem stop 1 tick além da barra anterior em H1/H2 ou L1/L2; em tendência forte a barra de sinal costuma parecer."],[9,"c",[1,2,3],"H2 em tendência de alta e L2 em baixa correspondem à correção ABC; a perna C pode não ultrapassar a A; segundo sinal é mais."],[27,"s",[1,2],"Correção que termina na terceira perna gera H3/L3, normalmente bandeira em forma de cunha; H4 que falha sugere que a tendência virou swing oposto."],[29,"s",[1,2,3],"Reversão forte tem barra grande, continuidade nas 2-3 barras seguintes, segunda tentativa de reverter e reversão de extremo ou linha de canal."],[32,"s",[1,2],"Reversão bem-sucedida rompe a linha de tendência com momentum e depois testa o extremo; divergência de indicador sem isso é estratégia perdedora."],[16,"s",[1,2],"Sequência de 20 ou mais barras sem tocar a média móvel é sinal de tendência forte, a ser tratado no livro 2."],[21,"s",[5],"Gaps de medida e micro gaps entre barras marcam força; tendências avançam até áreas de suporte/resistência em movimentos projetados, onde a incerteza retorna."],[10,"s",[2],"Rompimento forte tem primeira correção curta, de 1-2 barras, que não volta ao ponto de rompimento; rompimento-e-correção definido na lista de termos."],[23,"w",[6],"Em lateralidade a maioria dos rompimentos falha; em tendência a maioria das reversões falha e vira bandeira a favor da tendência."],[15,"s",[1],"Define bandeira de alta em fundo duplo e de baixa em topo duplo, correções dentro de tendência com dois impulsos ao mesmo preço."],[24,"w",[6],"Sinais gerados em lateralidades estreitas e barbwire devem ser evitados; sem movimento que justifique, barra de sinal é inútil."],[1,"s",[],"A decisão central é se o mercado está em tendência ou lateralidade; na dúvida assuma lateralidade; opere a favor do always in e do lado institucional."],[4,"c",[],"Contagem H1-H4/L1-L4 e pernas ABC; a primeira barra acima da máxima da anterior encerra a primeira perna da correção."],[0,"s",[],"Cada barra é de tendência ou doji; corpos, sombras e fechamento em relação às barras anteriores indicam quem controla."],[3,"s",[],"Máximas e mínimas de barras estão em resistência e suporte; testes de extremos e movimentos projetados definem onde a incerteza volta."],[2,"s",[],"Linhas de tendência e de canal são as ferramentas mais úteis, junto com máximas/mínimas anteriores, rompimentos e falhas."],[5,"s",[],"Gaps de rompimento, de medida e micro gaps são equivalentes a barras de tendência fortes; definição na lista de termos."],[6,"s",[],"Gráficos em horário do Pacífico; destaque aos segundos finais de barras de 5 e 15 minutos, em que a aparência da barra pode virar."],[45,"s",[5,6],"Tendência de muitos pontos em poucas barras tem correção; depois costuma testar e superar o extremo."]],"secs":[["Instituições e algoritmos como fonte do price action; siga o volume majoritário",[]],["Ignorar notícias, TV e especialistas; exemplos COST e YHOO; correção de 75 por cento ou mais",[]],["Indicadores, osciladores e divergência complicam; só EMA 20 e um gráfico",[32]],["Probabilidade 50-50, incerteza e lateralidade como estado padrão",[]],["Apostas, Martingale, disciplina e crashes como padrão operável",[]],["Estrutura dos três livros e como ler as figuras",[]],["Características de tendências fortes",[12,16,7]],["Checklist de rompimento forte de alta e de baixa",[18,10]],["Barra de reversão e características de reversões fortes",[29,32]],["Contagem de barras H1-H4 e L1-L4, ABC, cunha H3/L3",[7,9,27]],["Definição de price action, tendência x lateralidade, probabilidades com X ticks",[23]],["Instituições seguram posição; stops, risco/retorno, scalp x swing, sair parcial",[]],["Operações de alta frequência e quants",[]],["Exagero, regressão à média e não apostar contra tendência",[]],["Figura P1.1: correções de duas pernas, H1/H2/L1/L2, scalp de 4 ticks e falha de 5 ticks",[9,7]],["Fibonacci e Ondas de Elliott como aproximações pouco operáveis",[]]],"tr":["Scalp de 4 ticks exige que o mercado ande cerca de 6 ticks além da barra de sinal; cinco ticks sem o sexto sinaliza falha e possível setup oposto.","Se o stop for maior que o alvo, é preciso acertar 70 por cento ou mais; com risco igual ao retorno, é preciso bem mais que 60 por cento.","Iniciantes devem buscar swings com alvo de pelo menos duas vezes o risco, aceitando 40 a 50 por cento de acerto e poucas oportunidades.","Contra uma forte tendência, aguarde o fechamento da barra de sinal e entre só com ordem stop um tick além; reversões se desfazem nos segundos finais.","Rompimento forte: primeira correção só após 3+ barras e sem voltar ao ponto de entrada; entrar cedo e mover o stop para o empate favorece o trader."],"q":"ruidoso","parts":[]},{"id":"l1c1","k":"livro","bk":1,"cap":1,"part":false,"t":"O Espectro do Price Action: Tendências Extremas para Lateralidades Extremas","pg":63,"o":0,"why":"Panorama do espectro que vai de tendência extrema a lateralidade extrema. É a primeira régua para classificar o que está na tela.","res":"O mercado vai de tendência extrema a lateralidade extrema, quase sempre em estados intermediários; toda tendência contém lateralidades e vice-versa, e o mercado tem inércia. Introduz a contagem de pernas em vez de ABC e AB=CD.","L":[[17,"e",[1,2],"Figura 1.1: rompimento da máxima de ontem na abertura falhou, gerando tendência de baixa desde a abertura e dia de retomada de tendência."],[9,"s",[1],"Movimentos de duas pernas são comuns; o autor prefere contar pernas e H/L a usar ABC, ondas de Elliott ou AB=CD."],[24,"e",[1],"Mostra um extremo de lateralidade estreita incomum entre duas pernas de tendência, ilustrando o espectro tendência-lateralidade."],[23,"s",[1],"Rompimento de um tick acima da lateralidade estreita antecedeu rompimento de baixa; falso rompimento no meio do dia arma swing até o fechamento."],[1,"c",[],"Espectro do price action: tendências extremas a lateralidades extremas; a maioria das tendências é parte de lateralidade em tempo maior e vice-versa."],[4,"s",[],"Explica pernas, H1/H2/H3/H4 e L1/L2, e rejeita AB=CD porque projetar movimentos é outro assunto."]],"secs":[],"tr":[],"q":"ruidoso","parts":[]},{"id":"l1c2","k":"livro","bk":1,"cap":2,"part":false,"t":"Barras de Tendência, Barras Doji e Climaxes","pg":67,"o":26,"why":"","res":"Toda barra é de tendência ou doji; ensina a ler corpos, pressão compradora/vendedora, clímax como exaustão, efeito vácuo e por que barras fortes podem ser armadilha. Figuras mostram dojis em tendência, barras de tendência sem tendência e grande barra de baixa que encerra a queda.","L":[[29,"c",[1,2,6],"Toda reversão é clímax mais rompimento no sentido oposto; uma barra de tendência enorme após 30 ou mais barras, em um nível de suporte ou resistência, tende a ser clímax de exaustão: espere correção no sentido oposto."],[18,"w",[2,6],"Barra de tendência sem continuidade é armadilha: exigir segunda ou terceira barra antes de acreditar que o always in virou; compradores presos pioram a queda."],[21,"e",[5],"Impulso de duas barras de baixa sem sobreposição sugere movimento projetado a partir da abertura ou máxima do impulso até o fechamento da última barra."],[17,"e",[1,3],"Falha de rompimento da máxima de ontem e dia de retomada de tendência de baixa; vender o colapso após horas de calma, no fechamento da."],[23,"e",[2,6],"A ultrapassagem da linha de canal falhou, como a maioria: falhas de rompimento da linha de canal são comuns porque tentam acelerar uma tendência."],[30,"e",[2,3],"Barra doji de gap da média móvel como sinal contra a tendência, em bandeira final de duas barras internas cujo rompimento falhou, testando o extremo do dia."],[16,"e",[2,3],"Em tendência forte, a barra de gap da média móvel serve de entrada a favor para testar o extremo do dia; o teste costuma levar a reversão."],[32,"s",[1],"Rompimento da linha de canal seguido de reversão e dojis, com fechamentos e extremos sucessivos no sentido oposto, forma uma barra de reversão no tempo."],[0,"c",[],"Barras de tendência x doji, tamanho do corpo versus média de 5-10 barras, sombras, fechamentos em tendência, barras ruins em dias fortes."],[1,"s",[],"Pressão compradora e vendedora acumulada, always in, e como uma barra grande pode ser início ou fim da tendência."],[48,"s",[2,3,6],"Sem continuação da barra de alta forte, vender no fechamento, acima ou abaixo da barra, a favor de saída dos compradores."]],"secs":[["Barras de tendência x dojis, e subtipos de candle irrelevantes",[]],["Toda barra de tendência é impulso, rompimento, gap e clímax; efeito vácuo e crashes",[29]],["Clímax e reversão climática; barras fortes de baixa em tendência de alta",[29]],["Pressão compradora e vendedora; dojis e séries de dojis (Figuras 2.1 a 2.3)",[30,16]],["Barras de tendência sem tendência (Figura 2.4) e clímax de venda (Figura 2.5)",[18,21,29]],["Tendência convertendo-se em lateralidade (Figura 2.6)",[]]],"tr":["Impulso de barras fortes sem sobreposição: vender no fechamento da barra 13 com stop acima da máxima da barra de sinal; depois mover o stop para o empate.","Se houver medo do tamanho do risco em barras grandes, operar posição bem pequena e subir o stop ao empate quando a barra seguinte confirmar."],"q":"ruidoso","parts":[]},{"id":"l1c3","k":"livro","bk":1,"cap":3,"part":false,"t":"Rompimentos, Lateralidades, Testes e Reversões","pg":87,"o":1,"why":"","res":"Mostra o ciclo rompimento, canal, lateralidade e teste, e como toda reversão ou rompimento é um teste de algo. Descreve o padrão de impulso e canal como transição de negociação unilateral para bilateral e a maioria das reversões virando lateralidades.","L":[[14,"c",[1,2,5],"Impulso seguido de canal com sobreposição vira bandeira no sentido oposto ao canal; a borda do canal é testada em um ou dois dias, e os participantes do outro lado realizam ali."],[23,"c",[1,2,6],"Rompimento pode levar a swing no mesmo sentido ou no oposto; a falha no extremo do dia anterior criou um novo extremo de swing e impulso; todo rompimento é seguido por teste."],[10,"s",[1,2],"Testes do rompimento e da barra de sinal: quando os participantes a favor impedem que o stop seja atingido no teste, o preço costuma fazer um novo extremo."],[27,"e",[2],"A mínima da barra 2 foi a terceira puxada para baixo, reversão em cunha; barra 7 também foi bandeira de alta em cunha, terceira puxada."],[15,"e",[2],"Barras 5 e 7 formam bandeira de alta em fundo duplo; barra 6 foi bandeira de baixa em topo duplo, setups de correção dentro do."],[26,"e",[2,6],"Topos e fundos duplos raramente são exatos; topo duplo da barra 4 gerou só uma correção de uma barra antes do rompimento; fundo duplo na."],[30,"e",[2],"A barra foi a bandeira final de reversão, após seis barras em bandeira a favor da tendência."],[22,"s",[1],"Após falha de rompimento para nova mínima, vendedores realizam lucro e compradores seguem entrando até um novo equilíbrio, uma lateralidade."],[29,"s",[1],"A maioria das reversões não vira tendência oposta e sim lateralidade, mas o movimento é grande o bastante para swing; realizar parte do lucro no."],[32,"s",[1],"Testes de linhas de tendência, linhas de canal, máximas e mínimas anteriores; vendedores esperam reversão quando o teste perde momentum."],[3,"s",[],"Um teste é retorno a suporte ou resistência: linha, alvo projetado, máxima ou mínima de swing, barra de entrada ou sinal, extremos do dia anterior."],[1,"c",[],"Always in compra ou venda; operar apenas na direção dele; transição de unilateral para bilateral."],[2,"s",[],"Canal criado após correção de rompimento, com linha de tendência e linha de canal retraçadas; o canal se amplia com o tempo."]],"secs":[],"tr":["Em canal após impulso, vendedores escalam acima de barras anteriores esperando o teste do fundo do canal e cobrem tudo ali; compradores entram de novo no mesmo ponto.","A terceira puxada para baixo (cunha) na mínima da barra 2 foi o ponto de compra de reversão; compras em fundo de lateralidade combinam com cunha e teste de mínima anterior."],"q":"ruidoso","parts":[]},{"id":"l1c4","k":"livro","bk":1,"cap":4,"part":false,"t":"Básico de Barras: Barras de Sinal, Barras de Entrada, Setups e Padrões de Candle","pg":95,"o":27,"why":"","res":"Define setup, barra de sinal, barra de entrada e barra de continuidade, lista os principais sinais de continuidade e reversão, e explica quando a barra de sinal precisa ser forte: mais a favor da tendência, menos importa; contra a tendência, mais importa.","L":[[7,"c",[2,3],"Em tendência forte as melhores barras de sinal parecem ruins; na correção, entre a favor com ordem stop além do extremo da barra anterior, mesmo com sinal fraco."],[18,"s",[3],"Barra forte de tendência na fase de impulso é sinal de continuidade: entrar a mercado no fechamento ou com stop um tick além da barra."],[10,"e",[2,3],"Figura 4.1: rompimento e correção de barra interna equivalente ao padrão ii, e setup ii de segunda perna."],[32,"s",[1,2],"Contra a tendência, exija quebra da linha de tendência e forte barra de reversão no teste do extremo; no exemplo da Visa a entrada precisou da barra 3."],[29,"s",[1],"Toda reversão envolve clímax; clímax termina na primeira barra de pausa, repetindo a definição do capítulo 2."],[9,"s",[2,3],"Reversões de segunda entrada nas bordas de lateralidade têm barras de sinal com corpo no sentido da reversão; setups contra a tendência só valem se tudo parecer perfeito."],[24,"w",[6],"Nem toda ordem stop executada merece operação; barra grande com muita sobreposição em bandeira é armadilha para quem entra ansioso a favor."],[0,"c",[],"Setup, sinal, entrada, continuidade; barra de tendência x doji; nomes de candle japoneses acrescentam pouco, o que importa é o movimento do preço."],[1,"s",[],"Iniciante opera só a favor da tendência com barra de sinal forte na direção; reversões exigem barras de sinal mais fortes que correções."]],"secs":[],"tr":["Barra de sinal forte de tendência na fase de impulso: comprar a mercado no fechamento da barra ou com ordem stop um tick acima da máxima.","Em ações, colocar a ordem stop de entrada cerca de dois ticks além da barra de sinal para evitar armadilhas de um tick."],"q":"ruidoso","parts":[]},{"id":"l1c5","k":"livro","bk":1,"cap":5,"part":false,"t":"Barras de Sinal: Barras de Reversão","pg":103,"o":73,"why":"","res":"Detalha a barra de reversão como sinal: características das melhores, quando sobreposição a invalida, quando é parte de lateralidade e exemplos de falhas e de sinais não convencionais. Insiste em testar o extremo e em contexto antes de reverter.","L":[[29,"c",[1,2,3,4],"Barra de reversão é uma reversão de duas barras em tempo menor; exigir quebra de linha de tendência e teste do extremo; risco é a."],[32,"s",[1,2],"Reversão contra tendência forte só após quebra de linha de tendência e forte barra de reversão no teste do extremo; barra reversa o rompimento de."],[26,"s",[1,2],"O mercado que tenta algo duas vezes e falha tenta o oposto; por isso topos e fundos duplos funcionam e o teste do extremo importa."],[22,"s",[1,3],"Em bandeira de baixa vender perto da máxima e comprar perto da mínima só se o setup for forte; compre baixo, venda alto vale também."],[24,"w",[6],"Barra de reversão que sobrepõe amplamente várias barras ou tem ponto médio acima da mínima anterior é lateralidade; nada a reverter, não operar; grande doji."],[7,"w",[3,6],"Se barra forte inverteu o always in para baixo, compras em H1/H2 tendem a falhar e vendedores colocam ordens limitadas acima dos sinais."],[8,"s",[3],"Ordens limitadas de venda acima das barras de sinal H1 e H2, esperando que falhem, após reversão forte de baixa; tema aprofundado no livro 2."],[23,"e",[2,6],"Barra 2 reverteu o rompimento da barra 1 e a linha de tendência; compradores emboscados abasteceram a venda; barra 2 da Figura 5.2 também falhou."],[12,"e",[2,6],"O primeiro rompimento acima de canal estreito de baixa normalmente reverte em uma ou duas barras ou forma mínima mais baixa ou alta e retoma."],[16,"e",[3],"Setup de venda na barra de gap da média móvel encerrou a tendência de alta na Figura 5.1."],[10,"e",[2,3],"A barra foi um sinal razoável de rompimento e correção, pois duas tentativas de ir contra o rompimento falharam e o preço testou o ponto de rompimento da abertura."],[33,"s",[1],"A maioria das barras de reversão em gráficos diários vem de dias de lateralidade em tendência ou reversões climáticas intradiárias."],[17,"e",[1],"Dia de tendência desde a abertura com rompimento de máxima ou mínima de ontem que falhou, nas Figuras 5.1 e 5.2."],[0,"c",[],"Barra forte de reversão reverte fechamentos e extremos de várias barras; abertura, sombra de um terço a metade, sobreposição, barra seguinte forte e não interna."],[1,"s",[],"O contexto decide: quanto mais contra a tendência, mais importante a barra de sinal; pressão acumulada nos corpos pode avisar a reversão."]],"secs":[],"tr":["Após barra enorme que inverte o always in para baixo, não comprar H1/H2: compradores presos e vendedores colocam limites de venda acima das barras de sinal.","Comprar perto do fundo de lateralidade só com setup forte: barra de reversão com sombra, pouca sobreposição e teste do extremo anterior.","Risco de reversão é a barra de sinal (ex.: 10 ticks) e o alvo planejado é 20 ticks ou mais, razão de ao menos 2 para 1.","Com doji após a barra de sinal, tente sair no empate ou 1 tick de perda; subir o stop logo abaixo do doji tem chance de 50 por cento de ser atingido."],"q":"ruidoso","parts":[]},{"id":"l1c6","k":"livro","bk":1,"cap":6,"part":false,"t":"Barras de Sinal: Outros Tipos","pg":117,"o":91,"why":"","res":"Catálogo de barras de sinal além da reversão simples: duas e três barras, barras pequenas, internas, ii, ioi, micro topos e fundos duplos, carecas e de exaustão, sempre julgadas pelo contexto. As figuras mostram quando sinais fracos servem a favor da tendência e quando contra ela exigem razões extras.","L":[[7,"c",[1,2,3,6],"Em tendência forte as barras de sinal da correção parecem fracas e até dojis servem; contra a tendência o sinal precisa ser forte."],[29,"c",[1,2,3,5,6],"Barra excepcional após 10 ou mais barras é exaustão; segundo clímax leva a correção de duas pernas de cerca de 10 barras."],[30,"c",[1,2,3,6],"Padrão ii ou lateralidade estreita após movimento longo vira bandeira final; rompimento a favor rende só scalp, o contrário gera reversão grande."],[26,"s",[2,3],"Micro topo e fundo duplo: em impulso são bandeira de uma barra a favor; fora de impulso são reversão. Quase toda reversão pequena começa assim."],[23,"s",[2,3,6],"Barras grandes de rompimento falham logo na barra seguinte; falha de barra de reversão emboscou quem entrou antes; lateralidade estreita puxa de volta."],[19,"s",[2,3,4],"Barra interna após rompimento ou ioi é modo rompimento: stops acima e abaixo, a não executada vira stop; barra interna grande não serve."],[24,"w",[1,6],"Lateralidade estreita é magneto: rompimentos falham e voltam; muitas barras carecas e doji pequeno perto da média às 10-11h pacífico não operar."],[27,"s",[2,3,5],"Cunhas e terceira puxada em canal de impulso marcam o fim do movimento; primeiro alvo da reversão é testar o início da cunha."],[14,"e",[2,5],"Impulso forte é seguido de canal que termina em três puxadas; correção costuma testar o início do canal."],[21,"s",[5],"O impulso projeta o alvo da abertura ao fechamento da última barra, ou da altura da lateralidade; a reversão costuma se formar ali, mas sozinho o alvo não basta."],[16,"e",[1,2],"Barra de gap da média e setup de 20 barras de gap aparecem como setups e como indício de última perna antes de correção maior."],[9,"s",[3,6],"Contra um movimento forte, a primeira tentativa de reversão é arriscada; esperar a segunda entrada, e lembrar que L2 ou H2 pode falhar e emboscar."],[10,"e",[3],"Falha de rompimento que falha vira setup de rompimento e correção; falhas opostas consecutivas emboscam os dois lados e dão operação confiável."],[32,"e",[1,2],"Ultrapassagem de linha de canal seguida de reversão, ou quebra de linha de tendência, somam razões para operar reversão contra a tendência."],[34,"e",[1,2],"Reversões e iis na primeira hora; na dúvida na abertura ficar de fora. Movimentos contra a tendência entre 11h e meio-dia pacífico são comuns."],[38,"s",[3],"Barra forte em impulso: entre a mercado no fechamento, com limite no fechamento ou com ordem stop 1 tick além do extremo."],[39,"s",[4],"Stop fica além do extremo oposto da barra ou das duas barras do padrão; barras grandes exigem reduzir lote para manter o mesmo risco."],[43,"s",[6],"Quem entra antes do sinal ou entra em barra fraca fica emboscado; os stops forçados dão combustível ao movimento oposto."],[0,"c",[],"Corpo, sombras e fechamento da barra de sinal e de entrada; tamanho relativo, barra careca, interna e doji; sinal só vale com contexto."],[1,"s",[],"A mesma barra serve a favor em tendência forte e só nos extremos em lateralidade; meio do dia e perto da média são zonas fracas."],[4,"s",[],"Segunda entrada, H2/L2, três puxadas e segundo clímax usados para qualificar sinais."],[2,"s",[],"Linhas de tendência e de canal rompidas ou ultrapassadas fortalecem reversões."]],"secs":[["Barra forte de tendência como sinal; entrada a mercado",[18,38]],["Por que reversões exigem força e correções aceitam sinais fracos",[7,43]],["Reversão de duas barras (variações, sobreposição, média móvel)",[29,7]],["Reversão de três barras e barra de 15 minutos",[29]],["Barras pequenas: interna, ii, iii, ioi, doji",[19,30,24]],["Micro topo e fundo duplo, falha de reversão, careca, exaustão",[26,23,29]],["Barras de tendência como sinal; ordens em canais fortes",[8,12]],["Barra interna após rompimento: modo rompimento e ii como bandeira final",[19,30]],["Barras carecas, dojis às 10-11h e exaustão (resumo teórico)",[24,29]],["Fig 6.1 Barras pequenas de sinal em tendência de baixa; impulso e canal",[7,14,27]],["Fig 6.2 Barra de reversão como continuação; Fig 6.3 barra grande como exaustão",[23,29,9]],["Figs 6.4 a 6.5 Reversões de três barras e de 15 minutos",[29,34]],["Fig 6.6 Reversão de duas barras com entrada além de ambas",[29]],["Fig 6.7 Reversão na primeira hora: ii e correção após fundo duplo",[34,10,26]],["Figs 6.8 a 6.9 Barras minúsculas e ii como reversão em tempo menor",[30,9]],["Fig 6.10 Topos e fundos duplos de duas barras",[26,23]],["Figs 6.11 a 6.12 Reversão forte após clímax; lateralidade estreita como magneto",[29,24,14]],["Figs 6.13 e 6.19 Ausência de sombras: força em tendência, armadilha em lateralidade",[24,21,16]],["Fig 6.14 Exemplos de barras de sinal ao longo do dia (cunhas, clímax, gap da média)",[27,29,16,21]],["Fig 6.15 Bandeira de baixa de uma barra; alvos de movimento projetado e arame farpado",[30,21,26]],["Fig 6.16 Bons setups são comuns: falha de L2, L4, cunhas",[27,9,7]],["Figs 6.17 a 6.18 Reversão de baixa que vira bandeira de alta; sinais fracos precisam de razões",[29,30,23]]],"tr":["Barra forte de tendência em rompimento é entrada a mercado no fechamento ou limit no fechamento, ou stop acima da máxima, pois a urgência continua.","Em tendência forte as barras de sinal de correção parecem fracas e mesmo assim servem para entrar a favor; setup perfeito sugere tendência fraca.","Contra movimento forte, esperar a segunda tentativa de reversão; a primeira costuma emboscar quem entra com limit."],"q":"ruidoso","parts":[]},{"id":"l1c7","k":"livro","bk":1,"cap":7,"part":false,"t":"Barras Externas","pg":179,"o":32,"why":"","res":"Barra externa é lateralidade de uma barra e raramente deve ser operada no rompimento; ela pode servir de barra de entrada quando a barra anterior foi bom sinal, ou como forte barra de tendência na primeira perna de uma reversão. Explica ioi, oo e a armadilha criada por barras externas.","L":[[19,"c",[2,3,4,6],"Rompimento de barra externa de 5 minutos quase sempre é insensato; ioi só com espaço para o alvo; ioi em arame farpado, esperar."],[29,"s",[2,3,5],"Na reversão após tendência forte, a barra externa a favor da reversão é uma forte barra de tendência; seu extremo inicia a perna, com duas pernas."],[23,"s",[3,6],"Se o mercado rompe o outro lado da barra externa, deixar ir e apostar na falha; falha que falha vira rompimento e correção."],[24,"w",[1,6],"Barra externa no meio de lateralidade ou em arame farpado é insignificante; a maioria dos rompimentos de arame farpado falha por efeito magnético."],[9,"s",[3],"Barra externa como segunda entrada de reversão após quebra de linha de tendência ou ultrapassagem de canal pode ser excelente barra de entrada."],[27,"e",[3],"Barra externa de alta que reverte a terceira puxada de baixa mostra compradores ganhando força."],[7,"e",[2,6],"H2 sem força anterior (perna H1 que quebra linha ou barra forte) é péssimo setup; falha de H2 vira armadilha com barra externa de baixa."],[38,"s",[3],"Stop de compra um tick acima da barra de sinal, mantido mesmo se a barra seguinte fizer mínima menor; a entrada ocorre na barra externa."],[39,"s",[4],"Barra externa grande gera stop distante: usar stop financeiro (por exemplo dois pontos no Emini) ou menos contratos."],[43,"s",[6],"Reversão sobre barra fraca emboscando vendedores e deixando compradores de fora gera movimento forte; instituições criam a armadilha antes de comprar."],[0,"c",[],"Definição de barra externa, fechamento relativo à amplitude, oo, ioi, e como a barra anterior qualifica a barra de entrada."],[1,"s",[],"Mesma barra externa vale como lateralidade, reversão ou tendência dependendo do contexto; primeira barra do dia indica o perfil do dia."],[22,"s",[2,3],"Barra externa em range seguida de pequena barra perto da extremidade: operar o fade na direção oposta."]],"secs":[],"tr":["Barra externa de 5 minutos grande tem stop distante; reduzir lotes ou usar stop financeiro em vez de entrar no rompimento da barra.","Na dúvida diante de barra externa, esperar mais movimento de preço; só entrar nela se a barra anterior foi bom sinal."],"q":"ruidoso","parts":[]},{"id":"l1c8","k":"livro","bk":1,"cap":8,"part":false,"t":"A Importância do Fechamento da Barra","pg":193,"o":108,"why":"O fechamento da barra é o dado que define a entrada em rompimentos e em barras de sinal.","res":"Entrar antes do fechamento da barra gera perdas maiores que os ganhos de um tick; o fechamento revela a força real, e esperar evita ser preso em reversões e chacoalhado fora de boas operações. Tempos gráficos menores dão stops curtos, mas mais perda de boas operações.","L":[[0,"c",[],"O fechamento da barra de sinal e de entrada e das duas seguintes mostra força ou fraqueza; barras de reversão enganam nos segundos finais."],[32,"s",[2,3,4,6],"Esperar o fechamento da barra de sinal e entrar em stop além dela; entrada antecipada ganha ~1 tick e perde ~8 de vez em quando."]],"secs":[],"tr":["Entradas antecipadas ganham cerca de um tick e perdem cerca de oito quando falham; esperar o fechamento e entrar com stop além da barra é melhor.","Mover o stop para um tick abaixo da barra de entrada antes do fechamento causa saída em boa operação; manter o stop inicial até fechar a barra de entrada.","Fechamentos fortes nas barras seguintes justificam manter mais contratos para swing; fechamentos fracos sugerem scalp. Num dia de Emini com média de 10 a 15 pontos, stop de dois a três pontos."],"q":"ruidoso","parts":[]},{"id":"l1c10","k":"livro","bk":1,"cap":10,"part":false,"t":"Segundas Entradas","pg":203,"o":64,"why":"É a base do H2 e do L2.","res":"Segunda entrada tem mais chance de lucro que a primeira, sobretudo contra um movimento forte: esperar a segunda tentativa de reversão. Se a segunda entrada dá preço melhor que a primeira, desconfiar de armadilha (preço bom, trade ruim).","L":[[9,"c",[1,2,3,6],"Após quatro barras de tendência ou impulso, não operar a primeira reversão; esperar a segunda. Segunda entrada em preço melhor é suspeita."],[7,"s",[3,6],"H2 após quatro barras de tendência de baixa não deve ser comprada; L1 com muita força compradora também não deve ser vendida."],[8,"s",[3],"Com momentum de alta muito forte, tentar comprar em mínima mais alta ou com limit abaixo da barra anterior em vez de vender a L1."],[29,"e",[1,5],"Três clímaxes de venda seguidos em canal estreito levam a rali de duas pernas; barra grande após 5-10 de alta é clímax de compra."],[26,"e",[2],"A maioria dos topos nasce de um micro topo duplo e dos fundos de um micro fundo duplo."],[30,"e",[2],"ii no final do canal de baixa, possivelmente bandeira final, antes de rali."],[23,"e",[2],"Rompimento da mínima do dia anterior falha e reverte; rompimento da máxima na abertura falha na média móvel e dá venda."],[43,"s",[6],"Quem opera a primeira reversão contra momentum forte é emboscado; esperar a segunda evita a perda."],[4,"s",[],"Primeira e segunda entrada, H1/H2/L1/L2/L4 e contagem de barras consecutivas de tendência para medir o momentum."]],"secs":[],"tr":["Contra tendência forte, esperar evidência de que o outro lado moveu o preço mais que poucos ticks antes de operar; limit abaixo da barra anterior só com muito momentum a favor.","Com mais de quatro barras de tendência, não vender o primeiro setup de reversão; esperar a segunda tentativa."],"q":"ok","parts":[]},{"id":"l1c11","k":"livro","bk":1,"cap":11,"part":false,"t":"Entradas Tardias e Perdidas","pg":207,"o":69,"why":"","res":"Se uma tendência já está claramente em curso e você perdeu a entrada, entre a mercado com apenas o número de contratos que ainda teria na parte swing, usando o mesmo stop móvel. Quatro ou mais barras de tendência consecutivas não climáticas justificam entrar sem esperar correção.","L":[[11,"c",[1,3,4,5],"Entrar a mercado só com o lote da parte swing e o stop original; quatro barras de tendência seguidas justificam entrar sem correção."],[17,"e",[1],"Reversão de duas barras com barra interna na abertura inicia tendência desde a abertura; os participantes do lado vencedor são excepcionalmente fortes em canal estreito."],[16,"e",[1,2],"Barra de gap da média após forte queda rompe a linha de tendência e testa a máxima; funcionou como setup de 20 barras de gap."],[41,"s",[3,5],"Procure pausas ou correções para adicionar contratos e depois mova o stop de toda a posição para 1 tick além da barra de sinal, no lado do stop."],[39,"s",[4],"Stop maior que o de scalp exige posição menor para manter o risco financeiro; stop no zero a zero ou perto do extremo original."],[43,"s",[1,6],"Lucro em aberto não é dinheiro de outros; ficar de fora por hesitação emocional equivale a não acreditar que seguraria o swing."],[1,"s",[],"Mercado em modo sempre posicionado, com probabilidade alta de lucro a favor; participe da tendência mesmo sem ter entrado na origem."]],"secs":[],"tr":["Quatro ou mais barras de tendência seguidas, sem serem enormes, justificam comprar ou vender a mercado só a parte swing do lote, com o mesmo stop da entrada original.","Entrada tardia usa stop maior que scalp e portanto menos contratos, para o risco financeiro permanecer o mesmo."],"q":"ruidoso","parts":[]},{"id":"l1c12","k":"livro","bk":1,"cap":12,"part":false,"t":"Evolução de Padrões","pg":211,"o":33,"why":"","res":"Padrões frequentemente falham ou se transformam em padrões maiores (cunha, rompimento e correção, bandeira final, triângulo expandido), e a leitura deve seguir o que está à frente, não o rótulo. Falha vira combustível na direção oposta; na primeira hora topo duplo e fundo duplo se alternam.","L":[[10,"c",[2,3,6],"Bandeira final que falha vira rompimento e correção, depois cunha ou lateralidade maior; rompimento de linha de micro tendência normalmente falha e gera correção."],[27,"e",[2,3],"L2 que falha evolui e amplia-se para topo em forma de cunha; H2 evolui para bandeira de alta em cunha na média."],[7,"e",[3,6],"L2, H2, L1 podem falhar; H2 com impulso forte em contra provavelmente falha; falha da H2 vira segunda tentativa de reversão."],[23,"s",[2,3,6],"Falha em permitir scalp prende traders no lado errado e fornece combustível ao lucro de pelo menos um scalp na direção oposta."],[14,"e",[2,5],"Impulso e canal que termina em terceira puxada; no dia pode evoluir para lateralidade e depois bandeira de alta em fundo duplo."],[15,"e",[2,3,5],"Na primeira hora topo duplo vira fundo duplo; fazer ambas as entradas e manter parte para swing, pois o grande movimento vem de uma delas."],[34,"s",[1,2],"Grandes gaps levam a dias de tendência; uma extremidade se forma na primeira hora e o mercado se afasta dela; modo rompimento no início."],[35,"e",[1],"Gap grande que rompe a linha de canal do dia anterior e reverte na primeira barra."],[25,"s",[2],"Triângulo expandido pode expandir de cinco para sete pernas."],[30,"s",[2,6],"Bandeira final que falha em reverter se transforma em entrada de rompimento e correção no sentido do rompimento."],[1,"s",[],"Dois leitores podem ver o mesmo dia como impulso e canal diferentes; importa que impulsos de alta foram mais fortes que os de baixa."],[4,"s",[],"Contagem de puxadas (H2, L2, terceira puxada) usada para identificar a evolução do padrão."]],"secs":[],"tr":["Padrões confiáveis falham cerca de 40 por cento das vezes; trade na falha com ao menos scalp na direção oposta, e parte para swing em ambas as entradas."],"q":"ruidoso","parts":[]},{"id":"l1c13","k":"livro","bk":1,"cap":13,"part":false,"t":"Linhas de Tendência","pg":221,"o":29,"why":"","res":"Ensina a traçar linhas de tendência e usá-las para entrar a favor da tendência nas correções e, depois do rompimento, para apostar na direção oposta. Reforça que a maioria dos rompimentos falha.","L":[[32,"w",[6],"Iniciantes só olham a recompensa e ignoram risco e probabilidade; vender em queda forte perto da linha de alta geralmente perde. Traders testam a linha."],[23,"s",[1,2,3,6],"Rompimentos de linha de tendência frequentemente falham e armam entrada a favor da tendência."],[7,"s",[1,3],"Em tendência estabelecida, as operações mais lucrativas são na direção da linha de tendência: quando a correção chega perto dela."],[8,"s",[3],"Traders experientes deixam ordens limitadas logo abaixo e na linha de tendência de alta durante quedas fortes; iniciantes vendem ali contra a tendência."],[27,"s",[2,3],"Venda na barra 6 foi segunda tentativa de reverter acima da linha, bandeira de baixa em cunha e falha de ultrapassagem da linha de canal."],[26,"e",[2],"Linha de canal sobre a linha do pescoço arrastada ao ombro esquerdo estima onde se forma o ombro direito; barra recente decide a entrada."],[10,"e",[2,3],"Gap de abertura e grande barra de tendência contam como rompimento; movimento lateral rompe a linha íngreme e a barra de sinal permite apostar contra."],[2,"c",[],"Como desenhar linhas de tendência, usar paralelas, apagar a linha após testar para evitar distração, e testes repetidos (Fig 13.7)."],[1,"s",[],"Rompimento de linha indica negociação bilateral maior; probabilidade de direção sobe de 50% para ~60% em tendência forte."],[3,"s",[],"Linhas rompidas funcionam como magneto, mesmo no gráfico mensal do Dow (Fig 13.2)."],[47,"s",[2,3],"Linha testada muitas vezes em poucas barras: espere o desfecho, rompimento contra ou aceleração a favor, e opere o sinal confirmado."]],"secs":[],"tr":["Traders experientes compram com ordem limitada logo abaixo e na linha de tendência de alta após queda forte, enquanto iniciantes vendem ali; a maioria das quedas fortes só testa a linha."],"q":"ok","parts":[]},{"id":"l1c14","k":"livro","bk":1,"cap":14,"part":false,"t":"Linhas de Canal","pg":235,"o":34,"why":"","res":"Mostra como traçar linhas de canal (paralela da linha de tendência ou independente) e operar a reversão após ultrapassagem da linha, especialmente a segunda ultrapassagem. Explica a relação com cunhas e a psicologia do clímax.","L":[[27,"c",[1,2,3,6],"Maioria das cunhas arma reversão após falha de ultrapassagem da linha de canal; a segunda puxada define cunha versus canal paralelo."],[23,"e",[3,4],"Entrada na falha de rompimento após barra de reversão forte; barra pequena na ultrapassagem dá boa relação risco/retorno; escadas de barras diminuindo apoiam a entrada."],[29,"e",[2,3,5],"Barra extraordinariamente grande após movimento longo é clímax, seguido de correção de duas pernas com ao menos cerca de 10 barras."],[32,"s",[3,4],"Contra-tendência só após forte quebra de linha de tendência e correção, ou reversão após ultrapassagem da linha de canal."],[13,"s",[1,2],"Um canal inclinado em um sentido é lido como bandeira no sentido oposto; as paralelas devem conter as barras do trecho."],[12,"w",[6],"Se você redesenha linhas de canal repetidamente, está contra o movimento principal; tendência forte acelera em linhas mais inclinadas, não reverte."],[44,"s",[6],"Preferir ordens baseadas na ação de preço mais recente a linhas feitas com 30 ou mais barras."],[2,"c",[],"Duas formas de traçar a linha de canal; âncora ideal em ponto entre as barras da linha de tendência."],[1,"s",[],"Gap grande é rompimento; dia de lateralidades dentro de tendência e clímax no gráfico 14.3."]],"secs":[],"tr":[],"q":"ok","parts":[]},{"id":"l1c15","k":"livro","bk":1,"cap":15,"part":false,"t":"Canais","pg":247,"o":7,"why":"","res":"Capítulo central sobre canais: tipos (tendência, lateralidade inclinada, triângulos, cunhas), efeito vácuo, como operar canais (iniciante só a favor), canais como bandeiras e falhas de rompimento com clímax. Inclui movimento projetado pela altura do canal e muitos exemplos.","L":[[13,"s",[1,2,3,4,5,6],"Canal amplo com swings largos é lateralidade inclinada e opera-se nos dois lados; estreito e inclinado, só a favor. Maioria tem ao menos três pernas."],[12,"c",[1,2,3,6],"Primeiro rompimento de canal estreito e longo tende a falhar; esperar correção após rompimento. Em canal forte, sinais contrários parecem ruins porque são só bandeiras."],[23,"c",[2,3,5,6],"Rompimento além de um canal em tendência quase sempre falha e vira clímax; o preço volta ao canal."],[21,"c",[5],"Após rompimento bem-sucedido de canal, primeiro alvo é movimento projetado igual à altura do canal; alvos coincidentes aumentam a chance de reversão."],[8,"c",[3,4],"Em canal de alta, comprar com limit 1 a 3 ticks abaixo da mínima de barras anteriores, stop abaixo do fundo recente."],[7,"s",[3],"Para iniciantes, a entrada a favor mais confiável em canal é H2/L2 com barra de sinal na média móvel, longe da extremidade do canal."],[27,"s",[2,5],"Canais terminam em geral após três puxadas; cunha com rompimento e falha leva a movimento projetado do tamanho da cunha (gap de projeção)."],[14,"s",[1,2,5],"Canais estreitos funcionam como impulso seguido de canal; o impulso medido da abertura da primeira barra ao extremo da última projeta o alvo."],[22,"s",[1,3],"Canal em lateralidade: comprar na metade inferior e realizar no topo; vendedores fortes escalam venda na subida do canal, nos dois primeiros terços do dia."],[29,"s",[2,5],"Rompimento climático do canal leva a correção de duas pernas com cerca de 10 barras, normalmente rompendo o lado oposto do canal."],[15,"s",[1],"Canal de alta é indistinguível de bandeira de baixa; em tendência de baixa vender o topo do canal ou a correção do rompimento."],[25,"s",[1],"Triângulos, cunhas e correções ABC são canais; triângulo expandido tem linhas divergentes de canal; rompimento iminente mas direção incerta."],[10,"s",[3],"Barra de reversão fraca contra rompimento forte configura rompimento e correção em uma ou duas barras; forte versus fraca decide falha ou retomada."],[26,"e",[2],"Ombro-cabeça-ombro no gráfico semanal do SPY acabou virando uma grande bandeira a favor da tendência em vez de reversão."],[16,"e",[2],"A segunda entrada a favor, na barra de gap da média móvel em tendência, costuma levar à bandeira final antes de uma reversão maior."],[17,"e",[1,3],"Em dia forte de tendência de alta com gap, comprar pequenas correções na mínima de barras anteriores."],[41,"s",[3,5],"Escalar com limit abaixo, saída de toda posição no preço da primeira entrada para empate mais lucro das adicionais; vender escalado acima do topo."],[38,"s",[3],"Entrada a limit ou a mercado funciona em qualquer canal, triângulo ou lateralidade; ordem limit exatamente na média móvel pode não executar."],[44,"w",[6],"Iniciantes devem operar só a favor em canal e esperar os melhores setups, mesmo perdendo a tendência; não aposte em reversão por regressão à média."],[2,"s",[],"Canal é par de linhas; no início desenhar o que melhor se ajusta; canais aninhados e linhas tradicionais superam linhas curvas."],[1,"s",[],"Canal é lateralidade inclinada; tendência em canal pode virar bilateral; micro canais, impulso e canal, e força do canal definem o plano."],[3,"s",[],"Magnetos como alvos de movimento projetado e linhas de tendência em tempos maiores atraem o preço até o fim do canal."],[4,"s",[],"Canais têm no mínimo três puxadas; correção de duas pernas após rompimento climático."]],"secs":[["Definição: canais de tendência, lateralidades e triângulos",[13,25,27]],["Canal em lateralidade ou tendência: onde comprar e vender",[13,22,15]],["Formação do canal em três puxadas e efeito vácuo",[13,27]],["Comportamento institucional no topo e fundo do canal",[23,13]],["Como operar canal: iniciante só a favor, H2 na média",[7,8,13]],["Escalar entrada e saída, clímax institucional",[29,41]],["Canal como bandeira; rompimentos falham e viram clímax",[23,15,29]],["Força do canal e primeiro rompimento de canal estreito",[12,14]],["Movimento projetado pela altura do canal e três resultados do rompimento",[21,10,23]],["Figs 15.1-15.2: canais aninhados e falhas de rompimento",[12,23,21]],["Figs 15.3-15.5: canais de alta em tipos de mercado, projeção e clímax",[15,21,29,14]],["Fig 15.6: reversões em linhas e vácuo no canal de baixa",[32,13]],["Figs 15.7-15.8: compras limit em canais, scalps e escala",[8,41,38]]],"tr":["Em canal de alta, compram-se correções com ordem limitada poucos ticks abaixo da mínima de barras anteriores, stop abaixo do fundo recente, esperando falha de sinais de venda L1/L2.","Em canais largos ou lateralidades, comprar na metade inferior com limit e escalar abaixo; sair com tudo no preço da primeira entrada dá empate mais lucro nas adicionais.","Scalps de venda com limit acima da máxima da barra anterior saíam cerca de um ponto abaixo, cinco ticks, mostrando alvo curto no canal."],"q":"ok","parts":[]},{"id":"l1c16","k":"livro","bk":1,"cap":16,"part":false,"t":"Micro Canais","pg":279,"o":9,"why":"","res":"Explica micro linhas de tendência e micro canais (canais sem ou com mínimas correções), sua leitura como impulso, e as entradas a favor da tendência em falhas de rompimento (H1/L1) e em rompimento e correção. Adverte contra operar o gráfico de 1 minuto.","L":[[12,"c",[1,2,3,4,6],"Quanto mais barras fortes e menos sombras, mais provável que o primeiro rompimento falhe; entre contra na primeira correção ou no fechamento das barras."],[23,"c",[2,3,6],"Falhas de rompimento de micro linhas de tendência a favor da tendência dão scalps; segunda falha após primeira falha tende a ser a boa entrada."],[7,"c",[3,4],"Rompimento abaixo de micro canal de alta em tendência de alta vira H1 de compra um tick acima da máxima da barra de rompimento."],[10,"c",[2,3],"Se a venda de micro linha falha, compre o rompimento e correção na direção da tendência, onde vendedores emboscados cobrem; falhas opostas criam segunda entrada."],[8,"s",[3],"Traders avançados compram todos os fechamentos de barras de alta e limit um ou dois ticks abaixo do fechamento ou acima da mínima da barra."],[29,"s",[2,5],"Micro linha de tendência que passa de 10 barras é insustentável e aumenta bastante a chance de reversão operável; preparar rompimento e correção."],[14,"s",[1],"Micro canal geralmente é impulso em tempo maior e é seguido por canal mais largo; alvo por movimento projetado da altura do canal estreito."],[32,"s",[2,3],"Micro linhas servem só para achar entradas a favor da tendência; só depois de reversão confirmada (linha de alta rompida, máxima mais alta) buscar vendas."],[25,"e",[2,3],"Pequeno triângulo em tendência de baixa com barra 9 como terceira puxada acima: venda confiável; triângulo contra canal estreito de baixa não deve ser comprado."],[30,"e",[2],"Rompimento e correção com extremo de swing pior que o anterior forma uma pequena bandeira final de uma barra."],[17,"e",[1,3],"Gap com falha de rompimento na primeira barra, revertendo em barra externa, virou dia de tendência desde a abertura no sentido da reversão."],[28,"s",[2],"A falha de um micro canal pode ser uma micro reversão majoritária: linha rompida e teste com extremo além do anterior."],[37,"s",[1],"Setups de baixa probabilidade (40%) podem ter equação positiva se o retorno for várias vezes o risco; quem prefere alta probabilidade espera outros setups."],[42,"w",[6],"Gráfico de 1 minuto raramente vale a pena: os melhores setups surgem e saem rápido, os perdedores dão tempo."],[39,"e",[4],"Em dia muito volátil (barras de 6 a 8 pontos), reduzir a posição à metade ou menos."],[2,"s",[],"Micro linha de tendência com 2 a 10 barras; micro linha e linha de canal no gráfico de 5 minutos são correções em 1 minuto."],[1,"s",[],"O contexto (tendência, lateralidade, na média móvel) define se o rompimento do micro canal é comprado ou vendido."],[4,"s",[],"H1/L1 como entradas de falha; segunda falha forma setup de segunda entrada."]],"secs":[],"tr":["Em micro canal de alta numa tendência de alta, experientes compram o fechamento de barras de alta e usam limit um ou dois ticks abaixo do fechamento ou acima da mínima da barra anterior.","Em dia de volatilidade extrema, reduzir tamanho, ampliar stop para 4 pontos e mirar 2 pontos mostra alvo menor que o risco, mas posição pequena."],"q":"ruidoso","parts":[]},{"id":"l1c17","k":"livro","bk":1,"cap":17,"part":false,"t":"Linhas Horizontais: Pontos de Swing e outros Níveis","pg":301,"o":31,"why":"","res":"Capítulo curto: em dias de lateralidade, máximas e mínimas de swing seguram rompimentos que falham e viram reversões, e a segunda máxima mais alta ou mínima mais baixa é a melhor. Em dias de tendência, linhas horizontais servem só para entrar em correções.","L":[[23,"w",[6],"Em dias de tendência forte, só apostar contra extremos após boa quebra de linha de tendência e reversão forte, e como scalp."],[22,"c",[1,3,5],"Extremo do dia lateral com segunda máxima mais alta ou mínima mais baixa permite scalp; a parte média do dia atua como magneto."],[10,"s",[3],"Em dia de tendência, o teste da região de rompimento com reversão a favor é um bom setup de rompimento e correção."],[27,"e",[2],"Três puxadas (barra 5) comportam-se como cunha mesmo sem a forma de cunha; o segundo extremo além do anterior fica além da barra 2."],[25,"e",[2],"Triângulo expandido com barras 9 e 11 como fundo e topo; triângulo expandido menor com barra 10 como segunda puxada."],[26,"e",[2],"Barra 9 foi fundo duplo com a mínima do dia anterior e segunda tentativa de reverter acima da mínima da abertura."],[15,"e",[2],"Bandeira de alta em forma de fundo duplo costuma ser só uma mínima mais alta."],[16,"e",[1],"Barras 5 e 13 foram setups de 20 gap bars na média após 11:30, quando retrações contra a tendência prendem traders e geram entradas confiáveis."],[3,"c",[],"Linhas horizontais em pontos de swing são barreiras que resultam em falhas e reversões em lateralidades, e níveis de entrada de correção em tendência."],[1,"s",[],"Distinguir dia lateral de tendência define se as linhas horizontais são para reverter ou para entrar na correção."],[6,"s",[],"Perto das 11:30, retrações contra a tendência chacoalham traders e oferecem entradas a favor."],[9,"s",[2,3,5],"Fade da segunda máxima mais alta ou segunda mínima mais baixa, pois segundos sinais são melhores em lateralidade"],[45,"s",[2,3,4],"Comprar a primeira correção após pico forte, acima da barra com mínima menor (high 1), com instituições adicionando"],[50,"s",[2,4,5],"Em novo extremo observe: forte continuidade é compra, lateral é realização, reversão é domínio dos vendedores"],[29,"s",[2,3],"Vender fechamento e acima da máxima de enorme barra de tendência climática, depois abaixo da mínima de barras seguintes"]],"secs":[],"tr":[],"q":"ok","parts":[]},{"id":"l1c18","k":"livro","bk":1,"cap":18,"part":false,"t":"Exemplo de Como Operar uma Tendência","pg":323,"o":58,"why":"Exemplo completo, do contexto à saída. Bom para comparar com o raciocínio durante o trade.","res":"Lista as entradas razoáveis a stop e a limit em tendência, discute escalar, stops móveis, risco, saídas parciais, e percorre um dia de tendência em Goldman Sachs com cada barra comentada, incluindo dimensionamento de risco e realização de lucro.","L":[[7,"c",[2,3,4],"Comprar H2 ou H1 após impulso forte (exceto após clímax), L2 na média em tendência de baixa; rompimento de swing em tendência muito forte."],[8,"c",[3,4],"Limit na média móvel após 20 barras sem tocar, no número fixo de ticks de correção (tamanho da maior correção do dia)."],[11,"c",[1,3,4],"Ao reconhecer dia de tendência, comprar ao menos pequena posição a mercado; risco no fundo do impulso, tamanho dividido pelo risco."],[18,"c",[3,4],"Comprar o fechamento de cada barra de tendência de alta no impulso, ou limit na mínima da barra anterior; stop longo exige menos contratos."],[17,"s",[1,2,3],"Gap com barra forte na primeira barra: entre no fechamento da barra 1 ou 1 tick além dele, a favor do gap."],[12,"s",[3],"Falhas de rompimento de micro canal em dia forte são entradas a favor, além do extremo da barra de rompimento."],[15,"e",[2,3],"Fundos duplos (barras 6 e 8; 9 e 11) como bandeira de alta com H2 e pequena reversão de duas barras como sinal."],[27,"e",[2,3],"Bandeira em cunha ou triângulo com entrada além da barra 12 e rompimento e correção seguinte."],[16,"e",[2,3],"A barra 28 tocou a média pela primeira vez no dia (20 gap bars) em correção de duas pernas e H2/L2."],[14,"e",[2,5],"A barra 24 foi a terceira puxada e o terceiro clímax consecutivo em canal que veio de impulso: ponto para realizar lucros e esperar correção."],[29,"s",[5,6],"Barra de tendência excepcionalmente grande em tendência madura é clímax que justifica correção; ideal para realizar lucro parcial ou total."],[10,"e",[3],"Entrada de rompimento e correção além da barra 13 e da barra seguinte à 15; pequena bandeira após rompimento de lateralidade."],[21,"s",[5],"Realizar parte em dobro do risco; linha de canal e movimento projetado como pontos de lucro parcial."],[39,"s",[4],"Stop móvel: sobe para um tick abaixo da mínima mais alta a cada nova máxima."],[40,"s",[5],"Realizar metade em 2x o risco inicial e segurar o resto até reversão clara ou fechamento; retorno ao menos igual ao risco."],[41,"s",[3,5],"Escalar com tamanho planejado para o risco total igual ao normal; escalar saída em quartos (US$1, 2, 3); não aumentar posição em cada sinal novo."],[42,"s",[1,5],"Iniciantes devem operar swing; scalp exige cerca de 70% de acerto com risco igual ao retorno."],[37,"s",[1,4],"Chance multiplicada pelo ganho precisa superar chance de falha vezes risco; com risco de 2 pontos no Emini."],[38,"s",[3],"Ordem stop reduz risco mas é difícil de entrar no impulso; limit exige mais experiência e é contra o movimento imediato."],[43,"s",[6],"Iniciantes vendem topos em tendência, perdem pequenas perdas o dia todo e não compram a correção; cada topo é o início de bandeira."],[44,"s",[6],"Gerenciar com o plano com que se entrou: scalper que vira swing e swing que vira scalp perdem."],[1,"s",[],"Reconhecer dia de tendência cedo; setups contra a tendência parecem melhores que os a favor; o mercado faz de tudo para manter traders fora."],[4,"s",[],"H1, H2 e H3 (ou L1, L2 e L3) em tendência; bandeiras em cunha ou triângulo como setups."],[2,"s",[],"Linha de canal para lucros parciais e linha de tendência quebrada como alerta de correção maior."]],"secs":[["Lista de entradas razoáveis a stop em tendência",[7,10,27]],["Lista de entradas com limit ou a mercado e escalar",[8,18,41]],["Dificuldades: swing versus scalp, risco de 2 pontos, equação do trader",[42,37,39]],["Stop móvel, tolerância de correção e gestão de posição",[39,40]],["Fig 18.1: dia de tendência na GS, barras 1 a 24",[17,7,8,15,14]],["Dimensionamento de risco e saídas parciais no exemplo",[40,39,41]],["Comprar por qualquer razão: impulso, entradas, posição pequena",[11,18]]],"tr":["Em tendência, limit na mínima ou abaixo da barra anterior, no fechamento de barras de impulso, e correções com número de ticks igual a cerca de metade da maior correção do dia.","Comprar com limit, depois de queda para a mínima de swing anterior em tendência forte, esperando falha do rompimento da mínima, com escala mais abaixo.","Comprar o fechamento da primeira barra de baixa de um impulso ou de cada barra de alta, com stop abaixo do início do impulso, exige reduzir posição ao risco normal.","Retorno ao menos igual ao risco; realizar metade em 2x o risco inicial; stop móvel; scalper arrisca 2 pontos para ganhar ~2 pontos; risco proporcional ao tamanho."],"q":"ok","parts":[]},{"id":"l1c19","k":"livro","bk":1,"cap":19,"part":false,"t":"Sinais de Força em uma Tendência","pg":345,"o":53,"why":"","res":"Lista as características de tendências fortes (gaps, pouca sobreposição, correções pequenas e laterais, sem barras climáticas, 20 gap bars, barras contra a tendência enganosas) e como operar: entrar a mercado a favor, esperar nenhuma boa reversão, e só scalps contra.","L":[[17,"s",[1,2,3],"Gap grande que não reverte cedo e abertura perto da mínima indicam dia que fecha perto da máxima; tendência desde a abertura com correções pequenas."],[20,"s",[1,2,3,4],"Gap grande de alta sem reversão: comprar rompimento da amplitude da abertura, testes do gap e fundo duplo."],[16,"c",[1,2,3],"Após 20 ou mais barras sem tocar a média, entre a favor na primeira correção de duas pernas até a média."],[7,"s",[3,6],"H1 após rompimento e correção em impulso forte é compra; L1 não existe aqui."],[10,"s",[3],"A barra 5 foi H1/L1 em rompimento e correção após quatro barras de tendência; o teste do rompimento na barra 18 serve de entrada."],[12,"s",[3],"A barra 17 foi o primeiro rompimento de micro canal em dia forte, com entrada 1 tick além do extremo."],[27,"s",[1,6],"Falhas de cunhas e de outras reversões são sinais de força; bandeira de alta em cunha (H4) abaixo da média."],[14,"e",[1,6],"Dia de impulso e canal: início do canal funciona como magneto; abertura abaixo da linha de tendência com máxima mais baixa levou a reversão para."],[15,"e",[2],"Pequena bandeira de alta com fundo duplo ao testar mínima da abertura em dia com gap de alta."],[30,"e",[6],"A barra 15 foi sinal de bandeira final nunca acionado, pois o preço não passou do extremo da barra de sinal."],[24,"e",[1,6],"Três dojis na média formaram lateralidade estreita com efeito magnético; rompimento em qualquer direção falhou, scalp de quatro ticks."],[8,"s",[3,6],"Limit no fechamento da barra anterior não executa quando a mínima da barra seguinte não o toca; sinal de tendência forte; comprador precisa pagar mais."],[11,"s",[3,6],"Se perdeu uma entrada a favor, pare de procurar scalps contra e opere só a favor; sinais fracos a favor forçam entrar atrasado."],[23,"w",[6],"Em dias de tendência as reversões e barras de reversão contra a tendência emboscam traders."],[44,"w",[6],"Se há sinais de força, só operar a favor e no 5 minutos; contra a tendência, apenas scalp com toda a posição e poucas vezes."],[43,"e",[6],"Compradores e vendedores presos esperam sinais fortes que não vêm e continuam entrando em pedaços, o que faz o mercado correr sem correção."],[1,"s",[],"Lista de sinais de força: pouca sobreposição, barras sem sombra, ausência de barras climáticas, dois fechamentos nunca opostos à média, correções laterais."],[5,"s",[],"Gap de rompimento, gap de projeção e micro gap de projeção como sinais de força."],[0,"s",[],"Barras sem sombras mostram urgência; abertura na mínima e fechamento na máxima."],[48,"s",[4,6],"Contra a tendência forte, só operar após ruptura de linha de tendência e boa barra de reversão, e apenas scalp."]],"secs":[],"tr":["Quando a ordem limit no fechamento da barra anterior não é executada porque a mínima seguinte não o toca, é sinal de tendência forte; o comprador precisa pagar mais alto."],"q":"ok","parts":[]},{"id":"l1c20","k":"livro","bk":1,"cap":20,"part":false,"t":"Duas Pernas","pg":359,"o":54,"why":"","res":"O mercado tende a tentar algo duas vezes, e todo movimento se divide em duas pernas menores. Explica a correção ABC, as duas pernas como alternativa às Ondas de Elliott, e a sobreposição com padrões de três puxadas.","L":[[9,"c",[1,2,6],"Correção ABC tem movimento contra, pequeno a favor e segundo contra; mercado tenta duas vezes e, se falha, tenta o oposto."],[27,"s",[2],"Duas pernas se sobrepõem a três puxadas: às vezes as duas pernas ultrapassam o extremo, às vezes só a segunda."],[26,"s",[2],"Topo ou fundo duplo claro: segunda puxada testa onde o mercado reverteu; novo fracasso nesse preço indica reversão ou correção."],[7,"s",[1,3],"Em rali de duas pernas contra tendência de baixa, vendedores entram acima da máxima da primeira perna; retomada da tendência após falha."],[44,"w",[6],"Padrões perfeitos não existem; sem confiança na leitura, não opere e evite setups confusos, pois haverá outro mais claro em pouco tempo."],[4,"s",[],"Duas pernas como unidade do mercado; pernas menores compõem pernas maiores; quebra de linha de tendência e correção são pernas; Ondas de Elliott descartadas."],[2,"s",[],"Quebra de linha de tendência é o início de uma nova perna na direção oposta."]],"secs":[],"tr":[],"q":"ok","parts":[]},{"id":"l1c21","k":"livro","bk":1,"cap":21,"part":false,"t":"Tendência em forma de Impulso e Canal","pg":365,"o":12,"why":"","res":"Toda tendência tem fase de impulso (rompimento/gap/clímax) e fase de canal; o capítulo mostra como cada fase se opera, onde o canal acaba (movimento projetado, três puxadas) e variações como clímaxes consecutivos, impulso e clímax, gap e canal.","L":[[14,"c",[1,2,3,4,5,6],"Impulso entra a mercado ou em pequenas correções; canal opera-se a favor em correções; o canal acaba em movimento projetado, depois testa o início."],[18,"s",[2,3,4],"Impulso é rompimento: com contexto forte, compre a mercado ou no fechamento das barras, stop abaixo do fundo do impulso."],[12,"c",[1,2,3,6],"Em canal estreito só vale operar a favor, nas correções, com ordens limite além do extremo anterior; contra a tendência perde dinheiro."],[27,"c",[2,3,5],"Fim do canal costuma ser terceira puxada em cunha que ultrapassa a linha de canal e reverte com barra forte, melhor com segunda entrada."],[21,"c",[5],"Alvo: altura do impulso projetada a partir do fim dele, ou perna 1 = perna 2 com impulso como perna 1; veja reversão ali."],[29,"c",[1,2,5],"Clímaxes consecutivos (compra ou venda) esgotam traders fracos e levam a correção de duas pernas de pelo menos 10 barras; três clímaxes, reversão maior."],[15,"s",[2,3,5],"Correção até o início do canal tende a formar bandeira de fundo duplo (alta) ou topo duplo (baixa), setup a favor da tendência original."],[22,"s",[1,3,5],"Canal é a primeira perna de uma lateralidade; vender impulsos de alta no topo provável de lateralidade e realizar no teste do início do canal."],[10,"s",[3,5],"Após rompimento do canal contra a tendência, aguarde a correção para um extremo de swing mais baixo ou mais alto em vez de entrar no rompimento."],[16,"e",[2,3],"A barra de gap da média móvel costuma iniciar a última perna antes da reversão maior; também 20 barras de gap como entrada a favor em tendência forte."],[35,"s",[1,2],"Gap de abertura é impulso; a primeira barra do S&P cash mostra isso; pausa e canal formam o impulso em forma de gap e canal."],[8,"s",[3,5],"Em canal estreito, compre em correções até linha de tendência ou média móvel ou com limite abaixo da mínima anterior."],[30,"e",[2,3,6],"Reversão em bandeira final aparece no extremo de impulso e clímax; espere correção de duas pernas, pois H1/L1 e H2/L2 podem falhar."],[25,"e",[2],"Triângulo logo após grande gap é provável bandeira a favor do gap; lateralidades em tendência costumam romper a favor dela."],[1,"s",[],"Impulso e canal é o tipo de tendência mais comum, presente quase todo dia; teste do início do canal em 1-2 dias."],[2,"s",[],"O canal pode ser parabólico (clímax insustentável); linha de canal ultrapassada indica aceleração, mas não entre contra cedo."],[4,"s",[],"Conte três puxadas no canal e duas pernas na correção; cunha no extremo e canal diminuem o momentum."],[5,"s",[],"Impulso deixa gap de rompimento (teste ~10 barras); gap de abertura funciona como impulso."],[0,"s",[],"Barra grande de tendência = impulso, rompimento e clímax; impulsos opostos acumulam pressão."]],"secs":[["Definição e características do impulso e canal",[14]],["Três desfechos após o impulso (retomada, lateralidade, reversão)",[14,18]],["Canal como bandeira oposta; teste do início e fim do canal",[14,27,15,10]],["Alvos de movimento projetado e neutralidade (50%)",[21]],["Operar contra a tendência no canal e escalar entrada",[22,12]],["Clímaxes consecutivos, impulso e clímax, gap e canal",[29,14]],["Como operar cada parte; impulsos opostos cumulativos",[18,8,12]],["Fig. 21.1-21.3: três puxadas, impulsos todo dia",[27,15,16]],["Fig. 21.4-21.7: micro canal parabólico, gap e canal, impulsos em tempos maiores",[18,14,16]],["Fig. 21.8: clímaxes consecutivos",[29,27,21]],["Fig. 21.9-21.10: gap de alta, fundo duplo; impulso e clímax",[30,7,25]]],"tr":["Em impulso de várias barras, compre no fechamento de qualquer barra com stop abaixo do fundo do impulso, tamanho pequeno e adicionando ao longo da subida (Fig. 21.4).","Após impulso climático, H1 acima da barra de sinal provavelmente falha; agressivos vendem a limit na máxima ou acima da máxima de barras H1 e H2 (Fig. 21.10)."],"q":"ruidoso","parts":[]},{"id":"l1c22","k":"livro","bk":1,"cap":22,"part":false,"t":"Dias de Lateralidades em Tendência","pg":407,"o":13,"why":"","res":"Dia de duas ou mais lateralidades separadas por rompimentos; típico quando a lateralidade inicial tem 1/3 a 1/2 da amplitude diária média. Opera-se nos dois lados, vendendo alto e comprando baixo, com saída no movimento projetado.","L":[[22,"c",[1,3,5],"Compre baixo e venda alto em cada lateralidade; contra barras fortes na região do movimento projetado, venda e escale esperando teste do gap."],[21,"c",[5],"Realize lucro no movimento projetado pela altura da lateralidade; use primeiro a menor das possibilidades de alvo."],[17,"s",[1,2],"Abertura com amplitude de um terço a metade da média sinaliza rompimento e duplicação da amplitude; impulso aqui tem 1-3 barras."],[19,"s",[2,3,6],"Entrar no rompimento de lateralidade é de baixa probabilidade; prefira rompimento e correção, e cerca de um terço dos rompimentos reverte."],[33,"s",[1,3,5],"A maioria dos dias de reversão começa como lateralidades em tendência; esteja pronto para reversão tardia que cobre a faixa do dia."],[10,"s",[3],"Segunda lateralidade costuma testar a anterior; entradas de rompimento e correção são razoáveis, mas arame farpado torna-as arriscadas."],[23,"s",[2,3],"Rompimento tende a falhar e voltar à lateralidade por atração magnética; falha de rompimento do topo é venda."],[14,"w",[1,2],"Distinguir do impulso e canal: correção lateral de 5-10 barras ou canal fraco indicam lateralidades em tendência, então scalps em vez de swings."],[24,"w",[6],"Lateralidade que dura até a última hora com amplitude pequena costuma romper no fim do dia; não desista dela."],[27,"e",[2,3],"Cunha de alta antes do rompimento (barras 5,7,9) e bandeira final; três puxadas para baixo como fundo."],[1,"s",[],"Dia de lateralidades em tendência é cerca de 2x mais comum que impulso e canal; todo dia tem ao menos um swing de impulso e canal."],[6,"s",[],"Tamanho da amplitude da abertura vs. média diária e horário de rompimento (após 1 hora = fraco); reversão por volta das 11:30 PST."],[3,"s",[],"Lateralidade anterior e gaps de rompimento são magnetos; testes do ponto de entrada de contra tendência são alvos."],[5,"s",[],"Gap de rompimento entre lateralidades é testado, e a segunda lateralidade fica dentro dele."],[48,"s",[2,3,5],"Vender fechamento ou acima da máxima de grande barra de alta perto do alvo medido, aumentando posição se subir, mirando o gap."],[8,"s",[3,4],"Comprar com limite em movimento medido para baixo da altura da faixa superior, escalando entre 4 e 6 pontos abaixo da faixa."]],"secs":[["Características e distinção do impulso e canal",[17,14]],["Operar rompimento, alvos, stops e contra barras grandes",[22,21,19]],["Reversão tardia, dica sutil e rompimento no fim do dia",[33,24]],["Figs. 22.1-22.4: lateralidades, escalar, compras no teste",[22,23,21]],["Figs. 22.5-22.10: múltiplas lateralidades, rompimento tardio",[10,17,19]]],"tr":["Compradores escalam entrada de 4 a 6 pontos abaixo do fundo da lateralidade superior, mirando 3 a 6 pontos na correção ao gap, com limite em alvo projetado (Fig. 22.2).","Presuma ao menos 60% de chance de ganhar $1 antes de perder $1 quando há desequilíbrio; realize parcial no doji e saia no zero a zero se falhar (Fig. 22.3)."],"q":"ruidoso","parts":[]},{"id":"l1c23","k":"livro","bk":1,"cap":23,"part":false,"t":"Tendência desde a Abertura e Tendências de Correções Rasas","pg":433,"o":57,"why":"","res":"O dia de tendência desde a abertura é o mais forte; com correções rasas, é o de menor risco por swing, mas os setups parecem fracos. Ensina entrar na primeira correção, a stops largos para swing, e a ler a primeira barra e o gap.","L":[[17,"c",[1,2,3,4,5,6],"Mínima/máxima do dia nas primeiras barras, correções menores que 20-30% da média; compre pequena posição e segure swing com stop abaixo de mínimas de swing."],[7,"c",[2,3,6],"Em tendência forte compre H1 e H2 a stop acima da barra de correção, mesmo com sinal fraco; vender abaixo de barras é estratégia perdedora."],[8,"s",[3,5],"Compre a limit na mínima da barra anterior ou 1-2 ticks abaixo, ou cinco a sete ticks abaixo da máxima do dia."],[11,"s",[3,6],"Perdeu a entrada? Entre a favor na primeira correção após forte primeira perna ou em qualquer pausa lateral; a primeira quebra de linha de tendência costuma falhar."],[35,"c",[1,3],"Gap grande leva a dia de tendência (60/40 na direção do gap); primeira barra forte é bom rompimento; reverta se o stop sair."],[18,"s",[2,3],"Quatro barras ou duas grandes sem correção são forte impulso; operar a mercado em dia de correções rasas, mas esperar o fechamento da barra."],[14,"s",[1,2],"Todo dia começa como tendência desde a abertura; impulso é seguido por clímax, lateralidade estreita ou canal; desde a abertura pode virar impulso e canal."],[29,"w",[2,6],"Após as 11:00, duas barras grandes de tendência rompendo novo extremo tendem a ser clímax exaustivo; correção de duas pernas de cerca de 10 barras, 3 a 5 pontos."],[33,"w",[6],"Tendência desde a abertura pode reverter; primeira barra forte pode emboscar; esteja flexível e reverta rápido (Fig. 23.9)."],[16,"s",[2,3],"Barra de gap da média móvel e 20 gap bars aparecem tarde na tendência; a primeira costuma iniciar a última perna."],[27,"w",[6],"Cunha cuja correção é lateral e não para baixo mostra tendência muito forte; pare de procurar reversões e opere só a favor."],[32,"s",[3],"A primeira correção que rompe uma linha de tendência significativa é entrada a favor da tendência principal (ex.: entrada além da barra 4)."],[34,"s",[1,3],"Amplitude de abertura menor que 25-30% da média dá modo rompimento; topo ou fundo duplo antes da tendência; relatório às 7:00 e computadores."],[6,"s",[],"Primeiras barras definem o extremo do dia (50% em ~5 barras, 90% na amplitude de abertura); relatórios às 7:00 PST e reversão por volta de 11:00."],[1,"s",[],"Tendências fortes têm setups de aparência fraca e muitas barras contrárias; setups de swing têm 70% ou mais de acerto para o experiente."],[5,"s",[],"Quanto maior o gap, maior a chance de dia de tendência, na direção do gap; gap de abertura frequentemente testa a abertura."],[0,"s",[],"Primeira barra é barra de sinal para tendência desde a abertura; barra de reversão com muita sobreposição é só lateralidade."],[45,"s",[2,3],"Em tendência da abertura, comprar a primeira correção: limite na mínima da barra anterior ou stop um tick acima de high 1 ou high 2."],[20,"s",[2,3],"Com gap acima de poucos ticks, opere o rompimento da primeira barra nos dois sentidos; se o stop for atingido, considere reverter."]],"secs":[["Características do dia de tendência desde a abertura",[17,35]],["Probabilidades: 20% dos dias, primeira barra e primeira hora",[17,34]],["Correções rasas, psicologia e correção tardia após 11:00",[17,29]],["Relatórios, impulso na abertura e o que vem depois",[18,14,34]],["Entrar na primeira correção e setups fracos",[11,8,7]],["Stops: não ir ao zero a zero cedo",[17]],["Gap de abertura e primeira barra forte",[35]],["Figs. 23.1-23.4: primeira correção, correções rasas, quebra de linha",[11,8,32]],["Figs. 23.5-23.9: primeira barra enganosa, gaps, abertura na máxima, reversão",[35,33,16]],["Figs. 23.10-23.11: tendência forte com setups fracos; topo duplo na abertura",[7,8,27]]],"tr":["Em tendência forte, compre a limit na mínima da barra anterior ou abaixo, ou a stop acima de H1/H2, mesmo com barra de sinal ruim (Figs. 23.2 e 23.10).","Em tendência forte use stop financeiro de 2 pontos, não abaixo de barras; scalp de 1 ponto arriscando 6 ticks exige mais de 60% de acerto."],"q":"ruidoso","parts":[]},{"id":"l1c24","k":"livro","bk":1,"cap":24,"part":false,"t":"Dia de Reversão","pg":469,"o":104,"why":"","res":"Dia que tende numa direção e depois inverte até o fechamento; a maioria começa como lateralidades em tendência. Mostra pistas (impulso contra a tendência) e que reversões nas últimas horas têm continuidade no dia seguinte.","L":[[33,"c",[1,2,3,5,6],"Impulso forte contra a tendência durante a correção sinaliza possível reversão; se identificar cedo, opere só o novo lado e saia de scalps contrários."],[27,"c",[2,3,5],"Fundo em cunha grande gera rali de duas pernas ao topo da cunha; compre após mínima mais alta ou L2 que falha."],[29,"s",[2,6],"Dois clímaxes seguidos geram correção; terceiro clímax gera correção maior; cunha que falha leva a movimento projetado."],[17,"s",[1,6],"Gap grande com barra forte na primeira barra sugere dia de tendência desde a abertura, mas ele pode virar reversão."],[21,"e",[5],"Movimento projetado perfeito até o fechamento após rompimento da lateralidade; ponto médio do gap de ruptura marca metade da perna."],[14,"e",[2,5],"Em canal de baixa forte, ganhe mais com swings que com scalps; mova stop acima da máxima do swing anterior."],[7,"w",[6],"Insistir em scalps que perdem em sequência é sinal de que o mercado tem tendência contrária à sua."],[1,"s",[],"Tendência forte pode surgir a qualquer hora, inclusive após tendência oposta; dia reversão vira barra de reversão no gráfico diário."],[6,"s",[],"Relatório às 7:00 e gap de abertura dão pistas; reversão tardia forte tem continuidade no dia seguinte."],[4,"s",[],"Contar três puxadas (barras 8, 15, 17) e duas pernas para ver onde a reversão se completa."]],"secs":[],"tr":["Se a primeira barra da correção contra a tendência é um impulso forte, considere que a correção pode virar tendência; em reversão em cunha, compre acima da barra interna após a mínima mais alta."],"q":"ruidoso","parts":[]},{"id":"l1c25","k":"livro","bk":1,"cap":25,"part":false,"t":"Dia de Retomada de Tendência","pg":479,"o":70,"why":"","res":"Tendência forte na primeira hora, longa lateralidade estreita na metade do dia e retomada na última hora, frequentemente com segunda perna igual à primeira. Rompimento contra a tendência costuma ser armadilha; também pode ocorrer em vários dias.","L":[[17,"c",[1,2,3,5,6],"Forte tendência inicial, lateralidade de horas e retomada na última hora; não desista, entre em rompimento e correção ou perto da média móvel."],[10,"s",[3],"Quem perdeu a entrada antecipada ou de rompimento entra no rompimento e correção, ou em correção perto da média móvel."],[21,"s",[5],"A segunda perna tem tamanho próximo ao da primeira; movimento projetado pela altura do impulso medida da abertura ou do extremo da barra inicial."],[23,"w",[2,6],"Rompimento contra a tendência na lateralidade costuma falhar entre 11:00 e meio-dia; reversões por ombro-cabeça-ombro e três puxadas falham."],[24,"w",[1,6],"Lateralidade estreita pode levar a reversão e não retomada; cerca de 40% das vezes acontece o oposto."],[16,"e",[3],"A primeira barra de gap da média móvel foi a barra de sinal da entrada que levou ao movimento até o fechamento."],[33,"s",[6],"Rompimento tardio na direção oposta, quando funciona, faz o dia virar reversão e corrige parte ou toda a tendência da abertura."],[6,"s",[],"Retomada na última ou penúltima hora; rompimento falha entre 11:00 e meio-dia (horário da Califórnia); padrão pode durar vários dias."],[1,"s",[],"Lateralidade muito estreita e longa favorece armadilha; gráfico de 60 minutos pode mostrar apenas ABC."],[3,"s",[],"Uma linha de suporte (ou resistência) testada várias vezes ao tick exato indica participantes fortes defendendo o nível (Fig. 25.2)."],[19,"s",[2,3,5],"Em tendência forte seguida de faixa longa, esteja pronto para entrar no rompimento a favor da tendência no final do dia."]],"secs":[],"tr":["Ao esperar retomada na última hora, mantenha porção maior da posição para swing; entre em rompimento e correção se não pegou o rompimento."],"q":"ruidoso","parts":[]},{"id":"l1c26","k":"livro","bk":1,"cap":26,"part":false,"t":"Escadas: Tendência em forma de Canal Amplo","pg":489,"o":14,"why":"","res":"Escadas são canais amplos com três ou mais swings em tendência, onde cada rompimento é seguido por correção além do ponto de rompimento. Opera-se nos dois lados, escalando contra rompimentos subsequentes; escadas diminuindo indicam perda de momentum.","L":[[13,"c",[1,2,3,4,5,6],"Compre perto da linha de canal e venda perto da de tendência; use a distância dos rompimentos anteriores para limites e alvos; swing a favor."],[27,"s",[2,6],"Escadas diminuindo e cunhas que falham levam a movimento projetado; três puxadas não garantem reversão sem pressão contrária forte."],[22,"s",[3,5],"Compradores agressivos usam limite 3-4 pontos abaixo do fundo anterior e realizam 3 pontos acima; só para experientes; iniciantes usam ordem stop."],[21,"s",[5],"Uma escada que acelera pode se estender até uma linha paralela projetada (tipo pitchfork) ou até a altura do canal além da linha de canal."],[32,"e",[2,3],"Escadas diminuindo levam a reversão de duas pernas e quebra da linha de tendência; extremo de swing pior que o anterior após rompimento e correção."],[30,"e",[3],"Reversão de duas barras e bandeira final de quatro barras como compra no fundo do canal de baixa."],[7,"w",[3,6],"Em escadas, cada rompimento tem correção além do ponto; prefira entrada a stop após reversão em vez de antecipar."],[2,"s",[],"Linhas de canal de melhor ajuste; uma correção que não alcança a linha de canal mostra participantes a favor agressivos (Fig. 26.1)."],[1,"s",[],"Escadas costumam ser bandeiras de tendência em tempo maior; canal amplo de alta hoje pode ser bandeira de baixa, rompendo na abertura seguinte."],[4,"s",[],"Número de ticks de cada rompimento além do swing anterior serve como estatística para a próxima entrada."]],"secs":[],"tr":["Compre com ordem limitada 3 a 4 pontos abaixo do fundo anterior (distância do rompimento anterior), realizando 3 pontos acima, em canal amplo de baixa (Fig. 26.1).","Em escadas diminuindo, compre ou venda o fechamento de barra forte que ultrapassa o swing anterior para scalp, mas entrada a stop após reversão é mais segura."],"q":"ruidoso","parts":[]},{"id":"l1c217","k":"livro","bk":1,"cap":217,"part":true,"t":"Parte II: introdução (linhas de tendência e canais)","pg":217,"o":28.5,"why":"","res":"Define linhas de tendência, linhas de canal e linhas horizontais, e mostra na Figura PII.1 como cada tipo de linha destaca a ação do preço, incluindo cunhas e triângulos.","L":[[25,"s",[1,2],"Triângulos simétricos têm duas linhas de tendência e nenhuma linha de canal; operam-se do mesmo modo, então subtipos são desnecessários."],[27,"s",[1,2],"Canal convergente em ascensão é uma cunha; linhas convergentes caracterizam cunhas e a maioria dos triângulos."],[24,"e",[1],"Abertura em pequena lateralidade de sete barras põe o dia em modo rompimento; compra-se acima e vende-se abaixo dela."],[2,"s",[],"Distingue linha de tendência (a favor, em correções) de linha de canal (contra a tendência); canal horizontal equivale a lateralidade."],[3,"s",[],"Linha horizontal superior é resistência e inferior é suporte; instituições vendem e compram nos dois lados."]],"secs":[],"tr":["Em triângulo expandido com rompimento para cima, o alvo mínimo é um movimento projetado igual à altura do triângulo."],"q":"ruidoso","parts":[]},{"id":"l1c307","k":"livro","bk":1,"cap":307,"part":true,"t":"Introdução da Parte Tendências (texto sem número de capítulo, p.307-322)","pg":307,"o":57.5,"why":"","res":"Define tendência, swing, correção e perna; fases de impulso e canal; por que operar a favor (cerca de 80% das reversões falham); como instituições entram em impulsos e correções e como compradores e vendedores fortes agem conforme a tendência amadurece e reverte.","L":[[14,"c",[1,2],"Tendências começam fortes (impulso) e passam à fase de canal, que dura mais que o esperado; lateralidade é uma correção em tempo maior."],[7,"c",[1,3],"Barra de correção real com mínima abaixo da anterior vira setup de H1 de compra de alta probabilidade acima da máxima no impulso forte."],[8,"c",[3],"Compradores de valor posicionam limit na mínima ou abaixo da barra anterior; a primeira correção cai poucos ticks. Quem prefere stop troca lucro por probabilidade."],[11,"c",[1,3,4],"Instituições entram durante o impulso e ampliam nas correções; o stop além do início do impulso exige posição menor para manter o mesmo risco em dólar."],[18,"s",[3,4],"Entre a mercado, em correção de um ou dois ticks, além do extremo da barra anterior, ou no rompimento de swing."],[29,"s",[2,6],"Tendência com 30+ barras tem rompimento excepcional que pode ser clímax exaustivo; compradores e vendedores fortes vendem no fechamento e aguardam correção de duas pernas."],[27,"s",[5],"Topo de cunha seguido de rompimento leva a movimento projetado igual à altura da cunha enquanto vendedores cobrem."],[21,"s",[5],"Participantes fortes fazem pirâmide no rompimento do extremo e realizam lucro em alvos de movimento projetado, linhas de tendência ou linhas de canal."],[28,"s",[1,2],"Reversão ocorre em transição gradual: compradores mais seletivos, vendas na nova máxima, correção abaixo da média e da linha de tendência, depois máxima mais baixa."],[17,"s",[
