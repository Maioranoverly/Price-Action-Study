a: risco de 2 pontos, alvo de 4 pontos, 40% de acerto, perda total só ~30%; trades de swing costumam durar horas."],"q":"ok","parts":[]},{"id":"l3c20","k":"livro","bk":3,"cap":20,"part":false,"t":"Aberturas com Gaps: Reversões e Continuações","pg":455,"o":23,"why":"","res":"Trata o gap como um rompimento e um grande candle invisível: quanto maior o gap, mais provável dia de tendência na direção do gap, mas é preciso seguir o mercado, operar parciais e permitir swing.","L":[[35,"c",[1,2,3,4,5,6],"Gap grande aumenta chance de tendência (~50% canal na mesma direção); operar abertura normalmente, buscando swing e adição em correções."],[20,"c",[1,2,3,5],"Gap tratado como grande barra de tendência; abertura com doji sinaliza trading range por horas; sem clareza, comprar baixo e vender alto."],[14,"s",[1,2],"Gap seguido de pequena correção e canal forma impulso e canal, com o gap como impulso."],[17,"s",[1,3],"Gap grande com primeira barra de tendência frequentemente vira tendência desde a abertura com correções rasas."],[7,"s",[3],"Tendência pós-gap frequentemente começa com contratendência de duas pernas à média ou duplo fundo/topo."],[37,"s",[1,4],"Com gap grande lateralizando, chance >60% de dia de tendência: risco de ~6-10 pontos para 15-20, bom resultado esperado."],[42,"s",[5],"Sempre carregar parte do swing mesmo sendo stopado em parte das vezes; um bom swing compensa vários scalps."],[5,"s",[],"Gap de 5 minutos é rompimento da última barra de ontem; o tamanho indica extremo."],[1,"s",[],"Seguir o mercado, sem teimar; aceitar trading range quando gap não vira tendência."],[6,"s",[],"Abertura e primeiras horas determinam o caráter do dia com gap."]],"secs":[],"tr":["Com gap grande e sem reversão, risco de ~6-10 pontos para alvo de 15-20 com mais de 60% de chance é descrito como trade excelente; sem número de duração."],"q":"ruidoso","parts":[]},{"id":"l3c21","k":"livro","bk":3,"cap":21,"part":false,"t":"Exemplos detalhados de day trading","pg":463,"o":120,"why":"","res":"Série de exemplos comentados barra a barra em Treasuries, EUR/USD, soja, petróleo e Emini de 1 minuto, mostrando como as peças (correções, cunhas, finais de bandeira, H2/L2, impulso e canal) se combinam.","L":[[7,"e",[2,3],"H2/L2 e H1/L1 após impulso forte, especialmente na média móvel, repetidos em todos os gráficos."],[27,"e",[2,3],"Cunhas e três puxadas servem de reversão ou de bandeira (cunha após impulso)."],[14,"e",[2,5],"Impulso e canal terminando em três puxadas; a correção tende a retornar ao início do canal e a durar metade das barras."],[30,"e",[2,3],"Pequenas bandeiras finais após clímax levam ao extremo do dia; entrada a limite no extremo da barra anterior."],[25,"e",[2,6],"Confusão entre vários puxadas indica triângulo/lateralidade apertada: esperar rompimento em vez de operar dentro."],[23,"e",[2,3],"Falha de rompimento a um tick da máxima reverte pela base do range em barra de baixa externa."],[10,"e",[2,3],"Correções de rompimento depois de falhas e quebras de linha de tendência, como entrada além de barra pequena."],[32,"e",[2,3],"Quebra da linha de tendência e teste do extremo como entrada; sobreposição de linhas de canal."],[29,"e",[2,3,5],"A maior barra contra a tendência e um spike de duas barras sugerem exaustão: ao menos reversão de duas pernas e 10 barras."],[43,"e",[6],"Barras de reversão que não se confirmam deixam longos presos; a barra seguinte vira ótimo sinal de curta."],[4,"s",[],"Contagem H1/H2, L1/L2, L4 e pernas aparece em todas as figuras."],[2,"s",[],"Canais e quebras de linha de tendência embasam reversões."],[1,"s",[],"Always in e fluxo do dia definem se contratendência merece entrada."]],"secs":[],"tr":["Contratendência em tendência de baixa deve sair em qualquer sinal L2; vendedores agressivos usam limit na máxima da barra anterior após clímax de compra."],"q":"ruidoso","parts":[]},{"id":"l3c24","k":"livro","bk":3,"cap":24,"part":false,"t":"As Melhores Operações: Juntando Tudo","pg":523,"o":121,"why":"","res":"Define as melhores operações: chance de 60% de ganhar 1x o risco ou 50-60% de 2x, quase sempre correções a favor do always in, reversões fortes e fades nas bordas de lateralidade; mostra quando não operar e exemplos em 24 gráficos.","L":[[7,"c",[1,2,3,4,5,6],"H2/L2 na média em tendência forte é a operação diária mais confiável; stop além da barra de sinal, depois da entrada; parcial em 1x."],[8,"c",[3,6],"Experientes usam ordem limite além da barra anterior em bandeira quieta na média; só a favor da tendência; iniciantes usam stop."],[18,"c",[2,3,4],"Entrar em spike forte no mercado ou fechamento da 2a-4a barra, com stop largo e posição menor; difícil para iniciantes."],[10,"c",[2,3],"Comprar abaixo de barra de alta que rompe bandeira, antecipando correção de rompimento; correção tem risco menor que o spike."],[22,"c",[1,2,3,5],"Comprar embaixo/vender no topo da lateralidade, melhor em segunda entrada; spikes até a borda falham em ~80%."],[28,"c",[1,2,3],"Reversão exige forte quebra da linha de tendência e teste do extremo (extremo pior, duplo ou melhor que o anterior) com barra de sinal forte."],[27,"s",[2,3],"Cunha bull flag à média e terceiros/quartos puxadas em escadas servem como setups de melhor trade."],[30,"c",[2,3],"Bandeira final forte após swing em lateralidade ou canal fraco, com reversões duplas e clímax consecutivos."],[9,"s",[3],"Segunda entrada em reversões fortes; primeiro sinal de reversão muitas vezes falha."],[24,"w",[6],"Lateralidade apertada vence todos os motivos para operar; stops de entrada perdem repetidamente; não operar até haver rompimento."],[12,"w",[1,6],"Canais apertados raramente oferecem melhores operações; esperar rompimento e avaliar always in; entrada em spike é exceção."],[15,"s",[2,3],"Duplo fundo/topo bandeira e micro duplos são a origem da maioria dos fundos e topos operáveis."],[34,"s",[1,3],"Há setup razoável de swing na abertura em mais de 80% dos dias; reversão de abertura tem ~30% de 2x, ~60% de 1x."],[17,"s",[1,3],"Dias de tendência forte desde a abertura: nunca opere contra a tendência; entre nas menores correções."],[16,"e",[2,3],"Barra de gap da média e 20 gap bar curta em tendência como ponto de entrada."],[11,"s",[3],"Entrar tarde costuma ainda ser bom; cedo demais é pior em reversões; operar a favor da tendência com adição em correções."],[25,"e",[2,3],"Triângulo expandido em topo/fundo e como bandeira após topo expandido."],[26,"e",[2,3],"Duplos extremos e ombros-cabeça-ombros em exemplos diários e de 5 minutos."],[29,"s",[2,6],"Clímax enorme após 10-20 barras de tendência sinaliza exaustão; correção de duas pernas esperado."],[32,"s",[2,3],"Teste do extremo após quebra forte de linha de tendência; correção à linha antes da entrada."],[37,"c",[1],"Melhor operação: 60-70% para 1x ou 50-60% para 2x; equação com probabilidade, risco e recompensa; scalps com risco maior que alvo perdem."],[39,"c",[4],"Stop protetor sempre; stop sem muito grande nem muito pequeno; mover ao breakeven após barra de entrada ou meio caminho do alvo."],[40,"c",[5],"Alvo ao menos igual ao risco; parcial em 1x, resto com stop em breakeven; usar limit um tick antes do alvo óbvio."],[38,"c",[3],"Iniciantes entram a stop; limit exige experiência e só a favor do always in."],[42,"c",[1,5],"Compara scalp (60-70% para 1x), swing (2x, 40-50%) e meio-termo de 5-10 trades; scalp com alvo menor que risco é ruim."],[41,"s",[3,5],"Adicionar em cada correção e escalar saída; instituições entram com limits em lateralidade."],[44,"c",[6],"Evitar contratendência, 1 minuto e lateralidade apertada; 3-5 trades por dia; posição pequena no modo não me importo."],[43,"s",[6],"Teste de rompimento que corre os stops de breakeven e reverte é bom risco/recompensa; pegos presos."],[1,"s",[],"Ciclo do mercado (spike, canal, lateralidade), always in e spikes fortes estruturam todas as escolhas."],[4,"s",[],"H1/H2, L1/L2, 60% de equidistante e dois pernas guiam operações."],[0,"s",[],"Barras de sinal de tendência são melhores; dojis são ruins."],[2,"s",[],"Quebra de linha e canais de tendência."],[3,"s",[],"Máxima/mínima de ontem e magnetos."],[5,"s",[],"Barras de gap da média e aberturas com gap."]],"secs":[["Ciclo do mercado e como os traders operam tendência de alta",[18,7,12,22]],["Lista das melhores operações (stop e limit) e regras para iniciantes",[28,30,7,8,10,22,18]],["Matemática da equação do trader e scalper's dilemma",[37,42]],["Escolha do estilo: scalp, swing, meio-termo",[42,34]],["Reversões fortes e setups da abertura",[28,34,23]],["Correções em tendência forte: o setup mais confiável",[7,41,39,40]],["Lateralidade: fade nas bordas e evitar lateralidade apertada",[22,24,44]],["Canais e erros de contratendência, 1 minuto, posição",[12,44]],["Figura 24.1 a 24.4: always in e H2 na média; Treasury e forex",[7,8,10,27]],["Figura 24.5 a 24.8: H2 diário, tendência da abertura, tight range, L2 de baixa",[7,24,17,39,40]],["Figura 24.9 a 24.13: bandeiras de cunha e reversões diárias",[27,28,16,8]],["Figura 24.14 a 24.20: reversões de tendência e higher low",[28,32,23,25]],["Figura 24.21 a 24.24: bandeiras finais e fade de meio de range",[30,22,29,40]]],"tr":["Limit só a favor do always in: comprar no mínimo da barra anterior em bandeira quieta na média, nunca limit contra a tendência.","Comprar no fundo da lateralidade com cunha/segunda entrada é tratado como melhor operação, com 50-60% de acerto e alvo de 2x.","Em spike forte, vender no fechamento da 2a, 3a ou 4a barra com stop largo até o topo do spike e posição menor.","Alvo mínimo de 1x o risco, stop realista (nem curto demais nem maior que a barra mais alta), parcial em 1x e breakeven; swing de 4 pontos no Emini."],"q":"ruidoso","parts":[]},{"id":"l3c25","k":"livro","bk":3,"cap":25,"part":false,"t":"Diretrizes para o Operacional","pg":607,"o":47,"why":"São 78 diretrizes. Boa para reler no começo de cada sessão de replay.","res":"78 diretrizes em lista: subjetividade, equação do trader, tendência x lateralidade, evitar contratendência e lateralidade apertada, tamanho de posição, 5 minutos, disciplina e gestão de parciais.","L":[[7,"c",[1,3],"Comece com correção a stop na média no gráfico de 5 min; entre em H2/L2 mesmo no extremo do dia em tendência clara."],[24,"w",[6],"Lateralidade apertada é o pior ambiente para stops; não opere, mesmo sem trade por horas."],[28,"s",[1,2,3],"Reversões só após forte quebra de linha de tendência e teste do extremo; senão são armadilha."],[23,"s",[6],"Todos os padrões falham e as falhas falham, criando correção de rompimento; duas tentativas falhas apontam o lado oposto."],[18,"s",[2],"Entender barras de tendência que rompem é uma das habilidades centrais; avaliar sucesso do rompimento."],[22,"s",[1,3],"Em lateralidade, comprar baixo e vender alto; incerteza com 5-10 barras de alta sugere apenas vender."],[34,"s",[1,3,6],"Primeira ou duas horas: mais fácil ganhar e perder; esperar setup de swing, menos de 50% com 2x."],[27,"s",[2],"Procure sempre duas pernas; quando tenta duas vezes e falha, tende a ir no sentido oposto."],[37,"c",[1],"Equação tem três variáveis; qualquer setup com resultado positivo é bom; ninguém tem clareza total de probabilidade."],[39,"c",[4],"Stop protetor sempre; olhar como se estivesse fora para decidir sair; ao sair o stop trabalha por você."],[40,"c",[5],"Alvo ao menos igual ao risco; tirar parte em limit perto do extremo anterior e mover o stop para breakeven."],[42,"c",[1,5],"Não faça scalp quando deve fazer swing e vice-versa; converter swing em scalp sem planejar gera prejuízo."],[38,"s",[3],"Iniciantes usam stop na correção; do outro lado de cada stop há um limit de alguém inteligente."],[41,"s",[3,5],"Experientes podem escalar entrada ou saída para melhorar a equação do trader."],[43,"s",[2,6],"Traders presos e stops corridos são sinais confiáveis para operar contra eles; confusão no setup indica armadilha."],[44,"c",[6],"Evitar contratendência, 1 minuto, notícias e excesso de operações; esperar horas; tamanho de posição pequeno."],[1,"s",[],"Tudo é tendência ou lateralidade; escolher always in e operar só a favor até mudar; inércia de 80%."],[0,"s",[],"Melhores barras de sinal são de tendência; dojis são ruins."],[6,"s",[],"Primeira hora é mais fácil e mais arriscada; não relaxar na última hora."]],"secs":[["Princípios de leitura e subjetividade (1 a 15)",[37,44]],["Probabilidade, inércia e preço é verdade (16 a 26)",[37,23]],["Tamanho de posição e mentalidade 'não me importo' (27 a 31)",[44,39]],["Contratendência, reversões e armadilhas (32 a 41)",[28,43,44]],["Como começar: gráfico de 5 min, SPY x Emini e comprar baixo/vender alto (42 a 49)",[7,22,34]],["Meio do dia, lateralidade apertada e tendência (50 a 56)",[24,7,44]],["Scalp, swing, escalar e disciplina final (57 a 78)",[42,41,44,39,40]]],"tr":["Alvo mínimo igual ao risco: com risco de 2 pontos no Emini, não realizar antes de 2 pontos; scalp com alvo menor que o risco exige acerto de ~80%.","Contratendência e correções: tendência favorece com-trend; 80% das reversões falham, então correções com tendência são onde se ganha dinheiro."],"q":"ok","parts":[]},{"id":"l3c41","k":"livro","bk":3,"cap":41,"part":true,"t":"Parte I: introdução","pg":41,"o":91.5,"why":"","res":"Abertura da Parte I: a maioria das tentativas de reversão falha e vira bandeira; define o que é reversão real (quebra de linha de tendência, teste do extremo, inversão do always in) e quando e como operá-la com a matemática do trader.","L":[[28,"c",[1,2,3,4,5,6],"Sequência: quebra da linha, teste do extremo (mais alto/baixo ou duplo), barra de sinal forte; 40-50% de acerto, até 60% se forte; swing com alvo 2x o risco."],[32,"c",[1,2,3],"Nunca pensar em operar contra a tendência antes de romper o canal; rompimento da linha com momentum é o pré-requisito absoluto."],[27,"s",[2,3,5,6],"Overshoot do canal e cunha de três puxadas geram reversão com duas pernas; falha de cunha de baixa/alta (low 2/3) arma o sinal contrário."],[29,"s",[1,2,5],"Fundos de grandes quedas são frequentemente climáticos, com barras enormes, volume e vários clímax; consecutivos clímax de compra pedem correção de 2 pernas e 10+ barras."],[30,"c",[2,3,6],"Bandeira de baixa que falha (low 1/2/cunha) vira bandeira final; armadilha tira os novos compradores e alimenta a nova tendência."],[26,"c",[1,2,6],"Topos/fundos duplos e OCO são trading ranges e, em tendência, quase sempre rompem a favor dela; ombro direito é bandeira; só raramente revertem."],[23,"s",[1,2,3],"Rompimento tem compradores e vendedores; se o rompimento é mais forte que a tentativa de reversão, esta vira bandeira (correção de rompimento)."],[10,"s",[2,3],"Teste do extremo após quebra da linha de tendência é correção do rompimento; falha em retomar a tendência vira correção na nova tendência."],[7,"s",[1,3],"A reversão mais confiável é o fim da correção: bandeira rompendo a favor da tendência; entrar nas correções é muito melhor que apostar no extremo."],[8,"s",[3,4,5],"Operadores experientes compram a limit na mínima de barra de sinal baixista fraca em tendência de alta, ou a stop acima da barra anterior na correção."],[9,"s",[2,3],"Segunda entrada (low 2/3, lower high, higher high) após quebra de linha é preferível se a tendência era forte; senão esperar spike forte."],[24,"w",[6],"Cuidado com canais e barras com tail: reversões quase perfeitas prendem; contra tendência em canal perde 70% e perdedor maior que ganhador."],[25,"e",[2],"Triângulos expandidos de topo/fundo aparecem nas legendas de gráfico diário (barras 6-12; 8-18) como setup de reversão ou bandeira."],[21,"s",[5],"Alvo mínimo: poke além da linha do canal; segunda perna até o movimento projetado (perna 1 = perna 2, altura do spike ou do range)."],[14,"e",[2],"Dia de impulso e canal baixista versus reversão: argumentos de alta e de baixa coexistiam, indicando lateralidade (Fig PI.5)."],[12,"w",[1,6],"Micro canal apertado reduz chance do sinal de reversão (barra 33 sem follow-through na Fig PI.5)."],[33,"s",[1],"Muitos dias de reversão no gráfico diário são dias de lateralidade em tendência no 5 min, fechando perto do extremo."],[22,"s",[1,3,5],"Comprar no fundo de lateralidade após quebra de linha tem pelo menos 60%; comprar no topo de range é aposta de baixa probabilidade."],[1,"s",[],"Tendência tem inércia; reversão é transição para lateralidade na maioria das vezes; always in guia a mentalidade de ordens."],[2,"s",[],"Toda tendência está em um canal; quebrar linha de tendência com momentum é condição absoluta; linhas de canal e overshoot."],[3,"s",[],"Reversões ocorrem em suporte/resistência e ímãs; confluência; líderes de mercado antecipam o índice."],[4,"s",[],"L1/L2/L3 (H1/H2/H3), duas puxadas, pernas 1=2 e três puxadas."],[0,"s",[],"Sinal de força: primeira perna longa, barras de tendência, rompe pontos de swing e média móvel; sinal forte obrigatório."],[37,"c",[],"Reversão tem 40-50% de acerto com recompensa 2x+ o risco; exemplo 4 pontos x stop de 2; avaliar probabilidade, risco e recompensa."],[39,"s",[],"Stop de swing ideal além do início do spike; mova o stop atrás de cada extremo de swing; breakeven após o movimento."],[40,"s",[],"Alvos: máxima da barra de baixa, movimento projetado igual à altura, 10+ barras e duas pernas; swing de parte da posição."],[42,"s",[],"Distinguir reversão (swing) de scalp contra tendência com equação ruim; em lateralidade scalpar, em reversão real segurar."],[43,"s",[],"Armadilha de L1/L2/L3 (H1/H2/H3) falho; entre pequeno a mercado ou em correção de 1-2 ticks com stop largo quando estiver preso fora."],[44,"s",[],"Operar contra a tendência só com sinal perfeito; esperar primeiro higher low/lower high; reduzir ânsia por operar."],[38,"s",[],"Institucionais compram a limit abaixo de barras e a mercado no spike; stop acima do high 2 para quem entra tarde."]],"secs":[["Rompimentos x reversões: força relativa e flag",[23,10]],["Instituições, algoritmos, suporte/resistência e notícias",[29]],["Inércia da tendência; reversão = lateralidade; scalp contra tendência em canal",[28,24,8]],["Definição de reversão: quebra de linha, teste do extremo, higher/lower low",[28,32,10,26]],["Psicologia do teste: bulls e bears após forte movimento, segunda perna esperada",[28,9]],["Correções em nova tendência e fim de tendências por canal",[7,27,21]],["Comprar a favor da correção e fade de barra de baixa grande; não ser ansioso por reversões",[8,7]],["Grandes players no spike e micro scalps: entrar onde os perdedores saem",[18,7,12]],["Reversão forte: sinais de força, armadilha low 1/2 falho e entrar preso fora",[30,28,27]],["Melhor reversão, segunda entrada, OCO e topos duplos como bandeiras",[7,26,30]],["Reversões em lateralidade, distribuição/acumulação, climáticas, rally até o fechamento, líderes do mercado",[29,33,22]],["Matemática da reversão: 60% para 2 pernas e 10 barras, ~40% iniciais, exemplo de 16 pontos em 10 trades",[28]],["Fig PI.1 e PI.2: OCO mensal no Dow, linhas duelando, líderes do S&P",[26,32]],["Fig PI.3: Emini diário, cunhas, falhas de rompimento e correções de rompimento",[27,10,23,25,26]],["Fig PI.4: clímax de compra consecutivos e fundo em lateralidade (GS)",[29,22,27]],["Fig PI.5: incerteza antes de MTR; bulls e bears com equação positiva",[28,14,30,26]]],"tr":["Experientes colocam compra a limit na mínima de barra de sinal de baixa fraca em tendência de alta, ou compram a stop acima da barra anterior na correção.","Em alta forte, comprar correções rasas com limit abaixo de barras e acima de high 2 é mais lucrativo do que vender topos.","Fundo de lateralidade após quebra de linha: comprar a stop acima de barra de sinal de alta com stop sob a mínima, cerca de 60% de chance (GS, risco 66 centavos).","Em spike forte com várias barras, grandes players entram a mercado ou em correção de 1-2 ticks; se preso fora, entrar pequeno com stop largo.","Swing de reversão: alvo de pelo menos 2x o risco, stop em breakeven após o movimento chegar a cerca de 2x o stop; 40-50% de acerto.","Gerenciamento de scalp: eles exigem risco quase igual à recompensa, portanto ~60%; contra tendência em canal perde-se cerca de 70% das vezes."],"q":"ok","parts":[]},{"id":"l3c309","k":"livro","bk":3,"cap":309,"part":true,"t":"Parte II: introdução (Day Trading)","pg":309,"o":17.5,"why":"","res":"Abertura breve da Parte II: escolha de mercado e gráfico (5 min é o mais usado), por que evitar scalps de 1-2 pontos no início, foco nos 2-5 melhores trades por dia e aumentar tamanho em vez de adicionar setups fracos.","L":[[9,"s",[1,3],"Melhores entradas diárias: segundas entradas como reversões em novos extremos de dias sem tendência (~80% dos dias) e spikes e correções em dias de tendência."],[22,"s",[1],"Em dias sem tendência, reversões em novos extremos de swing por segunda entrada são as principais operações."],[1,"s",[],"Distingue dias sem tendência (~80%) de dias de tendência para escolher o tipo de entrada."],[42,"c",[],"Scalps de 1-2 pontos exigem alta taxa de acerto; evite até ser experiente; foque em swings das melhores entradas."],[44,"c",[],"Primeiro seleção de trades, depois tamanho de posição; gráfico 5 min com 3 min mais trades e menor taxa de acerto."],[37,"s",[],"Menor risco por trade no day trade justifica maior tamanho; lucro nominal por contratos."]],"secs":[],"tr":["Gráfico de 3 minutos tem preço similar ao de 5, com mais trades e stops menores, mas taxa de acerto menor; ficar no 5 minutos se perder trades.","Depois de consistente, aumentar o tamanho em vez de adicionar setups de menor probabilidade; foco em 2 a 5 melhores entradas por dia."],"q":"ok","parts":[]},{"id":"l3c387","k":"livro","bk":3,"cap":387,"part":true,"t":"Parte III: introdução (A primeira hora)","pg":387,"o":20.5,"why":"","res":"Abertura da Parte III: a primeira hora (range de abertura) é o momento mais fácil de ganhar e de perder; ensina reversões a limit/scalp versus swing, always in claro, a matemática do 1ª barra, relatórios, gráficos de 3/5 min e exemplos de barbwire.","L":[[34,"c",[1,2,3,4,5,6],"Características da primeira hora, reversões comuns, swing em 40-50% com 2-3x risco, stops maiores com tamanho menor, e erros ao tratar swing como scalp."],[36,"s",[1,2],"Always in no fechamento de ontem tende a continuar na abertura; canal das últimas horas é bandeira; gaps e rompimentos ligados ao dia anterior."],[35,"s",[1,2,3],"Abertura em gap grande: primeira barra forte tem 50% de chance de ser extremo; entrar cedo e tentar swing; reversão pode virar dia de range."],[26,"s",[2],"Máxima do dia costuma começar com topo duplo imperfeito; mínima, com fundo duplo imperfeito, base para o swing."],[23,"s",[1,3],"A maioria dos rompimentos na abertura falha; scalpers vendem alto/compram baixo e esperam falha da primeira barra com tails."],[24,"s",[1,2,6],"Barbwire nos primeiros 90 min leva a dia de lateralidade com swings nos dois lados; primeira barra doji em range apertado, média plana."],[8,"s",[3,4,5],"Após duas barras de alta fortes e doji, comprar a limit na mínima do doji, esperando que a venda falhe; risco ~2 pontos para 2."],[10,"e",[2,3],"Reversão de abertura que falha vira correção de rompimento (Fig PIII.1 barra 3-4: topo duplo de baixa)."],[17,"s",[1,3],"Tendência desde a abertura em gap: entrar cedo e manter parte da posição; primeiras barras mostram o tom do dia."],[14,"e",[2],"As primeiras barras podem ser o spike de dia de impulso e canal; Fig PIII.3 mostra clímax e spike e canal."],[33,"e",[2],"Dia de range que fecha no extremo da faixa é dia de reversão no diário (Fig PIII.4)."],[30,"e",[2],"Pequeno final flag na primeira correção permite spike oposto e tendência inversa."],[6,"s",[],"Primeira hora dura 15 min a 2 h; máxima ou mínima do dia costuma ocorrer nela; relatórios às 7h PST; barras maiores exigem stops maiores."],[1,"s",[],"Always in claro é a chave; abertura mostra tipo de dia; lateralidade versus tendência."],[0,"s",[],"Doji e barras com tails no começo apontam para dia de duas mãos; barras de tendência consecutivas dão viés de scalp."],[5,"s",[],"Aberturas com gap estão presentes na maioria dos dias e alteram probabilidade da primeira barra."],[37,"c",[],"Swing 40-50% com 2-3x o risco versus scalp que exige 60%+; primeira barra ~20% de chance de ser extremo."],[42,"c",[],"Principal causa de perda é confundir scalp e swing; decidir o gerenciamento antes de entrar; não scalpar na primeira hora se iniciante."],[39,"s",[],"Stop além da barra de sinal, que pode ter o dobro do usual; reduzir tamanho pela metade ou um quarto; breakeven após 2x o stop."],[40,"s",[],"Alvo pelo menos igual ao risco, de preferência 2x; manter parte para swing; reduzir meta se premissa enfraquece."],[44,"s",[],"Foco intenso por uma hora; reduzir variáveis; esperar always in; não competir com computadores logo após relatório."],[38,"s",[],"Entrar a mercado ou em correção pequena quando always in claro; limit em doji de barra fraca; evitar ordens na divulgação por slippage."],[41,"s",[],"Alguns escalam além da primeira barra com sombras; scalpers saem da primeira entrada em breakeven e das demais com lucro."]],"secs":[["Características da primeira hora (lista) e relatórios",[34]],["Por que é fácil perder: variáveis demais, swing x scalp, reduzir tamanho",[34]],["Scalp de correção após barras fortes e erros de psicologia",[8,23]],["Padrões iguais aos do resto do dia; dia anterior e máxima/mínima do dia",[36,26,34]],["Segunda barra, probabilidade ~20% da primeira barra e gaps",[35,34]],["Por que o mercado reverte na abertura: vácuo de compra, suporte, institucionais",[34,29]],["Relatórios, programas e HFT: esperar 1-10 min",[34]],["Foco, gráfico de 5 vs 3 min, feriados, terceira barra e 15 min",[34]],["Barbwire e primeira barra mostram o tom do dia; confluência de padrões",[24,34,35]],["Fig PIII.1: reversão de abertura falha e correção de rompimento",[34,10,26]],["Fig PIII.2: primeiras barras dão o tom; duplo topo e fundo do dia",[34,26,36]],["Fig PIII.3: não scalpar ações de pequeno range; spike e clímax",[14,26]],["Fig PIII.4: barbwire inicial leva a dia de range",[24,33]]],"tr":["Após duas barras de tendência fortes e um doji, comprar a limit na mínima do doji; risco ~2 pontos por 2 pontos se a probabilidade for ~60%.","Na primeira hora, a maioria dos operadores deve esperar always in claro e então entrar a mercado ou em correção; swings com alvo ao menos 1x e de preferência 2x o risco.","Máxima ou mínima do dia costuma ter apenas 40-50% de chance, mas recompensa 2-3x o risco; mover stop para breakeven quando movimento chega a ~2x o stop.","Barras grandes exigem stop além da barra de sinal e metade a um quarto do tamanho; sem aceitar stop maior, não operar.","Scalp ou swing deve ser decidido antes da entrada; duração do trade: scalp tem 70% de chegar no alvo curto, 40% no de swing."],"q":"ok","parts":[]},{"id":"l3c461","k":"livro","bk":3,"cap":461,"part":true,"t":"Parte IV: introdução (Juntando Tudo)","pg":461,"o":119.5,"why":"","res":"Abertura muito curta da Parte IV: price action reflete a natureza humana e vale em qualquer mercado e tempo gráfico; apresenta exemplos detalhados, melhores operações e diretrizes. Também inclui comentário final do cap 20 sobre gap de abertura grande.","L":[[35,"s",[1,6],"Sombra do cap 20: gap grande sem reversão forte favorece a favor da tendência (60% ou mais de chance de 20 pontos); risco ~6-10 pontos."],[44,"s",[],"Apresenta o objetivo da Parte IV: melhores trades para iniciantes e diretrizes de decisão e gerenciamento."]],"secs":[],"tr":[],"q":"ok","parts":[]}],"SG":[{"id":"ai_clear","g":"always_in","t":"Direção clara: urgência para comprar (ou vender) e a correção esperada não vem","w":{"c_trend_strong":2,"m_late_entry_trend":2,"c_channel_tight":2,"c_range":-2,"c_range_tight":-3}},{"id":"ai_flip","g":"always_in","t":"Barra forte contra a tendência rompeu vários fechamentos e extremos, sem fechamento de volta na barra seguinte","w":{"c_reversal":2,"c_trend_strong":-2,"c_breakout":2,"m_mtr":2}},{"id":"ai_none","g":"always_in","t":"Barra forte sem continuidade de segunda ou terceira barra, o eakout","m_range_fade"],"nota":"Rompimento devolvido: o lado contrário na lateralidade tem a melhor localização (de volta ao range, alvo no meio)."},"fonte":[{"livro":2,"cap":5,"linha":4177},{"livro":3,"cap":5,"linha":5323}],"status":"parcial"},{"id":"L_botest","r":{"t":"Teste de rompimento: a favor","ent":"Ordem stop 1 tick além da barra de sinal formada no teste; ou limite perto do ponto de rompimento.","stop":"Além do extremo do teste, no lado do stop, ou do ponto de entrada original.","prem":"Quem já está posicionado e quem perdeu o rompimento entram a favor na região do teste.","alvo":"Retomada até a extremidade do rompimento e movimento projetado.","falha":"O teste fecha de volta além do ponto de rompimento com barra forte: o rompimento falhou.","pad":["m_breakout_pullback","m_measured_move"],"nota":""},"fonte":[{"livro":2,"cap":5,"linha":4122},{"livro":2,"cap":5,"linha":4147}],"status":"apoiado"},{"id":"L_waitbo","r":{"t":"Rompimento incerto: espere","ent":"Espere continuidade forte, teste de rompimento ou falha clara. Modo de rompimento: setups nos dois lados.","stop":"—","prem":"—","alvo":"—","falha":"Entrar a stop no primeiro sinal sem direção.","pad":["m_breakout_mode_inflection"],"nota":""},"fonte":[{"livro":2,"cap":22,"linha":13061},{"livro":2,"cap":0,"linha":2056}],"status":"apoiado"},{"id":"L_mm_bo","r":{"t":"Rompimento já cumpriu o movimento projetado: não persiga","ent":"Não entre a mercado nem em nova barra a favor do rompimento. Espere (1) uma correção com barra de sinal a favor, entrando só se o rompimento mantiver continuidade forte; ou (2) o teste do ponto de rompimento; ou (3) a volta ao range, que vira entrada contra o rompimento.","stop":"Além da barra de sinal da correção. Entrar a mercado no impulso deixa o stop longe e o alvo curto.","prem":"Cumprido o movimento projetado, muitos realizam lucro e o mercado costuma pausar; o ímã do meio da lateralidade ainda puxa de volta.","alvo":"Scalp na correção. Se voltar ao range, meio da lateralidade. Não conte com novo movimento projetado.","falha":"Entrar no extremo do range, a favor da direção que levou até ele, depois do alvo cumprido: sem espaço, e a maioria dos rompimentos de lateralidade falha.","pad":["m_measured_move","m_breakout_pullback","m_failed_breakout","m_range_fade"],"nota":"Escalas divergem: contexto maior é lateralidade (entrar contra perto de cada borda) e o recente é rompimento com continuidade. Entrar a favor do rompimento ali contraria a lateralidade e já gastou o movimento projetado; só vale esperar a correção ou o teste do rompimento."},"fonte":[{"livro":2,"cap":7,"linha":5881},{"livro":2,"cap":7,"linha":6020},{"livro":2,"cap":2,"linha":3158},{"livro":2,"cap":17,"linha":9346},{"livro":3,"cap":24,"linha":14001},{"livro":3,"cap":16,"linha":10459},{"livro":2,"cap":20,"linha":11578}],"status":"parcial"},{"id":"R_mov","esc":"espaco","q":"Há movimento forte recente a favor de um dos lados (barras de tendência com continuidade, correções curtas) e espaço de ao menos cerca de 1x o risco até o alvo mínimo do cenário recente (a borda à frente ou o último extremo de swing)?","y":"L_midmov","n":"L_wait2","why":"No meio de uma lateralidade ampla a entrada a favor de um movimento forte pode valer, desde que haja espaço até o alvo mínimo. Entrar contra no meio não: a chance fica perto de 50%. Cenário de movimento forte a favor (chance estimada perto de 60%): 1x o risco já fecha a equação. Se houver dúvida sobre a força, use 2x.","fonte":[{"livro":2,"cap":2,"linha":3130},{"livro":2,"cap":2,"linha":3158},{"livro":2,"cap":20,"linha":11469},{"livro":3,"cap":24,"linha":14430}],"status":"sintese","sy":"Espaço: movimento forte e 1x o risco ou mais até o alvo mínimo","sn":"Espaço: sem movimento forte ou sem espaço"},{"id":"L_midmov","r":{"t":"Meio do range, a favor do movimento forte: entrada com alvo mínimo","ent":"A favor do movimento forte, após uma correção curta ou no fechamento de uma barra de tendência: limite 1 a 3 ticks além do extremo da barra anterior no lado do stop. Posição pequena.","stop":"Além do último extremo de swing contra a operação, no lado do stop.","prem":"Movimento forte tem inércia mesmo dentro do range; no meio há espaço até a borda à frente, que é o alvo mínimo.","alvo":"Alvo mínimo do cenário recente: realize antes da borda à frente. Não projete movimento maior que o range.","falha":"Entrar sem os 1x de espaço; segurar até a borda e devolver o lucro; entrar contra o movimento só por estar no meio.","pad":["m_tight_channel","m_breakout_pullback"],"nota":"Escalas: o contexto maior é lateralidade sem lado; o movimento recente fornece o lado. A localização (meio) só permite porque há espaço até o alvo mínimo."},"fonte":[{"livro":1,"cap":16,"linha":8770},{"livro":1,"cap":16,"linha":8780},{"livro":1,"cap":15,"linha":7626},{"livro":3,"cap":24,"linha":14001}],"status":"sintese"},{"id":"F_room","esc":"espaco","q":"Há ao menos cerca de 2x o risco de espaço (reversão, chance perto de 40%) entre a barra de sinal e o meio do range ou a borda oposta?","y":"L_fade","n":"L_noroom","why":"Reversão (chance estimada perto de 40%): precisa de ao menos 2x o risco para a equação fechar. Brooks: com 40 a 50% de acerto busque lucro de 2x o risco ou mais.","fonte":[{"livro":3,"cap":0,"linha":489},{"livro":1,"cap":6,"linha":5327}],"status":"parcial","sy":"Espaço: 2x o risco ou mais (reversão, ~40%)","sn":"Espaço: menos de 2x o risco"},{"id":"F_mtr","esc":"espaco","q":"Há ao menos cerca de 2x o risco de espaço (reversão, chance perto de 40%) até o primeiro alvo: linha de tendência, média ou swing anterior?","y":"L_mtr","n":"L_noroom","why":"Reversão (chance estimada perto de 40%): precisa de ao menos 2x o risco para a equação fechar. Brooks: com 40 a 50% de acerto busque lucro de 2x o risco ou mais.","fonte":[{"livro":3,"cap":0,"linha":489},{"livro":1,"cap":6,"linha":5327}],"status":"parcial","sy":"Espaço: 2x o risco ou mais (reversão, ~40%)","sn":"Espaço: menos de 2x o risco"},{"id":"F_bo","esc":"espaco","q":"Há ao menos cerca de 2x o risco de espaço (falha de rompimento, chance perto de 40%) de volta para dentro do range, até o meio ou a borda oposta?","y":"L_failbo","n":"L_noroom","why":"Reversão (chance estimada perto de 40%): precisa de ao menos 2x o risco para a equação fechar. Brooks: com 40 a 50% de acerto busque lucro de 2x o risco ou mais.","fonte":[{"livro":3,"cap":0,"linha":489},{"livro":1,"cap":6,"linha":5327}],"status":"parcial","sy":"Espaço: 2x o risco ou mais (reversão, ~40%)","sn":"Espaço: menos de 2x o risco"}],"regras":[{"texto":"Rompimento forte: barra grande de tendência com sombra pequena, 2 a 3 barras seguintes com corpo pelo menos médio, impulso de 5 a 10 barras sem correção maior que 1 barra. A fórmula '1 grande, 2-3 médias ou 5-7 pequenas' não consta.","fonte":[{"livro":2,"cap":2,"linha":2948},{"livro":2,"cap":2,"linha":2955}],"status":"nao_encontrado"},{"texto":"A primeira correção de um rompimento forte só vem após 3 ou mais barras, dura 1 a 2 barras, não parte de barra de reversão forte e não chega ao ponto de rompimento.","fonte":[{"livro":2,"cap":2,"linha":2978},{"livro":2,"cap":2,"linha":2979},{"livro":2,"cap":2,"linha":2981}],"status":"apoiado"},{"texto":"Lateralidade que vale operar deve permitir um scalp com folga. Referência: com range diário de 10-15 pontos, até 3 pontos é estreita. O limite '2x um scalp' é inferência, não está escrito.","fonte":[{"livro":2,"cap":22,"linha":13019},{"livro":2,"cap":20,"linha":11858}],"status":"parcial"},{"texto":"Não existe regra de 'correção com menos de 20 barras'. O 20 é só guia da barra de gap da média, 'nada mágico'. Escada de correções: H2 em 5-10 barras, cunha em 5-15, mais de 10 barras com mínima mais baixa é sinal de fraqueza.","fonte":[{"livro":2,"cap":13,"linha":8427},{"livro":2,"cap":11,"linha":7597}],"status":"contradito"},{"texto":"Retração de 33% a 50% não é regra do livro. Brooks usa 50% como referência (acima disso a retomada fica ~50%) e 75% ou mais reduz muito a chance de retestar o extremo.","fonte":[{"livro":3,"cap":3,"linha":3357},{"livro":1,"cap":0,"linha":1383}],"status":"nao_encontrado"},{"texto":"Cerca de 80% das tentativas de reverter uma tendência falham e viram bandeira; a favor da tendência, entre na correção.","fonte":[{"livro":1,"cap":17,"linha":9536},{"livro":2,"cap":7,"linha":5953},{"livro":3,"cap":25,"linha":16103}],"status":"apoiado"},{"texto":"Cerca de 80% das tentativas de romper uma lateralidade falham; por isso, compre perto do fundo e venda perto do topo, com alvos limitados.","fonte":[{"livro":1,"cap":17,"linha":9541},{"livro":2,"cap":21,"linha":12679},{"livro":2,"cap":20,"linha":11890}],"status":"apoiado"},{"texto":"Canais: não há '75% de rompimento na direção oposta'. O livro diz que canais são bandeiras e em geral rompem a favor da tendência; cerca de 80% das tentativas de romper o canal falham.","fonte":[{"livro":1,"cap":21,"linha":11535},{"livro":1,"cap":15,"linha":8512}],"status":"contradito"},{"texto":"MTR exige tendência, quebra da linha, teste do extremo e segunda reversão forte. Entrada antecipada tem 40 a 50% de acerto e reward de ao menos 2x o risco; 2:1 é mínimo, não alvo fixo.","fonte":[{"livro":3,"cap":3,"linha":2943},{"livro":3,"cap":3,"linha":2930}],"status":"parcial"},{"texto":"Swing: realizar cerca de metade a 2x o risco e um quarto a 3x, deixando o resto correr. Scalp: parcial de 25-75% entre 1x e 2x. Metade a 1:1 no swing não é o ensinado.","fonte":[{"livro":2,"cap":30,"linha":18807},{"livro":2,"cap":24,"linha":14657}],"status":"contradito"},{"texto":"Saia ao disparar sinal oposto ou quando a premissa deixar de valer (teste: entraria agora, sem posição?). A escala '1 grande, 2-3 médias, 3-5 pequenas' não consta; o livro cita 4 barras seguidas ou 2-3 grandes como momento forte demais para operar contra.","fonte":[{"livro":2,"cap":30,"linha":18730},{"livro":2,"cap":30,"linha":18822},{"livro":1,"cap":10,"linha":6561}],"status":"parcial"},{"texto":"Canal amplo/escada: operar dos dois lados, com parte a favor. Compre perto da base e venda perto do topo; a regra de 2/3 inferiores e superiores não consta (em lateralidade, o livro fala em metade inferior).","fonte":[{"livro":1,"cap":26,"linha":14717},{"livro":1,"cap":15,"linha":7626}],"status":"nao_encontrado"},{"texto":"Correção muito longa sugere que a tendência virou (diretriz 18), mas isso não vale como MTR por si só: faltam quebra da linha, teste do extremo e segunda reversão.","fonte":[{"livro":3,"cap":25,"linha":16086},{"livro":3,"cap":3,"linha":2943}],"status":"parcial"},{"texto":"Gap de abertura grande (maior que cerca de metade do range diário médio) aumenta a chance de dia de tendência; opere a abertura como qualquer rompimento e faça swing de parte da posição.","fonte":[{"livro":3,"cap":20,"linha":12095},{"livro":3,"cap":20,"linha":12100}],"status":"apoiado"},{"texto":"Dois climaxes seguidos formam topo duplo, três formam cunha; espere correção de cerca de 10 barras e duas pernas antes de operar a favor.","fonte":[{"livro":3,"cap":4,"linha":3996},{"livro":3,"cap":5,"linha":5099}],"status":"apoiado"},{"texto":"Lateralidade estreita se sobrepõe a qualquer motivo de entrada: evite entradas a stop dentro dela.","fonte":[{"livro":3,"cap":25,"linha":16257},{"livro":2,"cap":22,"linha":13019}],"status":"apoiado"},{"texto":"Sempre mantenha stop de proteção no mercado ao entrar.","fonte":[{"livro":3,"cap":25,"linha":16111}],"status":"apoiado"},{"texto":"Em lateralidade, a conduta básica é comprar perto do fundo, vender perto do topo e fazer scalp; as probabilidades favorecem o lado oposto à borda onde o preço está.","fonte":[{"livro":2,"cap":20,"linha":11431},{"livro":2,"cap":20,"linha":12481},{"livro":2,"cap":21,"linha":12677},{"livro":3,"cap":24,"linha":13979},{"livro":3,"cap":11,"linha":8326}],"status":"apoiado"},{"texto":"Não comprar spike forte perto do topo nem vender spike forte perto do fundo da lateralidade; vender L1 no fundo do range é perdedor (pode ser a bandeira final da perna). A expressão 'bad location' não aparece nos livros; o conceito está nestas passagens.","fonte":[{"livro":3,"cap":24,"linha":14001},{"livro":3,"cap":25,"linha":16082},{"livro":2,"cap":17,"linha":9346},{"livro":3,"cap":16,"linha":10429}],"status":"parcial"},{"texto":"Meio da lateralidade: área de valor para compradores e vendedores, probabilidade neutra, ímã que puxa o preço de volta mesmo depois de um movimento projetado.","fonte":[{"livro":2,"cap":2,"linha":3130},{"livro":2,"cap":2,"linha":3158},{"livro":2,"cap":20,"linha":11469}],"status":"apoiado"},{"texto":"Entrar a favor colado em suporte ou resistência do contexto maior: o livro pede entrada longe do topo do canal e sem espaço não há scalp; níveis grandes raramente param tendência, mas toda reversão ocorre em um. A regra do guia (evitar entrar colado) é inferência dessas passagens.","fonte":[{"livro":1,"cap":15,"linha":7741},{"livro":1,"cap":15,"linha":8101},{"livro":3,"cap":0,"linha":1641},{"livro":3,"cap":5,"linha":5694}],"status":"parcial"},{"texto":"Trader's equation e espaço: chance de sucesso x lucro deve superar chance de falha x risco; em swing busque lucro de ao menos 2x o risco (chance 40-50%); com 1x a chance precisa estar perto de 60%. 'Cerca de 2x o risco de espaço' como filtro de entrada é adaptação do guia.","fonte":[{"livro":3,"cap":0,"linha":489},{"livro":1,"cap":0,"linha":2373},{"livro":3,"cap":15,"linha":9450},{"livro":3,"cap":24,"linha":14941}],"status":"parcial"},{"texto":"Após o movimento projetado ser cumprido, muitos realizam lucro e o resultado costuma ser pausa, correção ou lateralidade. Brooks diz que a maioria dos movimentos projetados não leva a reversão; logo o guia não promete reversão.","fonte":[{"livro":2,"cap":7,"linha":5881},{"livro":2,"cap":7,"linha":6020},{"livro":2,"cap":8,"linha":6313},{"livro":3,"cap":5,"linha":5694}],"status":"apoiado"},{"texto":"Canal estreito ou micro canal dentro de lateralidade: lateralidade inclinada com efeito magnético, rompimentos duram 1 a 2 barras. Se encosta na borda, não entre no rompimento: espere continuidade e correção, ou falha (micro topo/fundo duplo). Canal de alta em lateralidade: bom na metade inferior, pior na superior.","fonte":[{"livro":1,"cap":16,"linha":8770},{"livro":1,"cap":16,"linha":8780},{"livro":1,"cap":16,"linha":8810},{"livro":1,"cap":15,"linha":7626},{"livro":3,"cap":24,"linha":14001}],"status":"apoiado"},{"texto":"Rompimento de lateralidade: ~80% das tentativas falham e cinco a dez tentativas fortes podem falhar antes de um sucesso; mas se o contexto favorece e há continuidade forte, entre na correção. Depois de rompimento confirmado e always in claro, vale operar a favor mesmo perto da borda.","fonte":[{"livro":2,"cap":20,"linha":11578},{"livro":2,"cap":20,"linha":12449},{"livro":3,"cap":16,"linha":10429},{"livro":3,"cap":16,"linha":10459},{"livro":3,"cap":25,"linha":16083}],"status":"apoiado"},{"texto":"Tendência dentro de lateralidade: não há capítulo com esse nome. Há lateralidade como bandeira da tendência anterior (rompe mais a favor dela, ~60%), micro canal em lateralidade e dia de lateralidade em tendência (trending trading range). O guia combina essas peças; as janelas 40-50 e 12-18 barras são do usuário.","fonte":[{"livro":2,"cap":20,"linha":11580},{"livro":2,"cap":20,"linha":11711},{"livro":1,"cap":22,"linha":12449},{"livro":3,"cap":24,"linha":14001}],"status":"parcial"},{"texto":"Alvos de 'ATR' e '2 alvos de ATR': a sigla e o conceito não aparecem nos livros; o equivalente é movimento projetado e range diário médio.","fonte":[],"status":"nao_encontrado"}]},"EN":{"itens":[{"id":"e_s_t_fraca_ok","grupo":"sinal","texto":"Pullback a favor: sinal feio é aceitável; quanto mais forte a tendência, menos importa","pol":"+","peso":2,"modelos":["tendencia"],"excl":[],"fonte":{"livro":1,"cap":4,"linha":3749},"base":"direta"},{"id":"e_s_t_corpo","grupo":"sinal","texto":"Sinal é barra de tendência a favor, abre no extremo, fecha no outro, sombras pequenas","pol":"+","peso":2,"modelos":["tendencia"],"excl":[],"fonte":{"livro":1,"cap":19,"linha":10658},"base":"direta"},{"id":"e_s_r_sombra_ok","grupo":"sinal","texto":"Reversão: sombra de um terço a metade da barra no lado do stop; outra sombra pequena","pol":"+","peso":2,"modelos":["reversao","lateralidade"],"excl":["e_s_r_sombra_ruim"],"fonte":{"livro":1,"cap":5,"linha":3858},"base":"direta"},{"id":"e_s_r_sombra_ruim","grupo":"sinal","texto":"Reversão: sombra grande do lado do alvo, ou barra bem menor que as anteriores","pol":"-","peso":2,"modelos":["reversao","lateralidade"],"excl":["e_s_r_sombra_ok"],"fonte":{"livro":1,"cap":5,"linha":3969},"base":"direta"},{"id":"e_s_r_fecha","grupo":"sinal","texto":"Barra de reversão: abre perto do fechamento anterior e fecha além dele e da própria abertura, no sentido da reversão","pol":"+","peso":2,"modelos":["reversao","lateralidade"],"excl":["e_s_r_doji"],"fonte":{"livro":1,"cap":5,"linha":3856},"base":"direta"},{"id":"e_s_r_sobrep","grupo":"sinal","texto":"Reversão: ponto médio da barra de sinal ainda dentro do extremo da anterior no lado do stop (sobreposição excessiva)","pol":"-","peso":2,"modelos":["reversao","lateralidade"],"excl":[],"fonte":{"livro":1,"cap":5,"linha":3957},"base":"direta"},{"id":"e_s_r_doji","grupo":"sinal","texto":"Reversão: base é um doji grande, que equivale a um range de uma única barra","pol":"-","peso":3,"modelos":["reversao","lateralidade"],"excl":["e_s_r_fecha"],"fonte":{"livro":1,"cap":5,"linha":3965},"base":"direta"},{"id":"e_s_l_teste_mom","grupo":"sinal","texto":"Teste da borda com corpos grandes e momentum: operar o rompimento, não o fade","pol":"-","peso":3,"modelos":["lateralidade","m_range_fade"],"excl":[],"fonte":{"livro":1,"cap":3,"linha":3466},"base":"direta"},{"id":"e_s_b_forte","grupo":"sinal","texto":"Barra de tendência forte rompe a faixa anterior e fecha além dela","pol":"+","peso":3,"modelos":["rompimento"],"excl":["e_s_b_rev_forte"],"fonte":{"livro":1,"cap":18,"linha":10543},"base":"direta"},{"id":"e_s_b_rev_forte","grupo":"sinal","texto":"Barra de reversão mais forte que a de rompimento: rompimento provavelmente falha","pol":"-","peso":3,"modelos":["rompimento"],"excl":["e_s_b_forte"],"fonte":{"livro":1,"cap":15,"linha":8016},"base":"direta"},{"id":"e_s_f_rev_forte","grupo":"sinal","texto":"Falha de rompimento: barra de reversão forte em comparação com a barra de rompimento","pol":"+","peso":3,"modelos":["m_failed_breakout"],"excl":[],"fonte":{"livro":1,"cap":15,"linha":8016},"base":"direta"},{"id":"e_n_t_antecipa","grupo":"entrada","texto":"Tendência forte: entrar antes do fechamento da barra de sinal costuma funcionar","pol":"+","peso":1,"modelos":["tendencia"],"excl":[],"fonte":{"livro":1,"cap":8,"linha":6329},"base":"direta"},{"id":"e_n_t_forte","grupo":"entrada","texto":"Barra de entrada a favor, corpo grande, fechando perto do extremo; corpo cresce no fim","pol":"+","peso":2,"modelos":["tendencia"],"excl":[],"fonte":{"livro":1,"cap":8,"linha":6376},"base":"direta"},{"id":"e_n_t_doji","grupo":"entrada","texto":"Tendência forte: barra de entrada doji ou inside é só pausa; operar o rompimento","pol":"-","peso":1,"modelos":["tendencia"],"excl":["e_n_t_forte"],"fonte":{"livro":1,"cap":8,"linha":6329},"base":"sintese"},{"id":"e_n_r_forte","grupo":"entrada","texto":"Reversão: barra de entrada de corpo grande a favor, e não um doji inside","pol":"+","peso":2,"modelos":["reversao","lateralidade"],"excl":["e_n_r_doji"],"fonte":{"livro":1,"cap":5,"linha":3864},"base":"direta"},{"id":"e_n_r_doji","grupo":"entrada","texto":"Reversão: barra após o sinal é doji ou inside, sem urgência; evitar ou sair no zero","pol":"-","peso":3,"modelos":["reversao","lateralidade"],"excl":["e_n_r_forte"],"fonte":{"livro":1,"cap":5,"linha":4191},"base":"direta"},{"id":"e_n_contra","grupo":"entrada","texto":"Barra seguinte forte contra a entrada, rompendo o sinal pelo lado errado","pol":"-","peso":3,"modelos":["todos"],"excl":[],"fonte":{"livro":1,"cap":5,"linha":4414},"base":"direta"},{"id":"e_n_r_2a","grupo":"entrada","texto":"Reversão: é a segunda tentativa, após a primeira falhar no mesmo preço ou pior","pol":"+","peso":2,"modelos":["reversao"],"excl":["e_n_r_sem_2a"],"fonte":{"livro":1,"cap":10,"linha":6546},"base":"direta"},{"id":"e_n_r_sem_2a","grupo":"entrada","texto":"Reversão em novo extremo, sem barra contrária nas sete anteriores nem segunda entrada","pol":"-","peso":3,"modelos":["reversao"],"excl":["e_n_r_2a"],"fonte":{"livro":1,"cap":19,"linha":10815},"base":"direta"},{"id":"e_n_b_follow","grupo":"entrada","texto":"Rompimento: as duas ou três barras seguintes têm corpos de tamanho médio ou maior","pol":"+","peso":2,"modelos":["rompimento"],"excl":["e_n_b_inside"],"fonte":{"livro":1,"cap":0,"linha":1764},"base":"direta"},{"id":"e_n_b_inside","grupo":"entrada","texto":"Rompimento: inside bar contrária logo após a barra grande, perda de convicção","pol":"-","peso":2,"modelos":["rompimento"],"excl":["e_n_b_follow"],"fonte":{"livro":1,"cap":6,"linha":4468},"base":"direta"},{"id":"e_n_risco","grupo":"entrada","texto":"Stop de 1 tick além da barra de sinal exige risco maior que o alvo realista","pol":"-","peso":2,"modelos":["todos"],"excl":[],"fonte":{"livro":2,"cap":29,"linha":0},"base":"sintese"}],"familias":{"tendencia":["m_pullback_stop","m_pullback_limit","m_second_entry_abc","m_late_entry_trend","m_trend_open_shallow","m_flag_double","m_breakout_pullback","m_breakout_strong","m_first_pullback_seq","m_tight_channel","m_broad_channel"],"reversao":["m_mtr","m_trendline_reversal","m_climactic_reversal","m_wedge_3push","m_double_hs","m_reversal_day","m_final_flag","m_fade_trend_bar","m_rounded","m_failed_breakout","m_spike_channel","m_magnet_vacuum","m_measured_move","m_new_high_outcomes"],"lateralidade":["m_range_fade","m_range_tight","m_triangle","m_failed_breakout","m_repeated_test_break"],"rompimento":["m_breakout_mode","m_breakout_range","m_breakout_strong","m_breakout_pullback","m_gap_open","m_gap_trade","m_ma_gap","m_open_first_hour","m_prior_day"]},"regras":{"entrar":"Soma ponderada dos itens marcados (que se aplicam ao modelo) >= 4 e nenhum item '-' de peso 3 marcado. Em tendência forte basta >= 3, pois sinal fraco pesa pouco. Stop 1 tick além da barra de sinal.","esperar":"Soma de 1 a 3, ou um '-' de peso 3 ligado à falta de continuidade (doji/inside, sem 2ª tentativa): aguardar a próxima barra ou a segunda tentativa. Barra de sinal ainda aberta: esperar o fechamento, exceto em tendência forte.","pular":"Soma <= 0, ou item e_n_contra marcado, ou e_s_r_doji / e_s_b_rev_forte (peso 3) sem reversão da leitura, ou e_n_risco com soma < 5."}},"PL":{"m_second_entry_abc":{"3":[["H2/L2: primeira barra que rompe o extremo da anterior, a favor da tendência, após a segunda perna da correção.",0],["H2/L2: espelhos um do outro; a primeira barra que rompe o extremo da anterior após duas pernas da correção contra a tendência.",1],["Em barra de sinal que se alongou no último instante, preferir a segunda entrada; só entrar antes com muitos traders presos.",4],["Barra de reversão com sombra grande no lado do alvo: operar só se corpo for forte e houver segunda entrada.",5],["Contra a tendência, a segunda entrada com barra de reversão forte é sempre o setup mais seguro.",6]],"4":[["Se o preço rompe além do extremo da correção de duas pernas após o H2/L2, no lado do stop, espere ao menos mais uma perna.",0],["Após entrar, mova o stop de além da barra de sinal para além da barra de entrada, no lado do stop.",0],["Se a segunda entrada oferece preço melhor que a primeira, trate como alerta de que você lê o gráfico errado; considere não operar.",10]],"5":[["Scalp de 4 ticks só é executado se o preço fizer 6 ticks além da barra de sinal, no lado do alvo; parcial e resto no breakeven.",0],["Segundo extremo em dia lateral rende ao menos lucro de scalp pois o meio do dia atua como ímã",17]],"6":[["H4/L4 que falha e rompe o extremo do lado do stop indica swing contrário; esperar mais price action antes de operar.",0],["Sinal contra tendência com momentum muito forte (quatro ou mais barras seguidas) costuma falhar; segunda entrada pode nem surgir, e esperar evita a perda.",10],["Padrões confiáveis falham cerca de 40 por cento das vezes e frequentemente evoluem para padrões maiores com entradas em ambas as direções.",12],["Quando a leitura não estiver clara ou o padrão tiver pernas confusas, não opere; outra entrada mais clara virá.",20]]},"m_wedge_3push":{"3":[["H3/L3 ao fim da terceira perna, normalmente cunha de bandeira, entrada no rompimento da barra anterior.",0],["Entrar na segunda tentativa de reverter o rompimento da linha, se falhar em ultrapassar a trend channel line de uma cunha.",13],["Operar a reversão após rompimento da trend channel line, em especial na segunda penetração, depois que a perna contra se confirma.",14],["Entrar na reversão de terceira puxada com cunha que ultrapassa a linha do canal e fecha em barra de reversão forte, sobretudo segunda entrada.",21],["Após cunha de reversão, é mais seguro entrar num swing com extremo menos extremo que o da cunha, ou além da falha do sinal H2/L2 contrário.",24]],"5":[["Alvo mínimo da reversão após o overshoot é testar o outro lado do canal.",14],["Movimento após cunha deve ter ao menos duas pernas até testar o extremo da cunha.",24],["Cunha de reversão que falha leva a movimento medido de cerca da altura da cunha, na direção da tendência.",26]],"4":[["Se precisar redesenhar a trend channel line repetidamente porque a tendência acelera, não opere a reversão; opere a favor.",14]],"6":[["Reversão em overshoot com linhas distantes e puxadas muito próximas é de qualidade ruim, mas vale se a barra de sinal for pequena.",14],["Em canal, esperar reversão antes da terceira perna; contra-tendência cedo em canal forte costuma dar perdas repetidas",15]]},"m_trendline_reversal":{"3":[["Reversão confiável: romper linha de tendência com momentum e depois testar o extremo; divergência sozinha perde.",0],["Contra tendência forte: espere a barra de sinal fechar e entre em stop um tick além do extremo dela.",0],["Contra tendência forte, esperar quebra da linha de tendência e só entrar com forte barra de reversão no teste do extremo.",4],["Risco é a outra ponta da barra de reversão e o ganho é vários múltiplos: stop um tick além, alvo de 20 ticks ou mais.",6],["Esperar o fechamento da barra de sinal e entrar em stop além dela; entrada antecipada ganha ~1 tick e perde ~8 de vez em quando.",8]],"4":[["Se o teste do extremo antigo rompe e a tendência antiga retoma, a reversão falhou; divergência não basta.",0],["Reversão sem teste do extremo antigo não gera convicção; se a barra sobrepõe as anteriores, não é sinal.",5],["Doji como barra de entrada de sinal fraco: tentar sair perto do zero; colocar o stop além do doji, no lado do stop, dá 50-50 de ser pego.",5],["Não entrar em reversão numa barra externa a menos que a barra anterior fosse um sinal decente.",7],["Em reversão forte no 5 min, stop além da barra de sinal (cerca de 3 pontos no Emini), meia posição e deixar metade para swing.",8]],"6":[["Não entrar em barra de reversão de 1 minuto: a maioria falha e vira setup a favor; muitos stops curtos corroem a conta.",5],["Reversão de duas barras sobre a média com barras grandes sobrepostas costuma falhar fora de tendência forte; não entrar além do extremo da barra de sinal no lado do alvo.",6],["Stops de 3 min são varridos em reversões importantes; operar em um só gráfico evita ser expulso da operação boa.",8],["Maioria dos rompimentos de linha de tendência falha e a tendência retoma após teste; o rompimento só é o primeiro aviso.",13]],"5":[["Após rompimento da linha, o primeiro objetivo é testar o extremo da tendência, com extremo menor ou maior que o anterior.",13]]},"m_breakout_strong":{"5":[["Em rompimento forte, alvo menor que a altura do rompimento tem probabilidade de 60% ou mais contra stop do mesmo tamanho.",0],["Movimento medido do extremo de origem ou abertura da primeira barra até o fechamento ou extremo oposto da última do spike.",2]],"4":[["Após rompimento, inside bar pequena e depois barra além dela aumenta bastante a chance de falha e reversão.",0],["Com outra barra forte a favor, mover stop para breakeven ou além do extremo dela e segurar até o fechamento.",2]],"3":[["Entrar a favor no fechamento da barra de spike forte (ou da anterior) com stop além do extremo da barra de sinal; pouca posição se com medo.",2]]},"m_first_pullback_seq":{"5":[["Tendência de muitos pontos em poucas barras tem correção; depois costuma testar e superar o extremo.",0]],"6":[["Se a correção retrai 75% ou mais, a chance de voltar ao extremo cai; pense em nova tendência oposta.",0],["Retração de Fibonacci de 62% da primeira correção não é confiável para ordem limite de entrada.",0]],"3":[["Entrar a favor na primeira correção após pico forte, além da barra que foi mais longe contra a tendência (H1/L1), com instituições adicionando",17],["Em tendência da abertura, entrar a favor na primeira correção: limite no extremo da barra anterior no lado do stop ou stop um tick além de H1/H2 ou L1/L2.",23],["Em correções pequenas, entrar a favor com limite a 5 a 7 ticks do extremo do dia no lado do alvo, se a maior correção foi de 8 ticks.",23]],"4":[["Se a correção for grande demais, trate como zona lateral; cuidado com a probabilidade de swing",17]]},"m_breakout_range":{"6":[["Em lateralidade a maioria das tentativas de rompimento falha; em tendência a maioria das reversões falha.",0],["Entrar no rompimento de barra externa grande em 5 min é arriscado pelo stop distante; melhor evitar o rompimento.",7]],"4":[["Se entrou no rompimento e o stop é grande, usar stop em dinheiro (ex.: 2 pontos no Emini) ou menos contratos.",7]],"3":[["Em tendência forte seguida de faixa longa, esteja pronto para entrar no rompimento a favor da tendência no final do dia.",25]],"5":[["Segunda perna costuma ter o tamanho da primeira, então segure parte da posição para swing.",25]]},"m_climactic_reversal":{"6":[["Barra de sinal de reversão pode inverter nos últimos segundos e fechar no extremo oposto, prendendo quem entrou antes.",0],["Terceiro clímax consecutivo costuma ser seguido por correção ainda maior; não vá com a tendência nesse ponto.",24]],"3":[["Entrar a mercado ao fechar a barra enorme contra a tendência, ou além da barra seguinte, perto de suporte ou resistência.",2],["Operar a reversão do clímax só após o rompimento da trend channel line ou a correção de uma forte quebra de linha; esperar sinal convincente.",14],["Entrar na forte reversão após ultrapassar a linha do canal no lado do alvo, ou no swing seguinte que falhe em igualar o extremo anterior",15],["Em micro canal de 10 barras, clímax com forte barra de reversão permite entrada contra; use correção do rompimento",16],["Entrar contra no fechamento ou além do extremo de enorme barra de tendência climática, e depois além do extremo das barras seguintes, na direção da reversão",17]],"5":[["Esperar correção de ao menos duas pernas, 10 barras, chegando um pouco além da média móvel.",2],["Após clímax sem continuação, esperar ao menos duas pernas e cerca de 10 barras de movimento contrário.",5],["Após clímax grande e pausa, esperar correção de duas pernas de ao menos 10 barras, às vezes reversão.",6],["Após três clímaxes consecutivos na mesma direção, esperar ao menos duas pernas contrárias como alvo da reversão.",10],["Esperar correção de cerca de 10 barras, duas pernas, voltando ao início do canal onde os participantes fortes entraram",15]],"4":[["Após clímax final, H1/L1 provavelmente falha; aguardar correção de duas pernas e manter stop além do extremo até a segunda perna.",21]]},"m_failed_breakout":{"3":[["Falso rompimento por volta de 11h a meio-dia (PST) após range de horas é setup de swing até o fechamento.",1],["Entrar além da barra de pausa que se segue ao rompimento: os que estavam do lado oposto saem, novos participantes entram.",2],["Entrar na reversão do rompimento falho da borda, ou na correção da primeira barra forte na direção da reversão.",3],["Entrar um tick além da barra de reversão que falhou em spike contrário: os que entraram cedo ficam presos.",6],["Se o range rompe para o outro lado, deixar passar e procurar o fade da falha do rompimento em poucas barras.",7]],"5":[["Todo rompimento, bem ou mal sucedido, é seguido por lateralidade; os dois lados buscam novo equilíbrio.",3],["Após reversão confirmada, o primeiro objetivo é um teste além do extremo do canal.",14],["Alvo mínimo: testar o lado oposto do canal; se segue, movimento medido igual à altura do canal",15]],"4":[["Se o padrão falhou e depois só andou de lado por várias barras, ignore-o e leia o novo padrão como independente.",12],["Se a faixa anterior não for tocada e o mercado fecha perto da extremidade, o dia vira reversão e o swing contra falha.",22],["Se a barra após a reversão na borda da faixa é inside bar pequena de correção, o swing pode não vir.",25]],"6":[["Em micro canal muito apertado a reversão ao outro lado é rápida demais; não há espaço para lucro, não operar",15],["Em dia de tendência, não entrar na falha da micro linha do lado da média quando o contexto é de correção contra o movimento",16],["Falha da falha gera correção do rompimento e extremo mais longe; fade do segundo extremo é mais provável",17],["Sempre há cerca de 40 por cento de chance de o inverso acontecer; retomada pode virar reversão e testar a abertura.",25]]},"m_measured_move":{"5":[["Alguns operadores buscam reversão quando a segunda perna iguala o tamanho da primeira.",1],["Após spike forte, projetar movimento medido: distância da abertura ou extremo da 1a barra até fechamento ou extremo oposto da última.",6],["Alvo mínimo do rompimento é um movimento medido igual à altura do triângulo expansivo.",13],["Altura do canal em qualquer barra, medida entre as linhas, dá a projeção menor possível após rompimento bem-sucedido",15],["Escalonar saídas em múltiplos do risco (um, dois, três) e manter a última parte até sinal forte contrário ou fechamento.",18]]},"m_fade_trend_bar":{"3":[["Sem continuação da barra forte, entrar contra no fechamento ou além do extremo dela, a favor da saída de quem estava posicionado.",2],["Entrar contra no fechamento ou além do extremo de grande barra de tendência perto do alvo medido, aumentando posição se o movimento continuar, mirando o gap.",22],["Entrar contra no fechamento da segunda barra grande de tendência ou além do extremo dela, com stop de três ou quatro pontos, esperando correção de 10 barras.",23]],"6":[["Em tendência forte, barra de reversão contra costuma falhar: exigir continuação antes de operar a reversão.",2],["Em tendência forte, entrar contra só além de barra forte contra a tendência, nunca além de barra forte a favor dela.",6],["Contra a tendência forte, só operar após ruptura de linha de tendência e boa barra de reversão, e apenas scalp.",19]],"4":[["Se perder uma entrada a favor, pare de buscar scalps contra e opere só a favor da tendência.",19]],"5":[["Sair do primeiro short no ponto de equilíbrio e levar o stop do segundo para o equilíbrio, mirando teste do gap.",22]]},"m_ma_gap":{"5":[["Puxada até a barra gap da média costuma romper a linha de tendência contrária; o movimento seguinte testa o extremo da tendência.",2],["Esperar teste do extremo da tendência, com extremo menor ou maior; barra de gap da média costuma anteceder a perna final.",19]],"4":[["Se o teste do extremo vai além do anterior, esperar ao menos duas pernas no sentido oposto; se fica aquém, ao menos mais uma.",2]],"3":[["Após o primeiro novo extremo depois de uma correção de 20 barras gap, o mercado costuma recuar e testar o extremo de novo.",11],["Depois de 11:30 entrar a favor após contra-movimento forte na barra de gap da média móvel",17],["Após 20 ou mais barras longe da média, entrar a favor na primeira correção de duas pernas até ela.",19]]},"m_spike_channel":{"3":[["Entrar na reversão além do extremo da barra do fim da cunha do canal e escalonar entradas em correções e além de barras anteriores.",3],["Após três puxadas no canal, esperar reversão com ao menos duas pernas; o movimento costuma testar o extremo e dar bandeira de duplo extremo.",14],["Em spike muito forte e em contexto favorável, entrar a mercado ou em correções pequenas durante a formação do spike.",21],["No canal apertado, entrar a favor em correções à linha de tendência, à média ou com limite no extremo da barra anterior no lado do stop.",21]],"5":[["Teste do início do canal em duas pernas, no mesmo dia (padrão pequeno) ou em um ou dois dias (maior).",3],["Canal de spike e canal tende a virar lateralidade; espere ao menos duas pernas contra e teste do extremo do canal.",12],["Micro canal tende a ser seguido por canal mais amplo, com alvo de movimento medido pela altura do micro canal",16],["Canal tende a terminar em alvo de movimento medido; usar esses níveis para realizar lucro, não para abrir reversão.",21],["Reversão do canal costuma voltar ao início do canal e tentar lateralidade, com retorno de pelo menos 25 por cento.",21]],"6":[["Em tendência forte o rompimento do canal pode seguir de lado e continuar; raramente acelera.",3],["Contratendência em canal é arriscada: canais duram mais do que se imagina e na segunda metade do dia falta tempo.",21]]},"m_breakout_pullback":{"3":[["Entrar um tick além do extremo da barra anterior na correção do rompimento, esperando retomada.",3],["Rompimento da linha do canal que reverte na primeira barra do dia mas fracassa em poucas barras abre entrada na correção do rompimento.",14],["Em canal íngreme, não entrar contra no primeiro rompimento; esperar correção do rompimento (extremo menor ou maior que o anterior) e entrar",15],["Após falha dupla (rompimento falho e depois nova falha), entrar além do extremo da barra de rompimento na segunda entrada",16],["Rompimento forte de lateralidade em dia de tendência: entrar na correção à área do rompimento com barra de reversão",17]],"4":[["Se a correção toca o stop de breakeven, o rompimento é mais fraco; se falha por um tick, novo extremo costuma seguir.",3],["Se o mercado continua no sentido contrário após o rompimento, o rompimento falhou e a tendência oposta retoma",15],["Se barras recentes são dojis, mercado deve entrar em lateralidade; se são barras de tendência, segunda entrada tem chance elevada",16]]},"m_flag_double":{"5":[["Depois do duplo extremo de bandeira vem continuação, range longo ou até tendência contrária.",3]],"3":[["Na primeira hora, opere o primeiro e o segundo padrão: entrar contra o duplo extremo quando o preço o rompe no sentido oposto, mantendo parte em swing.",12],["Entrar a favor no teste do início do canal em duplo extremo de bandeira após spike e canal na mesma direção.",21]],"6":[["Nas faixas com três puxadas não se deixe sacudir para fora: reentre a favor da tendência da manhã.",25]]},"m_pullback_stop":{"3":[["Entrar com stop um tick além da barra anterior; se não for acionado, cancelar a ordem e procurar novo local.",4],["A cada correção à região da linha, mesmo que ultrapasse ou fique aquém, procure reversão e entre a favor da tendência.",13],["Em tendência, entrar além do extremo da barra de sinal que fura o micro canal da correção (H1/L1), com stop do lado oposto dela",16],["Participantes experientes copiam as máquinas: limite a um ou dois ticks do extremo da barra anterior no lado do stop, em correções de 3 a 4 ticks",16],["Em bandeira contra o micro canal, entrar além da barra de sinal após rompimento contra o micro canal",16]],"6":[["Em ações, armadilhas de um tick são comuns: colocar a entrada alguns ticks além da barra de sinal em vez de um.",4],["Não entrar contra a tendência na micro linha de uma correção perto da média; a entrada deve falhar, entrar a favor na falha",16]],"4":[["Manter o stop inicial até a barra de entrada fechar; mover o stop a favor para além de uma barra de reversão forte pode jogá-lo fora.",8],["Stop um tick além da barra de sinal; alguns toleram correção de 50 a 75 por cento da amplitude diária média.",18],["Perda do último swing a favor da tendência e novos extremos contra ela abrem lateralidade ou reversão; sair e reavaliar.",18]]},"m_magnet_vacuum":{"4":[["Se o movimento contra a tendência até um novo extremo não teve continuação, os participantes fortes só esperavam o alvo; depois entram a favor sem parar.",5]]},"m_final_flag":{"4":[["No ii, stop além das duas barras; após o fechamento da barra de entrada, apertar o stop e considerar reverter um tick além dela.",6]],"6":[["Breakout de ii a favor logo após quebra de linha pode falhar antes ou depois do alvo; falhas são comuns em seguida.",6]],"3":[["Entrada além da barra de reversão após bandeira final e tendência contrária prolongada, visando ao menos duas pernas na direção da reversão.",10],["Entrada na falha de rompimento de micro canal em bandeira final perto da média, após barra de reversão",16]]},"m_breakout_mode":{"3":[["Em ioi ou inside após rompimento, ordem stop além de cada extremo da inside, uma para cada lado; a ordem não executada vira stop.",6],["Após ioi, entrar no rompimento da segunda inside só se houver motivo para chegar ao alvo, como segunda entrada.",7],["Em modo de rompimento, esperar o rompimento e entrar a favor; qualquer lado pode gerar movimento grande.",12],["Entrar a favor um tick além de cada extremo do intervalo de abertura, uma ordem para cada lado; alvo mínimo é o movimento medido.",13],["Faixa de abertura pequena: entrar no sentido do rompimento, normalmente a favor do gap, além do extremo da faixa.",19]]},"m_range_tight":{"6":[["Rompimento de range apertado de barras grandes falha pela atração do range; operar breakout é arriscado.",6],["Entrada além de barra grande e sobreposta em lateralidade, no sentido do rompimento, tende a render rompimento curto, puxado de volta.",13],["Em lateralidade estreita dentro de tendência, shorts são no máximo scalp; cerca de quatro ticks de risco e saída rápida.",19]]},"m_range_fade":{"3":[["Barra externa em range seguida de pequena barra perto da extremidade: operar o fade na direção oposta.",7],["Em canal largo com oscilações de 5 a 10 barras, entrar contra perto de cada borda.",15],["Em dia de lateralidade, entrar contra o fracasso de rompimento de cada extremo de swing.",17],["Evitar entrar no rompimento da faixa; preferir correção do rompimento ou reversão vinda do lado oposto da faixa.",22]],"5":[["Reversão em dia lateral deve ao menos testar o ponto médio do dia; não realizar o swing cedo demais",17]],"6":[["Em dia de tendência forte não fadar extremos sem quebra de linha de tendência e forte barra de reversão",17]],"4":[["Não arrastar stop além de extremos de oscilação em tendência de lateralidades; sair na força na borda do lado do alvo.",22]]},"m_pullback_limit":{"3":[["Após movimento com muito momentum, procurar entrar a favor num swing com extremo menos extremo ou ordem limite além do extremo da barra anterior, esperando teste do extremo da perna.",10],["Em tendência estabelecida, ordem limite de entrada a favor na linha de tendência ou um pouco além dela, no lado do stop.",13],["Em canal, entrar a favor com ordem limite alguns ticks além do extremo da barra anterior no lado do stop, stop além do último extremo de swing contra a operação",15],["Alternativa a ordens limite: entrar a favor na correção em canal além do extremo da barra de sinal H2/L2 na média móvel",15],["Em tendência forte sem tocar a média por 20 ou mais barras, ordem limite a um tick da média, escalando mais longe dela no lado do stop.",18]],"4":[["Cerca de 80 por cento das tentativas de romper a borda do canal contra a tendência falham, por isso entrar a favor durante a tentativa",15],["Assumir probabilidade de ao menos 60 por cento de equidistante quando houver desequilíbrio; stop e alvo simétricos ao ponto de entrada.",22]],"5":[["Realize lucros perto de três pontos além da entrada (tamanho dos movimentos recentes), em escadas de quatro pontos.",26]]},"m_late_entry_trend":{"3":[["Entrar a mercado só com a fração de swing que ainda teria se tivesse entrado no sinal original, com stop de swing.",11],["Ao reconhecer dia de tendência, entrar ao menos pequeno a mercado ou em correção de 10 a 20 centavos.",18],["Ao ver sinais de força, não precisa de setup: entre a mercado com stop relativamente pequeno; o setup só reduz o risco.",19],["Em tendência contra, colocar ordem de entrada exatamente onde os traders contrários teriam seus stops e deixar liquidação empurrar.",19]],"4":[["Usar o mesmo stop do swing original: no exemplo, equilíbrio ou cerca de 10 centavos além do extremo da barra do sinal.",11],["Após adicionar em nova correção, mover o stop de toda a posição para um tick além da barra de sinal e então arrastar.",11],["Entrada tardia com o stop original é matematicamente idêntica a manter a parte swing; se você não manteria, não entre.",11],["Stop no pior caso, além da base do spike; como é longo, reduzir o tamanho da posição proporcionalmente.",18]],"6":[["Barras de tendência grandes demais após longa sequência podem ser clímax, e entrar a favor a mercado ali é arriscado.",11],["Iniciante: em canal só entrar a favor; evitar entrar contra mesmo após swing contra a tendência, até o always in mudar de lado",15],["Quem entra contra todo extremo em tendência forte perde dinheiro: cerca de 80 por cento das reversões falham e viram bandeiras.",18]],"5":[["Não realizar lucro antes de ao menos duas vezes o risco inicial; depois mover o stop a favor para além do último extremo de swing contra a operação.",18],["Em dia de tendência, swing em parte ou toda a posição, pois um swing pode valer dez scalps.",19]]},"m_repeated_test_break":{"3":[["Linha testada muitas vezes em poucas barras: espere o desfecho, rompimento contra ou aceleração a favor, e opere o sinal confirmado.",13]],"6":[["Entrar contra a tendência além de barra fraca de bandeira por scalp prende a mentalidade contrária e faz perder o rompimento a favor da tendência.",23]]},"m_tight_channel":{"4":[["Escalar entradas contra o canal apenas nos dois primeiros terços do dia; no fim do dia operar só a favor",15],["Se rompimento do micro canal passa de uma ou duas barras e fecha forte, a tendência pode estar virando",16]],"3":[["Esperar correção ou rompimento falho, em micro canal; contra-tendência só no segundo rompimento",16]]},"m_new_high_outcomes":{"4":[["Em novo extremo observe: forte continuidade é entrada a favor, lateral é realização, reversão é domínio do lado oposto",17]],"5":[["Novo máximo forte projeta movimento medido, por exemplo igual à altura da cunha rompida",17]]},"m_double_hs":{"4":[["Se falhar novamente no preço do duplo extremo, reversão ou correção é provável; se romper, a tendência se estende.",20]],"6":[["Cabeça e ombros na lateralidade do meio do dia costuma falhar e virar continuação da tendência.",25]]},"m_gap_open":{"3":[["Em gap grande, alguns entram além do duplo extremo ou da correção do rompimento; outros esperam rompimento da faixa de abertura.",21],["Em grande gap, entre a favor no teste da abertura (duplo extremo) para a retomada, com atenção à primeira barra de lacuna da média.",25]]},"m_open_first_hour":{"6":[["Faixa de abertura de 5 pontos com média de 12: em 90 por cento dos casos a faixa aumenta antes do fechamento.",22]]},"m_trend_open_shallow":{"4":[["Em tendência forte, arrastar stop além do extremo de oscilação só após a correção voltar à barra de sinal e fazer novo extremo.",23],["Em tendência apertada, usar stop fixo de dois pontos em vez de stops de price action curtos, que são atingidos demais.",23],["Entrar além da primeira barra esperando tendência é trade de probabilidade menor; reversões são mais comuns na primeira hora.",23]],"6":[["Mesmos melhores padrões falham cerca de 40% das vezes; a tendência da abertura só ocorre em cerca de 20% dos dias.",23]]},"m_gap_trade":{"3":[["Com gap maior que poucos ticks, operar o rompimento da primeira barra nos dois lados; se o stop for atingido, considerar reverter.",23],["Entrar um tick além da barra a favor que prendeu os participantes do lado dela: eles saem, direcionando o movimento com poucos deles restantes.",23]]},"m_reversal_day":{"3":[["Em spike forte oposto com always in virado, entre rápido mesmo que pareça clímax, e mantenha ao menos posição pequena para swing.",24],["Com spike forte contrário na correção, opere só na direção nova; ficar posicionado esperando retomada antiga gera perdas.",24]],"4":[["Se cada trade a favor da tendência antiga perde, o mercado já mudou de direção: pare de insistir nela.",24],["Em swing de canal, arraste o stop além do último extremo de oscilação.",24]],"5":[["Em canal forte de reversão, é melhor segurar swing do que scalpar, pois correções derrubam stops de scalps.",24]]},"m_broad_channel":{"3":[["Em escadas, entre contra perto de cada extremo com ordens limite, mas só se for experiente.",26],["Iniciante deve usar apenas entradas stop, com o mercado já indo a seu favor, na reversão de swings.",26],["Meça quantos ticks o rompimento anterior passou do swing e escale ordens limite um pouco antes dessa distância, perto da linha do canal.",26],["Em escada, scalpe entradas no fechamento de barra de tendência que ultrapassa a escada anterior.",26]],"5":[["Alvo de cerca de 10 a 15 ticks a partir da entrada, próximo da linha do canal oposta.",26]],"4":[["Se os rompimentos vão diminuindo, a escada perde momentum; pare de operar a favor e prepare-se para reversão.",26]],"6":[["Três puxadas contra a tendência não garantem reversão: sem barras fortes na direção da reversão a tendência retoma.",26]]}},"SGX":{"ai_clear":["ai_none","b_overlap","b_barbwire","b_chan_weak","l_deep","l_stairs","n_edge","n_mid","t_range_day","x_niv_03","x_tem_15"],"ai_flip":["b_trend_seq","b_micro","b_gap20","n_ma_nocross","b_prior_force","l_shallow","l_seq","l_rev_flag","l_wedge_flag","ln_intact","ln_micro_break","ln_tight","t_fromopen","x_per_05","x_alw_06"],"ai_none":["ai_clear","b_trend_seq","b_micro","b_gap20","n_ma_nocross","b_spike","l_shallow"],"b_trend_s   function d(id){ if(depth[id]!==undefined) return depth[id]; if(id.indexOf("f_")===0){ depth[id]=0; return 0; } var m=0; P[PI[id]].pre.forEach(function(q){ if(q.indexOf("x_")===0) return; m=Math.max(m,d(q)+1); }); depth[id]=Math.max(m,1); return depth[id]; }

  var pos={};

}
