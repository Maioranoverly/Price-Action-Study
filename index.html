y":"Cobre as entradas a limit, como comprar no fechamento da barra, na correção à média móvel ou abaixo da barra anterior.","res":"Explica quando entrar a limit em vez de stop: correções em spike, canais maduros, barras de sinal fracas de L1/L2 em tendência de alta, extremos de lateralidade; trata dos riscos, de escalar, de Fibonacci 62% e dá longa lista de situações com limit.","L":[[38,"c",[3,4],"Stop para iniciantes; limit exige leitura, costuma ter tamanho menor e escala; cerca de 10 setups de stop e 20 de limit por dia; falhas de breakout favorecem limit."],[8,"c",[1,2,3,4,5],"Comprar no fechamento ou abaixo da mínima da barra anterior em spike; média móvel em bandeira quieta; ii em tendência forte; correção 60-70% com risco até lower low."],[22,"c",[1,2,3,4,5],"Comprar na mínima de swing no fundo da faixa, vender na máxima no topo; L1/L2 fraco no fundo e H1/H2 fraco no topo; stop além da linha."],[7,"s",[3],"Em canal inicial, H1/H2 a stop continuam; depois de 10+ barras migra para limit; em tendência de baixa vender L1/L2 junto à média."],[27,"c",[1,2,3],"Cunha de fundo: comprar em limit no L1/L2 fraco esperando higher low; cunha de baixa em canal de alta testa linha com limit, mas melhor acima de reversão."],[10,"c",[3,4],"Entrada com limite no extremo de um spike de uma barra ou no teste do breakout; teste de rompimento com risco de 4 a 6 ticks e chance acima de 50%."],[23,"s",[2,3],"Quebra da barra anterior é teste que costuma falhar; vender no limit na máxima falha é a abordagem inversa de comprar a stop; aborta trap de L2."],[14,"s",[3,5],"Comprar teste do fundo do canal em spike e canal de alta; vender teste do topo; canal de baixa maduro permite comprar abaixo de swing low."],[12,"s",[3],"Em micro canal, a primeira ruptura abaixo da barra anterior tende a falhar; comprar limit abaixo da mínima da barra anterior (Fig 28.2)."],[13,"s",[3,5],"Canais amplos e escadas: limit na correção para a escada anterior, ex. 4 pontos abaixo da mínima; fade do topo/fundo é mais confiável com tamanho pequeno."],[21,"s",[3,5],"Limit em movimento projetado do dia de range tendencial; teste do rompimento 4 a 6 pontos acima do range inferior."],[15,"s",[3,4],"Comprar acima do fundo da bandeira de fundo duplo em limit com risco de 1 a 2 ticks abaixo; compradores defendem o fundo."],[29,"s",[3,6],"Vender o fechamento de grande barra de alta provável clímax; alerta: spike forte sozinho não justifica limit contra, pode ser clímax exaustivo."],[32,"s",[3,6],"Entrar com limite no teste de linha de tendência é possível, mas melhor após barra de reversão; Fig 28.4: canais em tendência forte prendem os participantes do lado oposto."],[24,"s",[3],"Em range pequeno e barbwire, limit é arriscada e rápida; em faixa estreita de dia lateral, comprar acima do fundo duplo tem alvo 4 pontos e chance 50%."],[16,"e",[3],"Correção à média móvel em tendência forte, como barra de gap de 20, é entrada a limite; stop menor em ações."],[34,"s",[3],"Na abertura, duas barras fortes consecutivas: comprar na mínima da anterior em limit esperando que o spike aguente por um scalp."],[41,"s",[3,5],"Escalar contra a tendência, sair ao segundo movimento adverso; não escalar na última hora; cuidado com escala sem stop."],[39,"s",[4],"Stops longe o bastante da linha para tolerar falso rompimento; stop de 2 a 4 ticks para limites no extremo de ii ou da barra de entrada."],[40,"e",[5],"Alvo de ~2 vezes o risco em correção de 60-70%; alvo de 4 pontos ou 6 ticks de lucro no teste do ponto de breakout."],[37,"s",[1,4],"Limit com 30-40% de acerto pode ser aceitável se alvo é 4 a 5 vezes o risco; Figura 28.2 detalha o caso de stop de 2 ticks."],[44,"w",[6],"Limit contra tendência cria ansiedade; spike forte alone e Fibonacci 62% sem sinal não são razões; fechar o lado contrário antes do fim do dia."],[17,"e",[1,3],"Dia de range tendencial com gap: comprar fundo de range inferior e limit no extremo para testar o outro lado; abertura é metade da média diária."],[3,"s",[],"Ordens limite em níveis: extremos de swing, média móvel como magneto, ponto de rompimento e linhas de tendência."],[0,"s",[],"Barra de sinal fraca, doji, fechamentos e vácuos de compra/venda explicam por que limit funciona."],[1,"s",[],"Always-in, spike x canal, tendência forte x lateralidade definem stop ou limit."]],"secs":[["Quando usar stop e quando limit; spike, canal e limit",[38,8,14]],["Lista de situações de limit (spike, ii, abertura, canais, fade, 62%)",[8,22,10,14,12,13,27,15,29,16,34,21]],["Comportamento do mercado: tendência de alta x baixa e ordem a mercado",[38,1]],["Rompimento da barra anterior é teste; stop x limit na máxima",[23,38]],["Limit é mais arriscada: dobrar posição na mínima da barra de entrada; spike e Fibonacci 62%",[38,8,44]],["Perdeu a entrada, L1/L2 em tendência de alta forte, fade de correções após reversão e cunha de fundo",[8,27,22]],["Barbwire, fade de canais, escalar e caveat; stop de 6 ticks para 4",[24,13,41,38]],["Testes de rompimento e tendência forte na média",[10,8]],["Fig 28.1: topos e fundos com limit, range tendencial e swing em lateralidade apertada",[22,24,15,21,37]],["Fig 28.2: dia quieto, micro canal de alta, comprar limit na barra anterior",[12,8,22,29]],["Fig 28.3: SPY 60 min, double bottom, canal de alta, linhas duelando",[15,14,32]],["Figs 28.4 e 28.5: fade de linhas com limit; trend channel line prende compradores",[32,7]]],"tr":["Em tendência forte de alta, L1/L2 não são sinais e sim armadilhas: comprar em limit na mínima da barra de sinal ou 1 a 3 ticks abaixo, arriscando cerca de 4 ticks.","Comprar a H1/H2 de spike forte em limit abaixo da barra anterior ou 2 ticks abaixo da máxima corrente; após correção do spike de uma barra, comprar 1 a 2 ticks acima da base.","Após movimento forte, comprar correção de 60-70% da máxima com stop em lower low e alvo na nova máxima: alvo ~2x risco, chance ~60%.","Fundo de lateralidade ampla: comprar em limit na mínima de swing, em L1/L2 fraco ou 4 pontos abaixo do range superior; vender H1/H2 fraco no topo com ordem limitada.","Após reversão para cima em fundo de cunha, L1 e L2 devem falhar: comprar na mínima ou 1 a 3 ticks abaixo, arriscando ~4 ticks no Emini.","Vender H1/H2 fracos em movimento forte para cima só funciona se o spike não é forte; spike forte exige comprar H1 em vez disso; scalp do outro lado perde.","Para realizar 4 ticks a mercado precisa ir 6 ticks além do sinal; limit de saída no tick exato nem sempre preenche, o que indica pressão se preencher."],"q":"ok","parts":[]},{"id":"l2c29","k":"livro","bk":2,"cap":29,"part":false,"t":"Stops de Proteção e Trailing Stops","pg":581,"o":42,"why":"","res":"Stops de proteção sempre ativos: de gerenciamento de dinheiro ou price action; um tick além da barra de sinal, apertando só se a barra de entrada for forte; stops largos com posição menor em barras grandes, spikes e contra a tendência; trailing abaixo do swing low.","L":[[39,"c",[3,4,5],"Stop ativo no mercado, um tick além da barra de sinal; apertar para além da barra de entrada se forte; 8 ticks típico; ajustar tamanho de posição."],[40,"c",[5],"Realização parcial depois de meio caminho do alvo, stop no zero a zero; alvo igual ao risco forçado (ex. 16 ticks) ou 2x risco; sair antes do stop em lateralidade."],[37,"s",[1,4],"Correção no limite do dia com stop largo mantém 60% de chance de movimento equidistante; reduzir posição quando risco cresce."],[42,"s",[4,5],"Scalp tolera pouca correção; swing permite correções e trail atrás do extremo de swing; posições de swing exigem stop de 2 ou mais pontos."],[41,"s",[4,5],"Adicionar onde outros são parados; meia posição em sinal duvidoso e posição cheia no segundo sinal."],[43,"s",[6],"Mercado atinge stops redondos ao tick e reverte; stop de 1 tick é comum; instituições não caçam seu stop."],[44,"s",[6],"Se não entraria agora, saia; premissa inválida, saia com prejuízo; estabelecer o stop da primeira hora para o dia."],[7,"c",[3,4],"Stop na barra de sinal de H2 na média: deixar correção fora do stop se H3 cunha provável; stop sob higher low recente; segurar contra barra de baixa de entrada."],[18,"s",[3,4],"Em spike forte o stop teórico além do spike é distante: posição pequena, ou scalp com stop menor no fechamento; contra-operar barra de clímax tem stop da altura da barra."],[29,"s",[3,4],"Comprar fechamento de grande barra de baixa na terceira climax: stop com a altura da barra; vender barra de alta clímax após 30 barras de tendência."],[27,"s",[2,3,4],"Falha de L2 em tendência de alta, ou cunha de baixa em fundo: manter stop sob barra de entrada em reversão com duas pernas prováveis."],[17,"e",[5],"Tendência desde a abertura com gap: trail sob cada higher low; ao surgir clímax de compra, passar para scalp."],[22,"s",[4,5],"Em lateralidade se formando, saia antes que o stop atrás do extremo de swing seja atingido; não mantenha o trail como se ainda fosse tendência."],[23,"e",[2,3,6],"ii na topo de canal de alta é H1 ruim; vender no limit na máxima do ii; se comprado, stop é atingido na barra de entrada e vira bom reverso."],[12,"s",[3,4],"L4/H4 em canal estreito: stop de 8 ticks mesmo com entrada 4 ticks além da barra de sinal pequena; rompimento de canal estreito costuma ter correção."],[21,"s",[5],"Alvo em movimento projetado do spike inicial como ponto de realização; três pernas é variante de cunha com correção maior."],[16,"s",[3],"Entrada além da barra de gap da média com H2/L2 e cunha: stop no zero a zero quando a barra de entrada é forte."],[0,"s",[],"Barra de entrada doji = lateralidade de uma barra; fechamento forte para apertar; barras grandes pedem stop de dinheiro."],[1,"s",[],"Tendência forte x lateralidade forma decide trail ou realização."],[3,"s",[],"O extremo de swing recente como local do stop de trail."]],"secs":[["Stop de dinheiro x price action; stop ativo no mercado",[39]],["Scalp x swing; trailing sob o swing low; dia de range tendencial",[39,42,22,17]],["Correções além da barra de sinal e stops largos em H2",[7,39,41]],["Stop inicial um tick além do sinal; barra de entrada, doji, L1 fraco e reversão em tendência de baixa",[39,7]],["Barras grandes: stop de dinheiro de 8 ticks; reduzir posição; alvo igual ao stop",[39,40,37,12]],["Reverter no stop; stop de 8 ticks e o stop da primeira hora",[39,43]],["Stops largos: spike, clímax contra tendência, fade de canal fraco e stairs",[18,29,13,37]],["Stops largos amigos; tighten pela metade; instituições e stops",[39,40]],["Fig 29.1: stop inicial um tick além do sinal; H2, L2, ii e cunhas",[7,27,23]],["Fig 29.2: trailing em tendência de alta forte e clímax",[17,39,40]],["Fig 29.3: recompensa igual ao risco",[40,39,30]],["Fig 29.4: o stop é definido pelo primeiro trade do dia",[39,7]],["Fig 29.5: não aperte stops cedo demais",[39,16]]],"tr":["Risco efetivo: stop inicial um tick além da barra de sinal; se muito grande, usar 8 ticks ou ~60-70% da altura da barra, reduzindo a posição para manter o mesmo risco em dinheiro.","O mercado muitas vezes devolve ao trader tantos ticks de lucro quanto o obrigou a arriscar; colocar alvo um tick abaixo do risco (ex. 15 ticks para risco de 16).","Com stop maior que o habitual, aumente o alvo e diminua o tamanho; alvo mínimo continua igual ao risco com 60%.","Em spike forte o stop teórico fica abaixo do spike; quem entra no fechamento de barras do spike deve operar posição pequena ou fazer scalp com stop menor.","Em fundo de cunha ou final flag com reversão forte, pode-se segurar correção com stop abaixo da barra de entrada; senão se sai e recompra acima da barra da correção, perdendo ticks.","Duração: scalps tolerariam pouco correção e saem cedo; swing trail sob swing low; stop de 8 ticks cobre a maioria dos dias com range 10-15 pontos."],"q":"ok","parts":[]},{"id":"l2c30","k":"livro","bk":2,"cap":30,"part":false,"t":"Realizando Lucros e Alvos para Realização de Lucros","pg":605,"o":44,"why":"","res":"Realização de lucro é onde correções começam; scalp x swing exigem gestão diferente; alvo de 2x o stop para metade da posição em tendência forte, ordens OCO, checar posição após cada execução; exemplos de correção na média em Euro, Treasury e Emini com alvo ~2x risco.","L":[[40,"c",[5],"Alvo sempre no mercado, metade da posição a 2x o risco, trail do resto; saída total a 2x risco é aceitável; imagine que está fora para decidir."],[41,"c",[5],"Escalar saída em 2x e 3x o stop; adicionar em correções; manter parte até sinal oposto ou fechamento."],[39,"s",[4],"Stop no mercado; mover para o zero a zero depois da parcial; barra de sinal pequena de 4 ticks dá risco de 6 ticks."],[37,"s",[1,4,5],"Contra tendência quase impossível lucrar com stop de entrada; peça 60% e alvo mínimo igual a risco; ideal 2x."],[42,"s",[5],"Gestão diferente: scalp quando potencial é limitado; em tendência forte espere correção em vez de scalp contra."],[7,"c",[2,3,5],"Correção à média móvel em tendência: 60%+, alvo ~2x o risco; Euro com stop de 10 ticks e alvo de 20; Treasury risco de 6 e alvo de 8."],[8,"s",[1,3],"Confluência de média móvel, Fibonacci 62%, teste de breakout e cunha onde bulls compram a correção; vender topo de canal em tendência é perdedor."],[15,"e",[2,3,5],"Compra de fundo duplo que também é H2 e rompimento-e-correção na barra 14, saída a 20 ticks; segunda perna a partir de fundo duplo com a barra 19."],[16,"e",[2,3],"A primeira barra de gap da média móvel como entrada após reversão; risco de 11 ticks com alvo de 20."],[19,"e",[3,5],"Rompimento de triângulo com barra interna e breakout rápido: saída de metade em 20 ticks e restos em 10 a 20 ticks adicionais."],[27,"e",[2],"Cunha estreita onde mínimas das barras 8 e 10 foram as duas primeiras pernas; alvo em máxima do swing."],[22,"w",[1,6],"Quando o trade perde as condições de tendência e vira lateralidade, realize na borda do canal; scalp melhor que swing."],[29,"s",[5],"Clímax na barra 16 antes de correção à média: saia além dela e reentre na média."],[44,"s",[6],"Não faça scalp contra a tendência enquanto espera correção; confirme ordens e posições na conta; não confie no software."],[3,"s",[],"Confluências de suporte (ou resistência), 62% e teste do breakout; exatamente 10 ticks além do sinal."],[1,"s",[],"80% das tentativas de reversão em tendência falham."]],"secs":[],"tr":["Metade da posição realizada em cerca de 2x o stop inicial (ex. stop 2 pontos, alvo 4), 1/4 em 3x e resto até sinal oposto ou fechamento; realizar tudo em 2x é aceitável.","Alvo deve ser a nova ordem limite sempre no mercado, com stop OCO; correções na média móvel em tendência têm chance 60% com alvo cerca de 2x o risco.","Exemplos correção com risco de 10 a 16 ticks e saída em 20 ticks de lucro; correções costumam durar poucas barras, e quando lateralidade se forma é melhor scalp."],"q":"ok","parts":[]},{"id":"l2c31","k":"livro","bk":2,"cap":31,"part":false,"t":"Escalando a Entrada e a Saída de uma Operação","pg":615,"o":116,"why":"","res":"Escalar entrada (a favor ou contra) e saída: base em correções de tendência forte e extremos de lateralidade, com plano de stop final e risco total; beginner não deve escalar; exemplos de adicionar em spikes, canais e médias íngremes.","L":[[41,"c",[3,4,5,6],"Escale em correção crescente com always-in, nos extremos de lateralidade e em spikes; plano de stop final e tamanho; saída parcial em 2x e 4x risco."],[40,"s",[5],"Realize ao dobro do risco inicial ou em intervalos fixos, no zero a zero do primeiro lote; o resto no novo extremo do dia."],[39,"s",[4],"Stop da posição inteira dobra o tamanho do stop inicial; manter risco total dentro do normal."],[37,"s",[1,4],"Qualquer combinação em que prob x alvo > prob x risco é válida; sem certeza assuma 50%."],[43,"s",[6],"O mercado atinge stops redondos a 3 pontos ao tick; escale 1 tick além do stop óbvio; entre onde os traders fracos saem."],[44,"w",[6],"Média para baixo em reversão sem plano vira perda enorme; esperança não é razão; escalar na última hora é arriscado."],[8,"c",[3,4,5],"Correção à média móvel íngreme: comprar no toque e escalar por intervalos abaixo; saídas no preço do primeiro lote."],[7,"s",[3],"Segunda e terceira entradas em H2/L2 ou rompimento e correção tratadas como trades separados em cada barra do spike."],[18,"e",[3,5],"Spike inicial: comprar/vender fechamento de cada barra até a barra de pausa; manter risco total igual com stop no zero a zero nos lotes mais antigos."],[14,"e",[3,5],"Escale ao longo do canal forte; contra um canal fraco, escale além de cada novo extremo de swing, rumo ao teste do início."],[22,"c",[3,5],"Instituições compram o fundo e defendem mínima da barra de entrada; fundo de range escala, topo vende; alvo no teste do breakout."],[13,"s",[3,5],"Escadas e canais tendenciais: escalar abaixo de cada nova mínima, esperando correção acima da mínima anterior."],[21,"s",[5],"Dia de range tendencial: range com metade da média diária; espere o teste do ponto de breakout."],[17,"e",[3],"Gap grande com dojis nas primeiras barras e spike de baixa; comprar o fundo e escalar fechamento a fechamento."],[16,"s",[3],"A primeira barra de gap da média como entrada adicional após correção; fechar em 60 centavos."],[15,"s",[3],"Bandeira de fundo duplo e L2 no fundo de tendência de alta; esperar vender L2 só no topo."],[1,"s",[],"Always-in, tendência forte x lateralidade, dia de range tendencial decidem se escalar ajuda."],[4,"s",[],"Segundo sinal como segunda entrada sem aumentar risco."]],"secs":[["Escalar entrada e saída: o que é; adicionar a favor x contra",[41]],["Regra de nunca adicionar a perdedor e plano para escalar",[41,44,39]],["Onde escalar e variáveis; segundo sinal como trade separado",[41,8,7]],["Fig 31.1: escalar em spike e múltiplas entradas pequenas",[41,7]],["Fig 31.2: escalar compras e saídas no SPY, risco de 11 centavos para 18",[41,40,8]],["Fig 31.3: instituições escalam no fundo de range",[22,41]],["Figs 31.4 e 31.5: canal de alta forte e média íngreme",[14,8,41]],["Fig 31.6: escalar em spikes mantendo risco constante",[18,41,17]],["Figs 31.7 e 31.8: escalar em canais e onde traders fracos saem",[22,13,43,41]]],"tr":["Em spike forte, a entrada no fechamento de cada barra funciona até aparecer barra de pausa; manter risco total igual usando stop no zero a zero nos lotes mais antigos.","Meta de saída: parciais a 2x risco e 4x risco; sair um lote perto de alvo óbvio como um tick abaixo da máxima da barra.","Em correção para média móvel íngreme, pode-se escalar intervalos de 1 ponto abaixo e sair tudo no preço da primeira entrada, no zero a zero no primeiro lote e ganho no segundo.","Não escalar contra tendência forte; sair se houver segundo movimento adverso, como L2 na média em fundo; evitar escala na última hora."],"q":"ok","parts":[]},{"id":"l2c32","k":"livro","bk":2,"cap":32,"part":false,"t":"Preso Dentro ou Fora de uma Operação","pg":641,"o":117,"why":"","res":"Stops de entrada podem prender em trades ruins e stops protetores podem tirar de trades bons; a figura única mostra como apostar contra armadilhas com ordens limitadas: vender H1 fraco, comprar L1/L2 fraco em canal forte de alta, etc.","L":[[43,"c",[1,2,3,6],"Armadilhas surgem de sinais fracos; apostar no lado oposto com limit na máxima ou mínima da barra de sinal. Instituições seguem modelos próprios e não 'enganam' você."],[38,"s",[3],"Ordens limite em H1/L1 fracos: comprar a mínima de L1 depois de cinco barras de alta, vender a máxima de H1 sem spike forte."],[23,"e",[2,3,6],"L2 que falha vira reversão ao alto; barra 15 outside up prendeu vendedores e compradores ficaram de fora e perseguiram."],[8,"e",[3],"Vender no limit na máxima da barra 5, H1 de spike fraco, e comprar na mínima de L1 em canal forte."],[22,"e",[3,6],"Em meio de lateralidade H1/H2 com barra de sinal grande força compra no topo: vender a máxima das barras 28 e 30."],[29,"e",[1,6],"A barra 12 foi grande e houve clímax após movimento forte: L2/H2 pode ser bandeira final antes de correção."],[12,"w",[6],"Canal de baixa íngreme com H2 em barra de alta: esperar rompimento-e-correção antes de comprar."],[17,"e",[1,2],"Abertura com gap e barra 1 forte: não vender cedo, esperar informação; acima da barra 2 compra a stop com vendedores presos."],[0,"s",[],"Barras de sinal fracas (doji, corpo pequeno, sombras) indicam armadilha."],[1,"s",[],"Spike forte x fraco decide se H1/L1 funciona."]],"secs":[],"tr":["Vender H1 em spike de alta fraco (barras pequenas e sombras) em limit na máxima do sinal é a aposta contra a armadilha; em spike forte o H1 é bom.","Comprar em limit na mínima de L1 ou L2 fraco quando a tendência recente é de alta ou após barras de alta consecutivas é a contraparte, com stop curto."],"q":"ok","parts":[]},{"id":"l2c41","k":"livro","bk":2,"cap":41,"part":true,"t":"Parte I: introdução (Rompimentos: Transição para uma Nova Tendência)","pg":41,"o":108.5,"why":"","res":"Todo mercado tenta romper e depois tenta fazer o rompimento falhar; a maioria dos rompimentos falha. Mostra como instituições entram em spikes, como se comportam novas máximas (compra nova, realização, venda) e como entrar a favor ou contra o rompimento.","L":[[18,"c",[1,2,3,4,5],"Barra grande sem sombras define always in; compra-se o fechamento ou correção pequena a limit, com tamanho reduzido, stop abaixo do spike e alvo de movimento projetado."],[23,"c",[1,2,3,5,6],"A maioria dos rompimentos falha; contra-opere a barra de reversão forte em tendência, com alvo no extremo da barra e depois movimento projetado de igual tamanho."],[10,"c",[2,3,4,6],"Teste do ponto de rompimento ou H1/L1 após spike forte; entre além de barra a favor. Compare a força do rompimento com a da barra de reversão."],[7,"s",[2,3],"Após spike forte, o primeiro H1/L1 é correção de rompimento; H1/L1 ou H2/L2 em gráfico de 1 a 3 minutos além da barra de sinal. Na borda da lateralidade o H1/L1 falha."],[8,"s",[3],"Ordem limitada para comprar correção de 1 a 4 ticks, no fechamento, na mínima ou abaixo da barra de pausa, ou na média móvel."],[22,"w",[1,6],"Spike de alta abaixo das máximas do lado esquerdo pode estar dentro de lateralidade; não compre fechamentos no topo, compre apenas correções."],[29,"s",[1,2,5],"Barra de alta enorme após tendência prolongada atrai venda de fortes; terceiro clímax seguido leva a correção de cerca de 10 barras abaixo da média."],[14,"s",[1,5],"Barra de rompimento forte seguida de barras pequenas sobrepostas forma canal estreito; o teste volta à área do gap do spike e costuma retomar a tendência."],[12,"s",[1,6],"Em canal estreito de alta, sinal de venda fraco em doji de baixa é absorvido por ordens limitadas de compra e nunca dispara."],[21,"s",[5],"Rompimento forte tem pelo menos 60% de chance de atingir movimento projetado igual ao spike; duplo extremo projeta alvo igual à altura da faixa."],[28,"s",[1,2],"Quando a correção rompe a linha de tendência e a média, a nova máxima vira local de venda e pode levar a reversão em duas pernas."],[15,"e",[2],"Barra 10 foi rompimento de bandeira ii de alta com barra de reversão de baixa, rompimento fraco com mais chance de falhar."],[1,"s",[],"Modo rompimento, inflexão, lateralidade maior x menor, tendência madura que vira lateralidade e a mudança gradual de mentalidade de altista para baixista."],[0,"s",[],"Barras de tendência sem sombras como rompimento significativo; sinal fraco em barra com corpo contrário; entrar além de barra a favor aumenta a probabilidade."],[3,"s",[],"Altas e baixas de swing da barra anterior como pontos de rompimento; realização de lucro em alvo de movimento projetado, linha de tendência e canal."],[5,"s",[],"Gap de rompimento entre ponto de rompimento e teste; rompimentos equivalem funcionalmente a gaps; gap de medida."],[48,"c",[2,3,5],"Comprar o fechamento de grande barra de baixa em tendência de alta: alvo na máxima da barra e depois movimento projetado."],[49,"c",[1,2],"Quando há setups em ambas as direções, espere a direção do rompimento; no meio da lateralidade, espere clareza."],[50,"c",[1,2,3],"Regras de leitura do que ocorre depois de romper a máxima anterior: nova compra, realização ou venda."]],"secs":[["Todo mercado tenta romper; a maioria falha",[18,23]],["Definição de rompimento, ponto de rompimento, teste e gap; modo rompimento e inflexão",[10]],["Rompimento de lateralidade pequena dentro de maior; não comprar fechamentos no topo",[22,7]],["Instituições entram no spike, aumentam em correção e reduzem o tamanho",[18]],["Entradas a favor do rompimento: fechamento, limit em correção, stop, H1",[18,8,7,10]],["Entrada contra o rompimento (fade) com alvo na máxima e movimento projetado",[23,21]],["Avaliar o rompimento em relação a todo o gráfico; 60% de chance de movimento projetado",[18,22,37]],["Nova máxima: compra nova, realização ou venda; transição gradual",[23,28]],["Rompimentos em correções de tendência forte tendem a reverter",[23,7]],["Tendência madura vira lateralidade; comportamento de fortes altistas e baixistas",[28,8]],["Clímax exaustivo em tendência prolongada; fracos x computadores",[29]],["Correções grandes se comportam como lateralidade; ponto de virada",[28,22]],["Rompimento de mínima de swing durante correção: três desfechos",[23]],["Barra de rompimento em tendência fraca forma canal estreito e testa o gap",[14,12]],["Inflexão, movimento projetado e rompimentos contra a tendência",[21,23]],["Figura PI.1: novas máximas e cenário de entradas, barras 5, 12, 14, 19, 22",[10,7,29,23,12]],["Figura PI.2: rompimento de baixo volume em tendência de baixa; stops de 2 pontos e alvo",[18,21,39,40]]],"tr":["Após spike forte compre limit em correção de 1 a 4 ticks no Emini ou no fechamento da barra de pausa; também acima de H1 ou H2.","Para quem entra no fechamento do rompimento, o stop vai abaixo do spike; por isso reduza o tamanho a um terço ou um quarto do normal.","Rompimento forte tem ao menos 60% de chance de atingir movimento projetado igual ao spike, então a equação do trader é boa.","Na Figura PI.2, entrada no fechamento da barra 5 arriscava cerca de 4 pontos com alvo equivalente, e outra entrada arriscava 2 pontos."],"q":"ok","parts":[]},{"id":"l2c157","k":"livro","bk":2,"cap":157,"part":true,"t":"Parte II: introdução","pg":157,"o":112.5,"why":"","res":"Magnetos são níveis de suporte e resistência que atraem o preço; servem para localizar reversões e correções, para realizar lucro e para decidir em que direção operar até o nível ser testado. Inclui o efeito vácuo e o suporte que vira resistência.","L":[[32,"s",[1,5],"Linhas de tendência e de canal são magnetos; o extremo do crash de 2009 reverteu além da linha mensal e na linha de canal (linhas duelando)."],[21,"s",[1,5],"Alvos de movimento projetado são magnetos; mesmo em tendência forte muitas vezes param no tick exato do alvo, pois computadores os calculam."],[10,"s",[1,2,3],"Após romper a borda da lateralidade e voltar a testá-la, o preço tende a seguir no sentido do rompimento: suporte rompido vira resistência (e vice-versa)."],[22,"s",[1,5],"Em lateralidade quase todo rompimento falha: compra-se no suporte do fundo da faixa, vende-se na resistência do topo e realiza-se no lado oposto."],[29,"s",[1,2,6],"Perto de suporte maior a falta de compradores acelera a queda em clímax vendedor que ultrapassa o nível; a reversão vem com volume alto."],[8,"s",[1,6],"Entradas em toques da média móvel plana sem reação suficiente cansam; após 4 ou 5 testes o rompimento vira mais provável e a média vira obstáculo."],[26,"e",[1],"Topos duplos e fundos duplos em máximas e mínimas de swing aparecem como suporte e resistência no gráfico mensal do Dow."],[40,"s",[5],"Magnetos são pontos lógicos para lucro parcial ou total; seja mais rápido em realizar lucro do que em procurar entrada oposta."],[37,"s",[1,6],"Reversões em suporte podem ter só 40% de acerto e ainda ter equação positiva pelo ganho várias vezes maior que o risco."],[3,"c",[],"Define suporte e resistência, lista tipos de nível (linhas, médias, swings, extremos do dia anterior, pivôs, Fibonacci) e explica memória do mercado e inversão de papel."],[2,"s",[],"Linhas de tendência e de canal como magnetos; um canal inclinado deve ser tratado como bandeira no sentido oposto quando for rompido."],[1,"s",[],"Inércia: em tendência a maioria dos suportes falha; na lateralidade a maioria dos rompimentos falha; opere na direção do magneto até alcançá-lo."],[46,"c",[1,2,3],"Perto de um magneto, os que operam contra recuam, o preço dispara em barra de tendência até o nível e depois reverte forte."],[47,"c",[1,2,3],"Após 4 a 5 testes de suporte ou resistência sem recompensa, o rompimento fica mais provável e o nível inverte o papel."]],"secs":[["Definição de magnetos e regra de operar na direção do magneto",[]],["Inércia, reversões em suporte e resistência e equação com 40%",[37,22]],["Algoritmos e magnetos como local de realizar lucro; exceder o magneto",[40]],["Lista de tipos de suporte e resistência",[32,21]],["Suporte exige vantagem direcional e o mercado tem memória",[10]],["Campo magnético e efeito vácuo",[32]],["Spike contra a tendência como correção de vácuo; não precisa de gráfico maior",[29]],["Quatro ou cinco testes: suporte rompe e vira resistência (média e linha)",[8,10]],["Instituições, algoritmos e valor; clímax de venda no suporte maior",[29]],["Fundamentos x técnica e notícias (opere o gráfico)",[]],["Topos vêm de lateralidade e fundos de clímax; uso em canais e lateralidades",[26,22]],["Tendência forte passa pelos magnetos; alvos exatos e reward mínimo igual ao risco",[21,40]],["Figura PII.1: Dow mensal com linhas, médias, faixas e swings como magnetos",[32,26]],["Figura PII.2: suporte vira resistência na média e na linha de tendência",[8,10]]],"tr":["Reversões em suporte podem acertar só cerca de 40% e ainda ter equação positiva, pois o ganho potencial é muitas vezes o risco.","Em tendência forte, vender em todo nível de resistência é erro típico de iniciante; compre correções que parecem ruins e evite topos que parecem ótimos.","O reward precisa ser pelo menos igual ao risco, e isso gera realização de lucro quando o ganho atinge o tamanho do risco.","Suporte só é suporte se há cerca de 60% de chance de um repique que dê para scalp; edge de 52% a 53% não conta."],"q":"ok","parts":[]},{"id":"l2c205","k":"livro","bk":2,"cap":205,"part":true,"t":"Parte III: introdução (correções: tendências que viram lateralidade)","pg":205,"o":49.5,"why":"","res":"Abertura da Parte III: por que existem correções, definição, pausas, ABC e primeiras correções.","L":[[9,"c",[1,2,3],"A correção de duas pernas termina quando novos participantes entram, os do outro lado cobrem e os da perna A adicionam; testa o extremo antigo; infira as pernas se necessário."],[10,"s",[2,3],"Em canal íngreme, não operar a primeira quebra da linha; esperar a correção do rompimento (lower high, topo duplo ou higher high) e vender/comprar nele."],[11,"s",[1,3],"Quando a tendência é forte e a correção não vem, entrar a mercado ou em recuos de 1-2 ticks pode ser melhor; instituições fazem isso com probabilidade ~70%."],[12,"s",[2,6],"Último trecho da correção costuma ser micro canal contra a tendência; rompimento dura 1-2 barras e deve-se comparar força do rompimento com a do sinal contrário."],[8,"c",[1,3],"Compra a limit abaixo da barra anterior em impulso forte, ou na média móvel: preço com desconto; se não sobe após 10-20 barras, precisa de desconto maior."],[7,"c",[1,2,3,4,6],"H1 após impulso forte, H2 em corrente de correções maiores; stop abaixo do sinal; evitar pausas de 1-2 barras difíceis, após climax ou reversão."],[45,"c",[1,2],"Introdução à sequência de correções e ao que cada nível de correção significa."]],"secs":[["Introdução Parte III: por que existem correções e como terminam em lateralidade",[9,7]],["Definição de correção, pausas de 1-2 barras e correção de duas pernas",[7,9,10]],["Efeito vácuo, reversão falha e correção forte (spike contra a tendência)",[8,10]],["Correção para máxima mais alta ou mínima mais baixa; tendências sem correção, entrar a mercado",[11,7]],["Figs PIII.1-PIII.3: reversão no início, L2 na média, rompimento-e-correção",[9,8,10,12]]],"tr":[],"q":"ok","parts":[]},{"id":"l2c365","k":"livro","bk":2,"cap":365,"part":true,"t":"Parte IV: Lateralidades (introdução)","pg":365,"o":92.5,"why":"","res":"Texto central sobre lateralidades: a maioria das barras está em lateralidade, 80% dos rompimentos falham, comprar embaixo e vender em cima com scalp, e esperar falha ou correção do rompimento. Cobre armadilhas do meio do range e da lateralidade apertada, matemática do scalp e muitos exemplos.","L":[[22,"c",[1,2,3,4,5,6],"Comprar perto do fundo e vender perto do topo, melhor com segunda entrada e barra de sinal pequena; scalp de 2 pontos com risco 2, parcial e swing só nos extremos."],[23,"c",[1,3,6],"Rompimentos de topo e fundo falham em cerca de 80%; entrar na reversão de volta ao range em vez do rompimento, evitar fechamento de barra forte como entrada."],[24,"s",[1,6],"Lateralidade de 3-4 pontos ou de 5-20 barras sobrepostas: stops perdem, só operar com limite se experiente; evitar meio do dia no meio do range."],[25,"s",[2],"Cunha e triângulo de três puxadas em lateralidade grande: compra perto do fundo (triângulo B apoiado em range A) ou venda; também triângulo expandido."],[27,"s",[2,3],"Cunha de baixa em fundo de lateralidade e três puxadas de queda são setup de compra; cunha de alta no topo (barra 3) permite short com swing parcial."],[10,"s",[3],"Depois de rompimento bem-sucedido ou canal final de baixa, comprar reversão no fundo ou correção do rompimento; vender correção de rompimento de baixa."],[19,"s",[3,6],"Entrar no rompimento da borda da lateralidade só com stop largo e com a tendência já retomando; a chance de um rompimento isolado dar certo é cerca de 20%."],[8,"s",[3,6],"Ordem limite abaixo de low 1/low 2 fracos no fundo (ou acima de high 1/high 2 no topo) esperando falha do sinal; evitar ordem de stop no meio."],[7,"s",[2,3],"H2 vale no fundo da lateralidade e L2 no topo; no meio ou a favor de impulso estes sinais não funcionam como em tendência."],[29,"s",[1,2],"Impulso de alta e depois de baixa (ou vice versa) leva a lateralidade; três clímax de venda seguidos levam a correção de 10+ barras com duas pernas."],[30,"s",[2],"A lateralidade de uma tendência frequentemente é bandeira final; rompimento de lateralidade apertada reverte de volta ao range."],[21,"s",[5],"Rompimento de lateralidade tende a gerar movimento medido igual à altura do spike; projeção do spike e alvo para parciais."],[12,"s",[2,3],"Se a perna que testa a borda é micro canal, não entre contra na barra anterior; espere a correção do rompimento do micro canal."],[13,"s",[1],"Canais são lateralidades inclinadas e evoluem para lateralidade; sinais de transição aparecem em barras maiores e em testes da borda do canal."],[26,"s",[1,6],"Topos, fundos duplos e OCO são lateralidades que continuam a tendência; com OCO de topo em alta, melhor buscar compra na quebra de baixa."],[28,"e",[1,6],"Lateralidades podem levar a reversão, como quatro vezes no SPY mensal; após três clímax e duplo ou triplo extremo, a probabilidade de reversão sobe."],[15,"e",[2],"Fundo duplo em correção e topo duplo de bandeira de baixa aparecem nas bordas da lateralidade."],[18,"e",[3,4,5],"Quando a tendência de alta vira sempre-comprado, entrar no fechamento da segunda barra forte com stop abaixo da primeira barra do impulso, risco ~12 pontos."],[34,"s",[1],"Reversões múltiplas nas primeiras horas indicam dia de lateralidade; terço do meio do dia pede cautela."],[37,"c",[1,4,5],"No dilema da lateralidade, reduzir o alvo sem reduzir o stop exige probabilidade maior; com 60% de chance e risco igual ao alvo a equação é mínima."],[38,"s",[3],"Em lateralidades, entradas com ordem limite são necessárias mas exigem experiência; iniciantes usam stop em segunda entrada nas bordas."],[41,"s",[3,5],"Escalar entrada contra o movimento e sair em ponto de entrada inicial (breakeven) com lucro nas entradas melhores."],[40,"s",[5],"Parcial de um quarto a metade em 2 pontos e swing do resto para 4 pontos; não segurar esperando rompimento."],[39,"s",[4],"Stop de cerca de 2 pontos quando a faixa diária é 10-15; após parcial, mover para breakeven ou apertar para ~5 ticks."],[42,"s",[5],"Em lateralidade predomina scalp; swing só em sinal forte no extremo ou quando tendência recomeça."],[44,"w",[6],"Nunca usar martingale nem acreditar que um rompimento ou vencedor está atrasado; o mercado sustenta o inesperado mais que a conta."],[1,"s",[],"Lateralidade como correção em prazo maior; incerteza versus urgência; viés da tendência anterior e média móvel."],[3,"s",[],"Topo e fundo da lateralidade e meio do range são ímãs; linhas de tendência e canal reforçam."],[6,"s",[],"Terço do meio do dia e meio do range pedem pouco operar."],[0,"s",[],"Barras de sinal nas lateralidades podem ser fracas e até ter corpo contrário; barra grande de rompimento nos extremos é armadilha."],[4,"s",[],"L3/L4 e H3/H4 em range e escalar na quarta tentativa."]],"secs":[["Definição de lateralidade e canal como lateralidade inclinada",[22,13]],["Características de uma lateralidade (lista de sinais)",[22,24]],["Correção x lateralidade: 60% de certeza, 80% dos rompimentos falham",[22,23]],["Compre embaixo, venda em cima; cada rali é bandeira de baixa e cada queda é bandeira de alta",[22]],["Mercado procura incerteza; probabilidade direcional e viés da tendência anterior",[22,37]],["Ímã, efeito vácuo e estrutura de topo/fundo; não ser pego pelos surtos de momentum",[22,23]],["Comprar rompimentos de lateralidade: só com stop largo; o melhor é esperar correção ou falha",[19,10,23]],["Quem muda a opinião: notícias irrelevantes, rompimento já se forma em 10+ barras",[22]],["Lateralidade estreita de 5-20 barras e rompimento para longe da média",[24]],["Terço do meio do dia e do range: operar pouco; armadilhas de padrão perfeito",[24,34]],["Clímax (impulso e impulso oposto) leva a lateralidade e movimento medido",[29,21]],["Padrões de reversão em lateralidade são na maioria continuação; trending trading range days",[26,30]],["Dilema da lateralidade: scalp exige alta probabilidade; ordens limite e escalar",[22,37,41,38]],["Como operar: comprar baixo, vender alto, melhores segundas entradas (H2/L2 nas bordas)",[22,7]],["Matemática do scalp: risco 2 pontos, alvo 2 pontos, parcial e stop em breakeven",[40,39,37]],["Micro canal na borda: esperar correção; reforços de sinal (sombras, pressão compradora)",[12,10,22]],["Fade do fechamento de barra de rompimento e escalar entrada",[22,41]],["L1/H1 e L2/H2 falhos dentro da lateralidade: ordem limite contra o sinal fraco",[8,22]],["Não overstay, sem martingale",[44]],["Fig PIV.1: maior parte das barras está em lateralidades; cunha/triângulo de três puxadas nas bordas",[25,27,22]],["Fig PIV.2: reversões múltiplas cedo geram dia de lateralidade; fades de extremos",[22,34,41]],["Fig PIV.3: swing em lateralidades com sinais de barra imperfeitos",[22,27]],["Fig PIV.4: terço do meio do dia (barbwire), esperar",[24]],["Figs PIV.5-PIV.6: spike duplo e correção que vira lateralidade; três puxadas no fundo",[29,27,14]],["Fig PIV.7: lateralidade como setup de reversão; canal final de baixa é bandeira de alta",[22,30,15]],["Fig PIV.8: clímax de compra e lateralidade; armadilhas de H2 em barras sobrepostas",[29,24,30]],["Fig PIV.9: lateralidades levam a reversões; três clímax de venda e entrada em impulso com stop largo",[28,18,21,39]]],"tr":["Para comprar perto do fundo de lateralidade ampla após três puxadas ou cunha, o texto aceita ordem limite abaixo de barras e swing parcial se o sinal for forte; iniciantes só com stop em segunda entrada.","Com risco de 2 pontos e alvo de 2 pontos, a equação precisa de pelo menos 60% de acerto; parcial em 2 e stop em breakeven; apertar para 5 ticks.","No fim de impulso de alta já sempre-comprado, entrar no fechamento da segunda barra forte do impulso com stop abaixo da primeira barra, risco fixo de 12 pontos no exemplo.","Ordens limite acima de high 1/2 fracos no topo e abaixo de low 1/2 fracos no fundo da lateralidade esperam o sinal falhar; o texto alerta que exigem experiência."],"q":"ok","parts":[]},{"id":"l2c463","k":"livro","bk":2,"cap":463,"part":true,"t":"Parte V: introdução","pg":463,"o":36.5,"why":"","res":"Abertura curta da Parte V: saber ler gráficos não basta para viver de trading; é preciso um plano de entrada e saída e decisões constantes sobre cada posição aberta.","L":[[44,"s",[1],"Apresenta a Parte V: além de ler gráficos, o trader precisa de plano de entrada e saída e decisão contínua sobre posições."],[38,"s",[1],"Anuncia que a parte trata de como entrar e sair, introduzindo o tema de ordens e gestão."]],"secs":[],"tr":[],"q":"ok","parts":[]},{"id":"l3c1","k":"livro","bk":3,"cap":1,"part":false,"t":"Exemplos de Como Operar uma Reversão","pg":85,"o":92,"why":"","res":"Mostra, num dia de CAT, como um especialista em reversões majoritárias espera ruptura forte da linha de tendência, teste da máxima e sinal, e depois gerencia o trade como swing. Explica por que reversões têm probabilidade de 50% ou menos mas equação favorável.","L":[[28,"c",[1,2,3,4,5,6],"Exemplo completo: quebra da linha, teste da máxima com lower high/double top, short abaixo do sinal, stop acima, saída parcial e restante até o fim."],[32,"s",[1,2],"Sem quebra prévia da linha de alta ele não vendia; a quebra com três barras de baixa é o primeiro sinal de pressão vendedora."],[27,"e",[2,5],"Movimento de três pernas (cunha) após quebra forte tende a gerar ao menos mais uma perna no sentido da quebra; alvo no extremo."],[29,"e",[1,2],"Barra de alta enorme após clímaxes consecutivos de compra costuma gerar correção de duas pernas abaixo da média, tanto para touros quanto ursos."],[26,"s",[2,3],"Double top bear flag e lower high no barra 19 formam o setup mais forte do dia, com barra de reversão de baixa como sinal."],[21,"s",[5],"Rompimento em barra grande tende a gerar movimento projetado pela altura da lateralidade; possível gap de medição."],[37,"c",[1,4,5],"Reversão tem 50% ou menos de acerto, mas risco de 10 centavos contra 50 de alvo e 60% de chance dá equação excelente."],[40,"s",[5],"Realize metade no teste do extremo anterior se houver pausa, outra parte no clímax, e o restante até perto do fechamento."],[39,"s",[4],"Stop acima da barra de sinal; após spike de baixa, apertar o stop acima do início do spike."],[41,"s",[5],"Saída parcial em etapas: metade no alvo inicial e o resto mantido enquanto a premissa seguir válida."],[1,"s",[],"Ciclo da reversão e modo always-in: iniciantes demoram a aceitar a virada; o spike inicial é difícil de entrar."],[2,"s",[],"Quebra da linha de tendência como pré-requisito para procurar reversão."],[4,"s",[],"Contagem de pernas: teste em duas pernas e terceiro puxada do dia."]],"secs":[],"tr":["Reversão tem probabilidade de 50% ou menos; o exemplo usa risco de 10 centavos contra alvo mínimo de 50 e 60% de acerto, bem acima de 1x o risco.","Realiza metade no teste do extremo anterior se houver barra de pausa; o restante é mantido por horas, ou seja, swing, não scalp curto."],"q":"ok","parts":[]},{"id":"l3c2","k":"livro","bk":3,"cap":2,"part":false,"t":"Sinais de Força em um Rompimento","pg":93,"o":72,"why":"O assunto do capítulo é reversão; ele entra como identificação da reversão.","res":"Lista as características de reversões fortes de alta e de baixa (barra de reversão com corpo grande, spike de 5-10 barras, primeira correção curta) e explica como o grau de força exigido depende da força da tendência a ser revertida.","L":[[29,"c",[2,3],"Checklist de spike forte: barras consecutivas, fechamento perto da extremidade, rompimento de muitas barras e urgência; overshoot de linha de canal como origem."],[28,"s",[1,2,3],"Reversão forte exige quebra anterior da linha, teste do extremo sem momentum e falha na média; quanto mais sinais, mais swing se justifica."],[7,"s",[2],"Correções H1/H2 (L1/L2) após a reversão têm barras de sinal fortes de reversão; correções pequenas e laterais indicam força."],[22,"s",[1,3],"Em lateralidade, pode-se vender no topo sem exigir barra de reversão; reversões são negociadas nos dois sentidos."],[27,"s",[3],"Em wedge bull flag, pode-se comprar até acima de barra de baixa se se espera voltar à tendência."],[0,"s",[],"Anatomia das barras fortes: corpo, sombras, fechamento na máxima/mínima, abertura além do fechamento anterior, overlap."],[1,"s",[],"Em tendência forte só operar contra após quebra de linha ou reversão de overshoot do canal."],[2,"s",[],"Quebra da linha de tendência anterior e falha na média ou na linha antiga."]],"secs":[],"tr":[],"q":"ok","parts":[]},{"id":"l3c3","k":"livro","bk":3,"cap":3,"part":false,"t":"Reversão Majoritária de Tendência","pg":97,"o":82,"why":"","res":"Define a reversão majoritária (tendência, quebra da linha, teste do extremo, segunda reversão com consenso), explica o comportamento de touros e ursos no teste e mostra exemplos com higher high, lower high e lower low. Insiste em esperar força e operar só no gráfico de 5 min.","L":[[28,"c",[1,2,3,4,5,6],"Capítulo central: requisitos, ombro-cabeça-ombro, teste com ou sem momentum, entrada precoce versus no always-in, stop e falha quando o teste é forte."],[32,"c",[1,2,4],"Quebra da linha é o primeiro sinal, não a reversão; se não chega à média é fraca; teste de canal íngreme exige esperar rompimento-e-correção."],[26,"c",[2,3,6],"Duplo extremo, extremo mais alto e extremo mais baixo são o mesmo comportamento; OCO costuma virar triângulo; micro duplo extremo antecede a maioria das reversões."],[30,"s",[2,3],"Bandeira final é variação do double top/bottom; ii pós-spike é alerta; limit de entrada no sinal da bandeira esperada."],[29,"s",[1,2,6],"Overshoot do canal e reversão climática iniciam muitas reversões; V puros são raros; barra grande com sombra lembra spike e vacuum."],[27,"s",[2],"Cunhas e três puxadas aparecem no teste do extremo; cunha na figura 3.1."],[23,"s",[1,2,6],"Novo extremo que volta rápido é falha de rompimento; se rompe forte com poucos retornos, assuma rompimento bem-sucedido."],[22,"s",[1],"Topos e fundos de lateralidade em tendência formam reversões; primeiros ranges costumam ser bandeiras de continuação."],[8,"e",[3],"Em tendência forte contra a qual há muitos sinais no 1 min, vender a limit na máxima da barra anterior após 5 barras de baixa."],[16,"e",[2],"Barra de gap da média citada como entrada de compra/venda no teste e no 20 gap bar short em tendência de baixa."],[37,"s",[1,5],"Chance média de 40% de swing, 30% de pequeno lucro e 30% de pequena perda; os melhores setups têm 60%; recompensa de 2x com 67%."],[39,"s",[4],"Stop acima da máxima anterior ao vender 50% de retração; a quebra da premissa (novo extremo forte) manda recomeçar a procura."],[38,"s",[3],"Entradas de reversão no always-in com stop na barra, ou limite no sinal de bandeira final; evite sinais do 1 min contra a tendência."],[1,"s",[],"Gradualidade da transição de touro para urso, maturidade da tendência, always-in e a maioria dos range virando continuação."],[2,"s",[],"Linha de tendência e canal: quebra com força, steep channel, overshoot."],[4,"s",[],"O teste do extremo costuma ter duas pernas; o primeiro extremo além do anterior inicia a primeira perna, o extremo oposto a segunda."],[0,"s",[],"Barra que reverte extremos e fechamentos de várias barras indica reversão forte."]],"secs":[["Pré-requisitos e comportamento institucional na reversão majoritária",[28]],["Quatro condições da reversão e o teste do extremo (OCO, double top, higher high, lower high)",[28,26,32]],["Micro double top/bottom e bandeira final como gatilho das reversões",[26,30,38]],["Esperar força: quebra da linha não é reversão; processo recomeça se o teste for forte",[32,23,28]],["Novas máximas: compra, realização de lucro ou venda; maturidade da tendência e clímax final",[23,29,22]],["Teste do extremo com momentum, tempos gráficos e probabilidades (40/30/30)",[28,37]],["Figura 3.1: higher high e lower high em AAPL; retração e equação",[28,26,37]],["Figura 3.2: lower low e higher low no Emini; entrada precoce versus always-in",[28,26]],["Figuras 3.3-3.4: quebra de linha sozinha não basta; testes fortes demais",[32,28,23]],["Figuras 3.5-3.7: reversões em gráficos menores e com-tendência",[8,30]],["Figura 3.8: micro double bottoms e tops, contexto e final flags",[26,30,28]]],"tr":["Em tendência forte de 5 min, após cinco barras de baixa seguidas, o texto mostra vender a limit na máxima da barra anterior esperando o fracasso do primeiro rebote (padrão a favor da perna forte).","Para reversões, esperar o always-in sobe a chance de 40% para cerca de 60%, com stop maior e menos lucro; aceitar alvo de 2x o risco em retrações de 67%.","Reversões com compras a limit no sinal de bandeira final esperada em micro double bottom são citadas, mas exigem contexto e quebra prévia de linha."],"q":"ok","parts":[]},{"id":"l3c4","k":"livro","bk":3,"cap":4,"part":false,"t":"Reversões Climáticas: Um Impulso Seguido por um Impulso na Direção Oposta","pg":131,"o":80,"why":"","res":"Explica clímax como comportamento insustentável (vácuo, spikes consecutivos, parabólicos), como o spike oposto vira lateralidade ou canal, e como operar a reversão climática, os V, os spikes testados ou não, o volume e as falhas. Mostra uma série de figuras de gráfico.","L":[[29,"c",[1,2,3,4,5,6],"Todo o ciclo: clímax, spike oposto, lateralidade e canal; entrada no fechamento ou no sinal, stop do tamanho da barra, swing parcial."],[14,"s",[1,5],"Após spike e spike oposto, a disputa vira spike e canal na direção vencedora; início do canal costuma ser testado em dias."],[23,"c",[1,2,6],"Toda reversão climática é falha de rompimento; barra mais forte da tendência após 40 barras tem menos de 30% de chance."],[27,"s",[2,6],"Três clímax consecutivos funcionam como cunha; segunda é double top; cunhas de reversão exigem segundo sinal e quebra de linha."],[32,"s",[1,2,6],"O overshoot e a reversão do canal rompem a linha; desenhar linhas demais cega o trader; em canal íngreme não se entra contra."],[30,"s",[2,3],"Pausa após o segundo clímax ou barra única funciona como bandeira final; mini double bottoms entram junto com o V."],[26,"s",[2,3],"Micro duplo extremo, extremo de swing mais alto ou mais baixo e duplo extremo após a reversão dão segunda entrada de menor risco."],[28,"s",[1,2,3],"Quebra forte da linha e teste (extremo mais alto ou mais baixo) após a reversão formam reversão majoritária."],[21,"s",[5],"Clímax pode ser gap de exaustão ou gap de medição; alvos e confluência de ímãs explicam o extremo."],[12,"w",[6],"Canal estreito de 10 ou mais barras é insustentável, mas não entre contra só por isso; espere rompimento forte e rompimento e correção."],[33,"e",[2,3],"Reversões de abertura climáticas abaixo da mínima de ontem com dois sinais compraram acima da barra de reversão de duas barras."],[35,"e",[2],"Abertura com gap acima do canal em dia de baixa fez 20 gap bar short; reversão de abertura na mínima de ontem."],[42,"s",[5],"Com duas pernas prováveis, sempre realizar parte e manter uma parte para o caso de nova tendência."],[39,"s",[4],"Stop em torno do tamanho da barra de clímax (ex.: quatro pontos) ou acima/abaixo da barra de sinal; alargar exige reduzir a posição."],[38,"s",[3],"Entrar no fechamento da barra de clímax, além do extremo, no fechamento da seguinte, ou a stop depois do sinal."],[37,"s",[1],"Chance de teste de 60% ou mais do extremo da barra antes do stop torna o trade matematicamente sensato; reversões em V puras são raras."],[44,"w",[6],"Não preveja o que 'deveria' acontecer; opere só o que acontece; evite volume e indicadores, e só experientes devem contra-operar clímax."],[1,"s",[],"Mercado sempre tenta romper; todo spike é teste; extremos são seguidos de comportamento oposto; spikes a favor ou contra a tendência."],[2,"s",[],"Canal, linha de tendência e overshoot; quebra da linha versus do canal."],[0,"s",[],"Barra enorme de clímax, barras de pausa, reversão de duas barras como clímax oposto."],[4,"s",[],"Clímax consecutivos e correção de 10 barras com duas pernas."]],"secs":[["Clímax como comportamento insustentável; vácuo e comportamento de fortes e fracos",[29,23]],["Spikes: spike correção não precisa de teste; spike de reversão é testado; tempos gráficos",[29,7]],["Clímax consecutivos, cunha de clímax e como fortes entram (10 barras, duas pernas)",[29,27,38,39]],["Spike oposto, lateralidade que o segue, canal e overshoot do canal",[29,14,32]],["V bottoms raros, parabólicos, quebra de linha versus de canal e armadilhas",[29,32,30]],["Volume e reversões; reversões como rompimentos falhos",[23,44]],["Figuras 4.1-4.4: aceleração, exaustão, spike e canal",[29,14,12]],["Figuras 4.5-4.7: barras opostas e V bottoms",[29,30,26]],["Figuras 4.8-4.12: spikes testados ou não, aberturas climáticas",[29,33]],["Figuras 4.13-4.17: canais íngremes, inclinação, momentum, linhas demais e volume",[32,27,44]]],"tr":["Compras no fechamento da barra de clímax, com stop do tamanho da barra e cerca de 60% de chance de testar a máxima, são descritas como trade matematicamente sensato; a entrada é no fechamento, não a stop.","Em canal íngreme de baixa, os ursos fortes colocam limit de venda na máxima da barra anterior, onde compradores ansiosos entram; bons traders só compram abaixo das barras.","Evite reversões contra tendência fora do 5 min; o texto diz que o 1 min tem menos risco, porém chance menor, e perde."],"q":"ok","parts":[]},{"id":"l3c5","k":"livro","bk":3,"cap":5,"part":false,"t":"Cunhas e Outros Padrões de Reversão de Três Puxadas","pg":181,"o":75,"why":"","res":"Trata as cunhas e padrões de três puxadas como reversão (contra tendência, esperar segundo sinal) ou correção (a favor), mostra alvos (início do padrão e movimento projetado), cunha falha, shrinking stairs, micro cunhas e rompimentos de um tick, com figuras detalhadas.","L":[[27,"c",[1,2,3,4,5,6],"Capítulo central: formas, urgência, alvos, entrada após segundo sinal, falha da cunha, quarto puxada, micro cunhas e figuras."],[28,"s",[2,3],"O extremo da tendência costuma ter teste de duas pernas; cunha com extremo pior ou melhor que o anterior após quebra de linha é setup de reversão majoritária."],[25,"s",[2,5],"Cunha é um triângulo; triângulo expandido e extremo duplo de cunha são variantes tratadas igualmente; a falha vira rompimento projetado."],[29,"s",[1,2],"Cunha parabólica é comportamento climático; sinais de urgência e overshoot de canal; 60% de chance de duas pernas e 10 barras."],[23,"s",[2,5,6],"Falha de cunha e rompimento de um tick sucessivo; falha de duplo extremo é terceira puxada; rompimento fraco dá entrada contra em L1/L2 (H1/H2)."],[30,"s",[2,3,5],"Pausas pequenas após as puxadas funcionam como bandeiras finais; cunha pode crescer numa bandeira final maior."],[26,"s",[2,3],"Double top e lower high são variantes do terceiro puxada; cunha após double bottom e falha do rompimento abaixo da dupla."],[15,"s",[1,3],"Cunha de baixa de topo duplo, wedge bull flag e wedge bear flag como correções em tendência."],[7,"s",[1,3],"Cunha de correção com três puxadas em tendência é setup a favor; primeira entrada confiável; H2/L2 em cunha de tendência forte."],[19,"s",[2,5],"três puxadas de um tick em lateralidade preparam rompimento forte com movimento projetado igual à altura do padrão."],[12,"w",[6],"Cunha em canal estreito de baixa sem força prévia de alta não é compra; esperar segunda entrada ou lower low após falhas."],[22,"s",[1,3],"Em lateralidade, cunha age como correção e a primeira entrada é lucrativa; fade de rompimentos no topo e fundo do range."],[34,"s",[1,2],"Cunhas íngremes na primeira hora podem ser reversões de abertura confiáveis; depois de uma ou duas horas, evitar."],[21,"s",[5],"Alvo após cunha falha ou rompimento: aproximadamente a altura da cunha; alvos em máquinas computadas."],[9,"s",[3],"Segundo sinal (lower high, higher low) após cunha reversão e lower low como rompimento-e-correção."],[37,"s",[3,5],"A primeira entrada de reversão tem cerca de 40% e recompensa mínima de 2x; a entrada após rompimento tem 60% e 1x."],[40,"s",[5],"Primeiro alvo: início da cunha; depois movimento projetado; scalp; tomar o que o mercado dá."],[39,"s",[4],"Falha de cunha com um tick além: stops no extremo da cunha geram rompimento; breakeven em trades que atingem alvo curto."],[44,"w",[6],"Cunhas falham quando se luta contra tendência sem quebra de linha; não ver tudo como cunha; confiar no que o mercado faz."],[4,"s",[],"três puxadas, reset da contagem e quarto puxada, shrinking stairs, falha de um tick."],[2,"s",[],"Cunha como canal convergente; linha e linha de canal; overshoot parabólico."],[1,"s",[],"Cunha de reversão versus correção conforme o contexto de tendência ou lateralidade."]],"secs":[["Alvos e tipos de três puxadas; cunha como correção versus reversão",[27,7,40]],["Formação da cunha: urgência, linha de tendência e de canal, e comportamento de touros e ursos",[27,29]],["Teste do extremo, lower high, setup de segundo sinal e reversões rápidas",[27,28,9]],["Shrinking stairs, quarto puxada e cunha que falha",[27,23,40]],["Micro cunhas, cunhas de abertura e rompimentos de um tick",[27,34,19]],["Figuras 5.1-5.5: cunhas de topo, shrinking stairs e lower high",[27,28,26]],["Figuras 5.6-5.8: cunhas e parabólicas; trade e equação",[27,29,37]],["Figuras 5.9-5.12: cunha falha, apertada e rompimentos de um tick",[27,12,23]]],"tr":["Cunha de reversão contra tendência pede segundo sinal; se o primeiro sinal tem só cerca de 40% de acerto, o alvo precisa ser pelo menos o dobro do risco, e a entrada pós-rompimento aceita 1x com 60%.","Em lateralidade, comprar fundo de range com cunha e sinal de barra é aceito como primeira entrada, sem esperar segundo sinal; não vale em canal estreito de baixa."],"q":"ok","parts":[]},{"id":"l3c6","k":"livro","bk":3,"cap":6,"part":false,"t":"Triângulos Expandidos","pg":215,"o":85,"why":"","res":"Ensina o triângulo expandido (5 a 7 oscilações cada vez maiores) como reversão ou continuação, que prende traders a cada rompimento; alvos, evolução do padrão e quando falha.","L":[[25,"c",[1,2,3,5,6],"Pelo menos cinco oscilações crescentes; alvo inicial é romper o lado oposto, depois movimento projetado pela última perna; se falha, vira triângulo maior de sete pernas."],[27,"s",[1,2],"O triângulo expandido é variante de três puxadas com correções profundas; a terceira perna de baixo é compra de reversão com lower low."],[23,"s",[2,3,6],"Cada perna nova é rompimento falho em lateralidade; a quinta perna e o rompimento falho do topo 6 geram vendas e compras de reversão."],[10,"e",[3],"A terceira queda é vista como correção do rompimento da última máxima; barra 11 da Fig. 6.2 é H1 após espiga forte, entrada confiável."],[32,"s",[1,2],"O movimento final sempre rompe alguma linha de tendência contrária; sobreposição do canal e dois movimentos após falha da linha de canal."],[28,"s",[1],"Todos os triângulos expandidos são variantes de reversões majoritárias, porque a reversão final segue uma perna forte."],[22,"w",[6],"Triângulo é lateralidade; sem quebra de linha de tendência anterior, vender a segunda entrada na alta forte é imprudente; esperar máxima mais baixa."],[4,"s",[],"Conta de pernas do triângulo (5, 7 ou 9) e de puxadas, inclusive entradas H3 e segundas entradas."],[2,"s",[],"Linhas de canal de tendência e sua ultrapassagem falha ajudam a achar o triângulo e o alvo."]],"secs":[],"tr":["Compra na quinta perna do triângulo expandido com entrada um tick acima do lower low; swing parcial após a quinta perna quando pode surgir tendência maior."],"q":"ok","parts":[]},{"id":"l3c7","k":"livro","bk":3,"cap":7,"part":false,"t":"Bandeiras Finais","pg":223,"o":84,"why":"","res":"Explica que toda reversão segue algum tipo de bandeira final: características (tendência longa, bandeira horizontal de dois lados, pausa de uma barra), como rompe, falha e evolui, e como operar a favor e contra.","L":[[30,"c",[1,2,3,4,5,6],"Bandeira horizontal com barras sobrepostas e sombras, após tendência longa; rompimento só serve para scalp e reverte; alvo mínimo duas pernas, ~10 barras; quando falha vira correção."],[15,"s",[1,2],"Bandeira final é o mesmo comportamento do topo/fundo duplo: o rompimento da bandeira é segundo teste do extremo da tendência."],[29,"s",[1,3,5],"Clímax consecutivos de venda ou compra com barras enormes e volume geram final de uma/duas barras e reversão de duas pernas em ~10 barras."],[10,"s",[3,6],"Final flag falha: a reversão não segue, o mercado só corrige e o gatilho passa a ser compra/venda de correção do rompimento."],[8,"s",[3,4],"Após reversão, não vender L1/L2; comprar com limit na mínima ou 1-3 ticks abaixo da barra de sinal, arriscando cerca de 4 ticks no Emini."],[27,"e",[2],"Duas bandeiras horizontais consecutivas ou bandeiras crescentes viram cunha; extremo parabólico de três puxadas marca clímax."],[34,"e",[1,3],"Bandeiras finais pequenas na abertura geram reversões de abertura fortes, com ii de entrada."],[33,"s",[1],"Reversões majoritárias costumam virar lateralidade em vez de tendência oposta; bandeira de 50 a 100 barras vira mais bandeira grande que tendência oposta."],[24,"w",[6],"Com momentum muito forte e bandeira curta que não quebrou a linha de tendência, busque só entradas a favor; correção lateral é mais provável que reversão."],[1,"s",[],"Tendência longa, always in, clímax e bandeira sem rompimento mostram a premissa trocando de lado; rompimento fecha vários ticks além da bandeira."],[0,"s",[],"Barras com sombra, dojis, sobreposição acima de 50% e barra de pausa como bandeira de uma barra; volume 10x como confirmação."]],"secs":[["Características e comportamento das bandeiras finais",[30,15]],["Três modos de rompimento, falha e limit contra L1/L2/H1/H2",[30,8,10]],["Figuras 7.1-7.4: reversão em venda climática, faixa estreita e lower high",[30,29,10]],["Figuras 7.5-7.8: reversão sem rompimento e finais pequenos na abertura",[30,34,27]],["Figuras 7.9-7.11: finais encadeados e gráfico mensal",[30,29]]],"tr":["Em bandeira final de baixa após reversão, comprar com ordem limitada na mínima ou 1-3 ticks abaixo da barra de sinal de L1/L2, risco de cerca de 4 ticks no Emini.","Vender L1/L2 só é confiável na espiga de tendência forte, nunca depois de padrão de reversão; compras de H1/H2 em bandeira final de alta são ao contrário.","Entrada a mercado no fechamento da barra de espiga forte vale um último scalp antes de correção quando há sombra ou corpo oposto na barra seguinte."],"q":"ok","parts":[]},{"id":"l3c8","k":"livro","bk":3,"cap":8,"part":false,"t":"Correções Após Topos e Fundos Duplos","pg":257,"o":96,"why":"","res":"Ensina a correção de fundo/topo duplo (terceiro puxada com mínima mais alta) como reversão de três puxadas e rompimento-correção; como qualificar a versão forte e fraca.","L":[[26,"c",[1,2,3,4,5,6],"Segundo fundo pode ser menor; correção testa logo acima do fundo; entrada na barra acima da máxima; probabilidade ~60% para scalp, 70%+ no rompimento forte."],[10,"c",[2,3],"O movimento a partir do segundo extremo é rompimento; a correção seguinte é um dos setups mais confiáveis, muitas vezes com formato de ombro-cabeça-ombro."],[27,"s",[1,2],"O padrão é uma puxada tripla em que o terceiro lado não consegue novo extremo; a forma de triplo extremo, triângulo ou final tem o mesmo significado."],[15,"s",[1,2],"Distingue fundo duplo reversão do fundo duplo bandeira de alta (continuação); topo duplo em tendência de baixa é L2."],[25,"s",[2,5],"Topo e fundo duplos na mesma lateralidade formam triângulo; volta ao meio e teste de um lado; rompimento forte segue a tendência anterior."],[22,"s",[3,5],"Em faixa ampla, scalpar topos e fundos com razão risco-retorno 1:1 e ~60% de acerto."],[7,"w",[6],"Em tendência muito forte, duplo extremo ligeiramente melhor que o anterior e sem rompimento de linha costuma ser só bandeira; prefira entrar a favor na média."],[3,"s",[],"O padrão sempre ocorre em suporte; teste de extremo do dia anterior e média ajudam."],[0,"s",[],"Barras externas como barra de entrada, barras internas como pausa e correção; barra de sinal fraca reduz a confiança."]],"secs":[],"tr":["Comprar fundo duplo com correção usando entrada a stop na barra que passa a máxima do sinal, depois de terceiro puxada; segundo fundo mais baixo é aceitável, ele ajuda por ser desfeito do stop.","Em faixa, scalpar com razão 1:1 tem cerca de 60% de acerto; rompimento forte de faixa estreita dá 70% ou mais."],"q":"ok","parts":[]},{"id":"l3c9","k":"livro","bk":3,"cap":9,"part":false,"t":"Falhas","pg":269,"o":103,"why":"Reúne os cenários em que o padrão não funciona e como reconhecê-los em tempo real.","res":"Mostra que todo padrão falha cerca de 40% das vezes e que a falha gera setup contrário; trata falhas de rompimento de um tick, falhas de alvo (5, 9, 17 ticks), ombro-cabeça-ombro e tentativas de reversão que falham.","L":[[23,"c",[1,2,3,4,5,6],"Rompimento de máxima ou mínima oscilante em dia lateral: vender a stop um tick abaixo da barra anterior; falha de um tick é comum no Emini."],[22,"c",[1,3,5],"Em dia de faixa, rompimentos fracos falham; fade com segunda entrada ou perto das bordas; seguir no topo contra vendas."],[10,"s",[3],"Teste do rompimento até o tick exato prende traders fracos; perder o stop de equilíbrio por um tick sinaliza correção do rompimento confiável a favor."],[26,"w",[6],"Ombro-cabeça-ombro e duplo extremo sem fraqueza prévia falham; sem quebra de linha anterior, a forma sozinha não basta."],[29,"w",[6],"A maioria das tentativas de reversão falha: espiga contra tendência forte, mesmo no fundo de espiga de baixa, é oportunidade de compra a favor."],[8,"s",[3],"Compradores ansiosos usam limites abaixo da barra e não chegam à média: falha em alcançar nível mostra urgência de tendência forte."],[21,"s",[5,6],"Perder o alvo projetado por 3 ticks e testá-lo depois de correção é comum; 4+ ticks além significa ignorar o alvo."],[7,"s",[3],"Falha de queda abaixo da barra anterior em alta forte indica urgência; comprar a segunda tentativa H2."],[43,"c",[1,3,6],"Traders presos saem um tick além da barra de sinal ou entrada; entrar a stop exatamente nesse ponto rende ao menos um scalp."],[40,"s",[5,6],"Alvos de 4 pontos falham aos 17 ticks; reduzir alvo ou subir stop quando não preenche, nunca transformar lucro de 9 ticks em perda."],[39,"s",[4],"Stops protetores um tick além da barra de sinal ou entrada são alvo natural de falhas; teste que não atinge o stop é força."],[3,"s",[],"Falha em atingir ímãs (projeção, extremos, linhas) leva à correção e a nova tentativa."]],"secs":[["Tipos de falha e por que a falha de um tick acontece",[23,10]],["Falhas de alvo de 5/9/17 ticks e stops presos",[23]],["Figuras 9.1-9.9: falhas de um tick e rompimento de faixa",[23,22]],["Figuras 9.10-9.15: ombro-cabeça-ombro, falhas de sinais e alvos menores",[26,23]],["Figuras 9.16-9.19: espigas de venda e falhas como força",[29,8,21]]],"tr":["Para scalp de 4 ticks no Emini, o rompimento precisa de cerca de 6 ticks; falha em 5 ticks ou em 17 ticks para alvo de 4 pontos indica perda de força e vale contra.","Depois de 9 ticks de lucro, não deixe o trade virar perda: arriscar 8 ticks para ganhar 1 tem equação péssima; usar stop móvel.","Primeira falha de rompimento da máxima oscilante: ordem de venda a stop um tick abaixo da barra anterior, mudar a cada barra enquanto não executa."],"q":"ok","parts":[]},{"id":"l3c11","k":"livro","bk":3,"cap":11,"part":false,"t":"Períodos do dia","pg":311,"o":18,"why":"Horários em que costumam surgir rompimentos e reversões. Útil para ajustar ao horário em que se opera.","res":"Divide o dia em três períodos: primeira hora ou duas (melhor razão risco-retorno), meio do dia (lateral, difícil de operar com stops) e final (retomada ou reversão, tendências para o fechamento por gestores de risco).","L":[[17,"s",[1],"Movimento no meio do dia que reverte o primeiro terço costuma ser só correção; esperar retomada da tendência por volta de 11:30."],[34,"s",[1,3],"A primeira hora ou duas dão melhor retorno, de 2 a 3x o risco; o extremo do dia se forma no primeiro terço em cerca de 90% dos dias de tendência."],[24,"w",[1,6],"No meio do dia faixas estreitas são comuns e entrada a stop vai contra instituições; iniciantes perdem, melhor não operar."],[33,"s",[1],"Final do dia pode reverter a tendência; muitos dias de reversão começam como tendência."],[8,"s",[3],"Em lateralidade, vender com limit acima de barras H1/H2 fracas no topo e comprar abaixo de L1/L2 fracas no fundo."],[38,"s",[3],"Em lateralidade usar limit para comprar baixo e vender alto; evitar stops no meio do dia; em notícias, esperar a ordem de mercado normalizar."],[6,"c",[],"Três períodos do dia, notícias das 7h PST, FOMC, meio do dia e tendências para o fechamento."],[1,"s",[],"Tendência diária prévia define se o fechamento tende a ser perto da máxima ou mínima."]],"secs":[],"tr":["No final do dia, com tendência relentless, entrar a favor no fechamento da barra atual com stop além da outra ponta da barra, sem esperar correção que não vem.","Em lateralidade, comprar baixo e vender alto com limit é o que as instituições fazem; entrar a stop perto do extremo é armadilha."],"q":"ok","parts":[]},{"id":"l3c14","k":"livro","bk":3,"cap":14,"part":false,"t":"Globex, Pré-abertura, Pós-mercado, e Overnight","pg":337,"o":19,"why":"Em mercados negociados quase 24h, como CFDs de índice, a abertura pesa diferente do que nos livros.","res":"Os mesmos padrões valem fora do pregão; extremos do pré-mercado atuam como alvos; pós-mercado de balanços é difícil de operar; sessão diurna basta.","L":[[36,"s",[1],"Máximas e mínimas do dia anterior e do Globex agem como ímãs; triângulo expandido do Globex não precisa ser visto para vender a barra 5."],[34,"e",[1],"Pré-mercado tem poucas entradas na hora ou duas antes da abertura; relatórios criam rompimentos falsos e barras externas."],[30,"e",[2],"No pós-mercado de DELL, barra 4 foi bandeira final de venda após clímax de compra e quebra de linha de tendência."],[44,"s",[6],"Não operar balanços no pós-mercado nem relatórios nos primeiros segundos: movimentos rápidos, slippage e mercado que para de repente."],[6,"c",[],"Globex, pré, pós-mercado e horas de relatórios como contexto de tempo."]],"secs":[],"tr":[],"q":"ok","parts":[]},{"id":"l3c15","k":"livro","bk":3,"cap":15,"part":false,"t":"Modo Sempre Posicionado","pg":343,"o":4,"why":"","res":"Define a direção always-in como o conceito mais importante: como determinar, o papel da espiga e da barra de continuação, entradas a mercado, alvo de 2x o risco, probabilidade de 60% e escalonamento.","L":[[18,"c",[2,3,4],"Após spike forte e barra de continuidade sem fechamento contrário, entre no fechamento ou em correção mínima, com stop além da outra ponta da barra ou do spike."],[7,"s",[3],"Com always-in long, comprar no fechamento de barras de baixa, abaixo da barra anterior e em H1/H2; com always-in short, vender topos."],[21,"s",[5],"Com continuação confirmada, o movimento projetado pela espiga ou lateralidade é alvo; probabilidade de 60% sobe e a recompensa cresce."],[8,"s",[3,5],"Escalone entradas com limite em recuos de 10 a 20% da faixa diária média em tendência forte; saia se o always-in virar contra."],[24,"w",[1,6],"Always-in é método de swing em tendência; não usar em lateralidade estreita nem perto da borda; compra no topo e venda no fundo erram."],[19,"s",[1,3],"Faixa minúscula após abertura com gap é modo de rompimento: stops de compra acima e venda abaixo; rompimento forte vira tendência."],[30,"e",[1,6],"Barras grandes consecutivas após 20+ barras e bandeira final sugerem clímax; always-in oposto exige força."],[37,"c",[1,3,5],"Com always-in a probabilidade é ao menos 60%; alvo ao menos igual ao risco tem equação favorável; negar a probabilidade é erro comum."],[41,"s",[3,5],"Escalonar entrada com limit em recuos e sair de parte em 1-3x o risco; reverter com posição dobrada ao fim do sinal oposto."],[40,"s",[5],"Sair de 1/3 a 1/2 ao dobro do risco e deixar um quarto até stop em equilíbrio, sinal oposto ou fechamento."],[39,"s",[4],"Stop além da espiga, tamanho de posição reduzido se stop grande; stop em equilíbrio após recuo que não retorna."],[42,"s",[1],"Always-in é abordagem de swing para 3 a 10 oscilações por dia, não reverter em todo sinal."],[1,"c",[],"Always-in: direção atual, consenso, incerteza como sinal de lateralidade, espiga necessária, flips que falham."],[0,"s",[],"Barras de tendência consecutivas e fechamento da barra de continuação definem a viragem."]],"secs":[["Definição e como determinar always-in",[18]],["Espiga, continuação, medida e probabilidade 60%",[18,21]],["Entrada, stops, gestão e escalonamento",[8,18]],["Figuras 15.1-15.3: swing always-in e dia de gap",[19,30,18]],["Figuras 15.4-15.6: viragens e follow-through",[18,21]]],"tr":["Rompimento de várias barras fortes: entrar a mercado no fechamento da barra de continuação, com stop abaixo (ou acima) da outra ponta da barra, ou da espiga; reduzir tamanho se o stop for grande.","Alvo mínimo igual ao risco (ex.: stop de 2 pontos, alvo de 2 ou mais) é favorável quando a leitura é always-in; probabilidade de ao menos 60%, não 50%.","Sair de parte depois de 1-3x o risco; tendências que viram faixa mantêm always-in; evitar contra-tendência com risco de 2x a recompensa."],"q":"ok","parts":[]},{"id":"l3c17","k":"livro","bk":3,"cap":17,"part":false,"t":"Padrões relacionados à pré-abertura","pg":411,"o":21,"why":"","res":"Explica como o Globex e o gráfico da sessão diária dão sinais relacionados, e por que quem opera só a sessão diária deve desconfiar da média móvel na primeira hora com gap grande. Recomenda escolher um só gráfico.","L":[[36,"c",[1,2],"Máximas e mínimas do Globex tendem a ser testadas na sessão; padrões do Globex se completam nas primeiras barras do dia."],[35,"s",[1,2],"Com gap grande fechando nos primeiros 30 min, a média do Globex pode ir contra a da sessão; olhar o momentum, não a média."],[34,"s",[1,3],"Se a primeira barra do dia é de tendência, é setup de scalp; se falha com barra oposta, vira setup contrário."],[30,"e",[2],"No exemplo, o Globex deu reversão de bandeira final enquanto a sessão deu reversão em correção de rompimento."],[6,"s",[],"Globex e sessão diária; a barra de abertura da sessão contém ticks pré-abertura; escolher um gráfico."],[5,"s",[],"Gap grande distorce a média móvel na primeira hora."],[1,"s",[],"Momentum prevalece sobre a média quando a média é enganosa."]],"secs":[],"tr":["Não tentar acompanhar dois gráficos ao mesmo tempo; é preferível perder uma entrada a se confundir ao posicionar entrada, stop e alvo."],"q":"ok","parts":[]},{"id":"l3c18","k":"livro","bk":3,"cap":18,"part":false,"t":"Padrões Relativos ao Dia Anterior: Rompimentos, Rompimentos e Correções, e Falhas de Rompimentos","pg":415,"o":112,"why":"","res":"Ensina a antecipar a abertura olhando a última ou as duas últimas horas de ontem: a abertura quase sempre rompe algo, e o trader avalia se o rompimento segue, falha (reversão) ou a falha falha (correção de rompimento).","L":[[36,"c",[1,2,3,5,6],"Padrões do fim de ontem (canais, bandeiras, tendência) geram o rompimento da abertura; operar falha de rompimento e depois correção."],[23,"c",[2,3,4],"Abertura rompe padrão de ontem e reverte: entrada acima/abaixo da barra de reversão; reversões da máxima/mínima de ontem são extremos do dia."],[10,"c",[2,3,6],"Se a falha de rompimento falha, vira correção de rompimento e continuação; avaliar sempre se a reversão tem continuidade."],[34,"c",[1,2,3],"Primeira barra forte com gap pode iniciar tendência desde a abertura; barras sem sombra e pouca sobreposição aumentam a chance."],[26,"s",[2,3,5],"Na primeira hora, duplo topo ou fundo frequentemente marca o extremo do dia ou das próximas horas."],[27,"s",[2,6],"Cunha e triângulo expandido no extremo exigem ao menos correção de duas pernas e cerca de 10 barras."],[32,"s",[2,3],"Quebra de linha de tendência na correção precede reversão; falha de quebra de linha em tendência forte é entrada a favor."],[7,"e",[3],"Exemplos de L2/H2 e L1/H1 em tendência da abertura; H1 não é bom após impulso que virou clímax."],[12,"w",[6],"Canal estreito contra a entrada torna arriscado entrar na falha de rompimento; espere o rompimento e depois a correção."],[14,"e",[1,2],"Impulso e canal de ontem terminando em cunha antecipam correção; o gap de abertura também age como impulso."],[3,"s",[],"Máxima, mínima e fechamento de ontem funcionam como magnetos e pontos de reversão."],[1,"s",[],"Avaliar se a abertura é rompimento e se há continuidade define o dia."],[2,"s",[],"Canais de ontem viram bandeiras; quebras de linha indicam agressividade."],[4,"s",[],"H2/L2, duas pernas e três puxadas aparecem em todos os exemplos."]],"secs":[],"tr":["Quando a abertura reverte a máxima ou mínima de ontem, o texto sugere carregar parte ou a maior parte da posição, com stop em breakeven."],"q":"ok","parts":[]},{"id":"l3c19","k":"livro","bk":3,"cap":19,"part":false,"t":"Padrões e Reversões na Abertura","pg":433,"o":22,"why":"","res":"Explica o efeito vácuo e as reversões de abertura, probabilidades de swing nas primeiras barras, classificação do range de abertura pelo tamanho e os padrões comuns (breakout, falha, correção de rompimento, duplo topo/fundo, barbwire).","L":[[34,"c",[1,2,3,4,5,6],"Abertura gera rompimento ou reversão; classificar o range de abertura, buscar duplo topo/fundo para swing e realizar parciais gradualmente."],[33,"c",[1,2,5],"Dia de reversão costuma nascer como tendência de lateralidades que rompe de volta o range inicial e fecha do lado oposto."],[23,"c",[2,3],"Reversões de abertura em suporte/resistência (média, linhas, extremo de ontem) são falhas de rompimento; só 25 a 30% viram swing."],[10,"c",[2,3,6],"Reversão curta que volta no sentido do impulso vira correção de rompimento; entre além da barra anterior na correção."],[26,"c",[2,3,5],"Máxima do dia vem de algum duplo topo, mínima de duplo fundo; após o duplo, 40-50% de chance de swing."],[17,"s",[1,2,5],"Range de abertura pequeno (~25% do típico) leva a rompimento e correções pequenas; dia de tendência desde a abertura."],[24,"w",[6],"Barbwire de abertura sem setup seguro: esperar um lado ser preso por barra de tendência e então fazer a falha."],[35,"s",[1,2,3],"Gap grande com correção de duas pernas à média costuma virar tendência; a tendência frequentemente começa por volta de 8h30 PST."],[21,"s",[5],"Rompimento do range de abertura mira movimento projetado pela altura do range; teste do ponto de rompimento depois."],[15,"c",[2,3],"Fundo duplo em bandeira de alta e topo duplo em bandeira de baixa são continuação; entrada a stop abaixo/acima da barra de setup."],[27,"s",[2,3],"Cunhas, L2/H2 e triângulos no range de abertura; duas tentativas falhas de romper indicam o lado oposto."],[29,"s",[2],"Movimento grande de abertura pode virar impulso e canal ou reversão climática após pequena bandeira final."],[6,"s",[],"Primeiro hora, 90% dos dias têm extremo nas primeiras 1-2 horas; primeira barra tem ~20% de ser extremo."],[0,"s",[],"Duas barras de tendência seguidas na primeira hora sugerem always in; barra forte sem sombra aumenta chance."],[1,"s",[],"Range de abertura e sinais iniciais indicam tipo de dia."],[3,"s",[],"Reversões ocorrem em suporte/resistência: média, linhas, extremo de ontem, alvo projetado."]],"secs":[["Efeito vácuo e reversões de abertura",[34,23]],["Probabilidades e estratégia swing/scalp na abertura",[34]],["Tamanho do range de abertura e dia que se forma",[34,21,33]],["Parciais e gerenciamento de reversões na abertura",[34]],["Exemplos: correções de rompimento, falhas, duplos e gap",[10,23,15,35]],["Barbwire e abertura sem setup",[24,23]]],"tr":["Reversões na abertura: cerca de 60% chegam a 1x o risco, ~30% a 2x; sugere scalp de 1x ou swing com parciais após 1-2x o risco.","Em swing de reversão, tirar um quarto a metade em 2-4 pontos e outra parte em 4-6, mantendo o resto com stop em breakeven.","Equação do Emini na abertur
